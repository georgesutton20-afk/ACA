:\"There are two performance obligations. The transaction price is allocated on relative stand-alone selling prices: £900 to the licence (recognised at the point control transfers) and £300 to support (recognised over the 12 months).\",\"workedSolution\":\"Licence: 1,200 × 900/1,200 = £900 at a point in time.\\nSupport: 1,200 × 300/1,200 = £300 over 12 months (£25/month).\",\"relatedConcepts\":[\"Performance obligations\",\"Transaction price allocation\"],\"rating\":1400,\"estSeconds\":60,\"isPublished\":true,\"answers\":[{\"id\":\"a-q-far-1-0-8\",\"questionId\":\"q-far-1\",\"label\":\"There are two performance obligations\",\"isCorrect\":true,\"feedback\":\"Correct — the licence and support are distinct.\",\"sortOrder\":0},{\"id\":\"a-q-far-1-1-9\",\"questionId\":\"q-far-1\",\"label\":\"£900 is recognised when the licence is transferred\",\"isCorrect\":true,\"feedback\":\"Correct — licence revenue is point-in-time.\",\"sortOrder\":1},{\"id\":\"a-q-far-1-2-10\",\"questionId\":\"q-far-1\",\"label\":\"All £1,200 is recognised immediately\",\"isCorrect\":false,\"feedback\":\"No — support is recognised over time.\",\"sortOrder\":2},{\"id\":\"a-q-far-1-3-11\",\"questionId\":\"q-far-1\",\"label\":\"£300 is recognised evenly over 12 months\",\"isCorrect\":true,\"feedback\":\"Correct — £25 per month for the support obligation.\",\"sortOrder\":3}]},{\"id\":\"x-far-rev-1\",\"topicId\":\"t-far-rev\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"What is the correct order of the IFRS 15 five-step revenue model?\",\"explanation\":\"1) Identify the contract; 2) identify performance obligations; 3) determine the transaction price; 4) allocate it to the obligations; 5) recognise revenue as/when obligations are satisfied.\",\"relatedConcepts\":[\"IFRS 15\",\"Five-step model\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-x-far-rev-1-0-88\",\"questionId\":\"x-far-rev-1\",\"label\":\"Contract → obligations → price → allocate → recognise\",\"isCorrect\":true,\"feedback\":\"Correct — the IFRS 15 sequence.\",\"sortOrder\":0},{\"id\":\"a-x-far-rev-1-1-89\",\"questionId\":\"x-far-rev-1\",\"label\":\"Price → contract → recognise → obligations → allocate\",\"isCorrect\":false,\"feedback\":\"Incorrect order.\",\"sortOrder\":1},{\"id\":\"a-x-far-rev-1-2-90\",\"questionId\":\"x-far-rev-1\",\"label\":\"Recognise → allocate → price → obligations → contract\",\"isCorrect\":false,\"feedback\":\"This is reversed.\",\"sortOrder\":2},{\"id\":\"a-x-far-rev-1-3-91\",\"questionId\":\"x-far-rev-1\",\"label\":\"Obligations → recognise → contract → price → allocate\",\"isCorrect\":false,\"feedback\":\"Incorrect order.\",\"sortOrder\":3}]},{\"id\":\"f-far-rev-1\",\"topicId\":\"t-far-rev\",\"difficulty\":\"hard\",\"scenario\":\"On 1 January 20X4 Aspen Ltd sells equipment for £500,000 with a 2-year servicing contract. The stand-alone selling prices are £460,000 (equipment) and £90,000 (2 years' servicing).\",\"stem\":\"How much revenue should Aspen recognise for the equipment on delivery (1 Jan 20X4), to the nearest £?\",\"explanation\":\"Allocate the £500,000 transaction price on relative stand-alone selling prices. Equipment share = 460/(460+90).\",\"workedSolution\":\"Equipment = 500,000 × 460/550 = £418,182 (recognised at the point control transfers).\",\"relatedConcepts\":[\"Transaction price allocation\",\"Performance obligations\"],\"numericAnswer\":418182,\"numericTolerance\":50,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"f-far-rev-2\",\"topicId\":\"t-far-rev\",\"type\":\"scenario\",\"difficulty\":\"hard\",\"scenario\":\"Bramble Ltd sells goods for £2m but, based on experience, expects returns of 4%. Control of the goods has transferred.\",\"stem\":\"How should the expected returns be reflected under IFRS 15?\",\"explanation\":\"Variable consideration: recognise revenue only to the extent highly probable it won't reverse. Recognise revenue of £1.92m, a refund liability of £80,000, and a corresponding right-to-recover-returned-goods asset.\",\"relatedConcepts\":[\"Variable consideration\",\"Refund liability\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-f-far-rev-2-0-144\",\"questionId\":\"f-far-rev-2\",\"label\":\"Recognise revenue of £1.92m and a refund liability of £80,000\",\"isCorrect\":true,\"feedback\":\"Correct — constrain revenue for expected returns.\",\"sortOrder\":0},{\"id\":\"a-f-far-rev-2-1-145\",\"questionId\":\"f-far-rev-2\",\"label\":\"Recognise the full £2m and ignore returns until they occur\",\"isCorrect\":false,\"feedback\":\"Variable consideration must be estimated and constrained.\",\"sortOrder\":1},{\"id\":\"a-f-far-rev-2-2-146\",\"questionId\":\"f-far-rev-2\",\"label\":\"Recognise no revenue until the return period ends\",\"isCorrect\":false,\"feedback\":\"Revenue is recognised now, net of expected returns.\",\"sortOrder\":2},{\"id\":\"a-f-far-rev-2-3-147\",\"questionId\":\"f-far-rev-2\",\"label\":\"Recognise £2m revenue and a £80,000 expense\",\"isCorrect\":false,\"feedback\":\"Returns reduce revenue via a refund liability, not an expense.\",\"sortOrder\":3}]},{\"id\":\"f-far-rev-3\",\"topicId\":\"t-far-rev\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"scenario\":\"Cedar Ltd arranges sales between hotels and customers, taking a 10% commission. It never controls the room before sale.\",\"stem\":\"How should Cedar recognise revenue?\",\"explanation\":\"Cedar is an agent (it does not control the service before transfer), so it recognises only the net commission, not the gross amount.\",\"relatedConcepts\":[\"Principal vs agent\",\"Gross vs net\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-f-far-rev-3-0-148\",\"questionId\":\"f-far-rev-3\",\"label\":\"As an agent — recognise only the net commission\",\"isCorrect\":true,\"feedback\":\"Correct — it does not control the service before transfer.\",\"sortOrder\":0},{\"id\":\"a-f-far-rev-3-1-149\",\"questionId\":\"f-far-rev-3\",\"label\":\"As a principal — recognise the gross room price\",\"isCorrect\":false,\"feedback\":\"Cedar never controls the room, so it is an agent.\",\"sortOrder\":1},{\"id\":\"a-f-far-rev-3-2-150\",\"questionId\":\"f-far-rev-3\",\"label\":\"No revenue until the customer checks out\",\"isCorrect\":false,\"feedback\":\"Timing is not the issue; agent vs principal is.\",\"sortOrder\":2},{\"id\":\"a-f-far-rev-3-3-151\",\"questionId\":\"f-far-rev-3\",\"label\":\"Half gross, half net\",\"isCorrect\":false,\"feedback\":\"There is no such split under IFRS 15.\",\"sortOrder\":3}]}],\"t-far-lease\":[{\"id\":\"x-far-lease-1\",\"topicId\":\"t-far-lease\",\"difficulty\":\"hard\",\"stem\":\"A lessee enters a 3-year lease with payments of £10,000 in arrears each year. The interest rate implicit is 8% (3-year annuity factor at 8% = 2.577). What is the initial lease liability (right-of-use measurement basis), to the nearest £?\",\"explanation\":\"The lease liability is the present value of the lease payments = annual payment × annuity factor.\",\"workedSolution\":\"Liability = 10,000 × 2.577 = £25,770\",\"relatedConcepts\":[\"IFRS 16\",\"Lease liability\",\"Present value\"],\"numericAnswer\":25770,\"numericTolerance\":50,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"x-far-lease-2\",\"topicId\":\"t-far-lease\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Under IFRS 16, how does a lessee generally account for a lease (other than short-term/low-value exemptions)?\",\"explanation\":\"The lessee recognises a right-of-use asset and a lease liability; the asset is depreciated and the liability accrues interest.\",\"relatedConcepts\":[\"IFRS 16\",\"Right-of-use asset\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-x-far-lease-2-0-92\",\"questionId\":\"x-far-lease-2\",\"label\":\"Recognise a right-of-use asset and a lease liability\",\"isCorrect\":true,\"feedback\":\"Correct — the single lessee model under IFRS 16.\",\"sortOrder\":0},{\"id\":\"a-x-far-lease-2-1-93\",\"questionId\":\"x-far-lease-2\",\"label\":\"Charge rentals to profit or loss on a straight-line basis only\",\"isCorrect\":false,\"feedback\":\"That is the old operating-lease (IAS 17) treatment.\",\"sortOrder\":1},{\"id\":\"a-x-far-lease-2-2-94\",\"questionId\":\"x-far-lease-2\",\"label\":\"Recognise the leased asset at full market value\",\"isCorrect\":false,\"feedback\":\"It is measured at the present value of payments plus initial costs.\",\"sortOrder\":2},{\"id\":\"a-x-far-lease-2-3-95\",\"questionId\":\"x-far-lease-2\",\"label\":\"Recognise nothing until ownership transfers\",\"isCorrect\":false,\"feedback\":\"Recognition is at commencement of the lease.\",\"sortOrder\":3}]},{\"id\":\"f-far-lease-1\",\"topicId\":\"t-far-lease\",\"difficulty\":\"hard\",\"scenario\":\"On 1 Jan 20X4 Dune Ltd leases a machine: 4 annual payments of £20,000 in arrears, interest rate implicit 7% (4-year annuity factor 3.387). Dune also incurs £3,000 initial direct costs.\",\"stem\":\"What is the initial carrying amount of the right-of-use asset, to the nearest £?\",\"explanation\":\"ROU asset = initial lease liability (PV of payments) + initial direct costs (+ prepayments − incentives).\",\"workedSolution\":\"Liability = 20,000 × 3.387 = 67,740\\nROU = 67,740 + 3,000 = £70,740\",\"relatedConcepts\":[\"Right-of-use asset\",\"Initial direct costs\"],\"numericAnswer\":70740,\"numericTolerance\":50,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"f-far-lease-2\",\"topicId\":\"t-far-lease\",\"difficulty\":\"hard\",\"scenario\":\"Using Dune Ltd's lease (initial liability £67,740, implicit rate 7%, £20,000 paid annually in arrears).\",\"stem\":\"What is the lease liability carried forward at 31 December 20X4, to the nearest £?\",\"explanation\":\"Interest accrues on the opening liability, then the payment reduces it. Closing = opening + interest − payment.\",\"workedSolution\":\"Interest = 67,740 × 7% = 4,742\\nClosing = 67,740 + 4,742 − 20,000 = £52,482\",\"relatedConcepts\":[\"Lease liability\",\"Amortised cost\"],\"numericAnswer\":52482,\"numericTolerance\":50,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"f-far-lease-3\",\"topicId\":\"t-far-lease\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Under IFRS 16, which lease may a lessee elect NOT to capitalise (recognising payments as an expense instead)?\",\"explanation\":\"Lessees may elect exemptions for short-term leases (≤12 months) and leases of low-value assets.\",\"relatedConcepts\":[\"IFRS 16 exemptions\",\"Short-term leases\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-f-far-lease-3-0-152\",\"questionId\":\"f-far-lease-3\",\"label\":\"A 9-month lease of office equipment\",\"isCorrect\":true,\"feedback\":\"Correct — a short-term lease (≤12 months) qualifies for the exemption.\",\"sortOrder\":0},{\"id\":\"a-f-far-lease-3-1-153\",\"questionId\":\"f-far-lease-3\",\"label\":\"A 5-year lease of a building\",\"isCorrect\":false,\"feedback\":\"Long-term leases must be capitalised.\",\"sortOrder\":1},{\"id\":\"a-f-far-lease-3-2-154\",\"questionId\":\"f-far-lease-3\",\"label\":\"A 10-year lease of machinery\",\"isCorrect\":false,\"feedback\":\"Must be capitalised.\",\"sortOrder\":2},{\"id\":\"a-f-far-lease-3-3-155\",\"questionId\":\"f-far-lease-3\",\"label\":\"Any lease the directors prefer to expense\",\"isCorrect\":false,\"feedback\":\"Exemptions are limited to short-term and low-value assets.\",\"sortOrder\":3}]}],\"t-far-tax\":[{\"id\":\"q-far-2\",\"topicId\":\"t-far-tax\",\"type\":\"mcq\",\"difficulty\":\"hard\",\"stem\":\"An asset has a carrying amount of £100,000 and a tax base of £60,000. The tax rate is 25%. What deferred tax balance arises?\",\"explanation\":\"Carrying amount \u003e tax base gives a taxable temporary difference of £40,000, so a deferred tax liability of £40,000 × 25% = £10,000.\",\"workedSolution\":\"Temp diff = 100,000 − 60,000 = 40,000\\nDT liability = 40,000 × 25% = £10,000\",\"relatedConcepts\":[\"Temporary differences\",\"Tax base\"],\"rating\":1400,\"estSeconds\":60,\"isPublished\":true,\"answers\":[{\"id\":\"a-q-far-2-0-12\",\"questionId\":\"q-far-2\",\"label\":\"Deferred tax liability £10,000\",\"isCorrect\":true,\"feedback\":\"Correct — a taxable temporary difference creates a DT liability.\",\"sortOrder\":0},{\"id\":\"a-q-far-2-1-13\",\"questionId\":\"q-far-2\",\"label\":\"Deferred tax asset £10,000\",\"isCorrect\":false,\"feedback\":\"An asset arises from deductible differences (carrying \u003c tax base).\",\"sortOrder\":1},{\"id\":\"a-q-far-2-2-14\",\"questionId\":\"q-far-2\",\"label\":\"Deferred tax liability £25,000\",\"isCorrect\":false,\"feedback\":\"You have applied the rate to the carrying amount, not the difference.\",\"sortOrder\":2},{\"id\":\"a-q-far-2-3-15\",\"questionId\":\"q-far-2\",\"label\":\"No deferred tax arises\",\"isCorrect\":false,\"feedback\":\"A £40,000 temporary difference exists.\",\"sortOrder\":3}]},{\"id\":\"x-far-tax-1\",\"topicId\":\"t-far-tax\",\"difficulty\":\"hard\",\"stem\":\"A liability has a carrying amount of £50,000 and a tax base of £nil (the related expense is deductible only when paid). The tax rate is 25%. What deferred tax asset arises (£)?\",\"explanation\":\"Carrying amount of a liability \u003e tax base gives a deductible temporary difference, creating a deferred tax asset.\",\"workedSolution\":\"Temp diff = 50,000 − 0 = 50,000 (deductible)\\nDT asset = 50,000 × 25% = £12,500\",\"relatedConcepts\":[\"Deductible temporary difference\",\"Deferred tax asset\"],\"numericAnswer\":12500,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"f-far-tax-1\",\"topicId\":\"t-far-tax\",\"difficulty\":\"hard\",\"scenario\":\"Elm Ltd revalues land upward by £200,000. The revaluation is not taxable until disposal. The tax rate is 25%.\",\"stem\":\"What deferred tax balance arises on the revaluation (£)?\",\"explanation\":\"A revaluation creates a taxable temporary difference, so a deferred tax liability — recognised against revaluation surplus (OCI).\",\"workedSolution\":\"DT liability = 200,000 × 25% = £50,000\",\"relatedConcepts\":[\"Revaluation\",\"Deferred tax liability\",\"OCI\"],\"numericAnswer\":50000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"f-far-tax-2\",\"topicId\":\"t-far-tax\",\"type\":\"mcq\",\"difficulty\":\"hard\",\"stem\":\"A company has unused tax losses carried forward. When can it recognise a deferred tax asset for them?\",\"explanation\":\"A deferred tax asset for losses is recognised only to the extent it is probable that future taxable profits will be available to use them.\",\"relatedConcepts\":[\"Deferred tax asset\",\"Tax losses\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-f-far-tax-2-0-156\",\"questionId\":\"f-far-tax-2\",\"label\":\"Only to the extent future taxable profits are probable\",\"isCorrect\":true,\"feedback\":\"Correct — recognition is restricted by probable future profits.\",\"sortOrder\":0},{\"id\":\"a-f-far-tax-2-1-157\",\"questionId\":\"f-far-tax-2\",\"label\":\"Always, in full, immediately\",\"isCorrect\":false,\"feedback\":\"Recognition depends on probable future taxable profits.\",\"sortOrder\":1},{\"id\":\"a-f-far-tax-2-2-158\",\"questionId\":\"f-far-tax-2\",\"label\":\"Never — tax losses cannot create a DT asset\",\"isCorrect\":false,\"feedback\":\"They can, subject to the recoverability test.\",\"sortOrder\":2},{\"id\":\"a-f-far-tax-2-3-159\",\"questionId\":\"f-far-tax-2\",\"label\":\"Only once the losses have actually been used\",\"isCorrect\":false,\"feedback\":\"That defeats the purpose of a deferred tax asset.\",\"sortOrder\":3}]},{\"id\":\"q-t-far-tax-f0\",\"topicId\":\"t-far-tax\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"Practice (Deferred tax (IAS 12)): which statement is most accurate regarding deferred tax (ias 12)?\",\"explanation\":\"This reinforces the core principle of deferred tax (ias 12).\",\"relatedConcepts\":[\"Deferred tax (IAS 12)\"],\"rating\":1050,\"estSeconds\":60,\"isPublished\":true,\"answers\":[{\"id\":\"a-q-t-far-tax-f0-0-80\",\"questionId\":\"q-t-far-tax-f0\",\"label\":\"It applies the relevant ACA principle correctly\",\"isCorrect\":true,\"feedback\":\"Correct application of the principle.\",\"sortOrder\":0},{\"id\":\"a-q-t-far-tax-f0-1-81\",\"questionId\":\"q-t-far-tax-f0\",\"label\":\"It ignores the relevant standard\",\"isCorrect\":false,\"feedback\":\"Standards must be applied.\",\"sortOrder\":1},{\"id\":\"a-q-t-far-tax-f0-2-82\",\"questionId\":\"q-t-far-tax-f0\",\"label\":\"It double-counts the effect\",\"isCorrect\":false,\"feedback\":\"This would misstate the result.\",\"sortOrder\":2},{\"id\":\"a-q-t-far-tax-f0-3-83\",\"questionId\":\"q-t-far-tax-f0\",\"label\":\"It is never examinable\",\"isCorrect\":false,\"feedback\":\"This topic is examinable.\",\"sortOrder\":3}]}],\"t-far-cons\":[{\"id\":\"q-cr-1\",\"topicId\":\"t-far-cons\",\"type\":\"scenario\",\"difficulty\":\"hard\",\"scenario\":\"P acquired 80% of S for £500,000 when S's net assets were £400,000. NCI is measured at its proportionate share of net assets.\",\"stem\":\"What is the goodwill on acquisition?\",\"explanation\":\"Goodwill = consideration + NCI − net assets acquired. NCI (proportionate) = 20% × 400,000 = 80,000.\",\"workedSolution\":\"Goodwill = 500,000 + 80,000 − 400,000 = £180,000\",\"relatedConcepts\":[\"Goodwill\",\"Non-controlling interest\"],\"rating\":1400,\"estSeconds\":60,\"isPublished\":true,\"answers\":[{\"id\":\"a-q-cr-1-0-32\",\"questionId\":\"q-cr-1\",\"label\":\"£180,000\",\"isCorrect\":true,\"feedback\":\"Correct — 500,000 + 80,000 NCI − 400,000.\",\"sortOrder\":0},{\"id\":\"a-q-cr-1-1-33\",\"questionId\":\"q-cr-1\",\"label\":\"£100,000\",\"isCorrect\":false,\"feedback\":\"This ignores the NCI share under the proportionate method.\",\"sortOrder\":1},{\"id\":\"a-q-cr-1-2-34\",\"questionId\":\"q-cr-1\",\"label\":\"£260,000\",\"isCorrect\":false,\"feedback\":\"This uses full goodwill / fair-value NCI, not stated here.\",\"sortOrder\":2},{\"id\":\"a-q-cr-1-3-35\",\"questionId\":\"q-cr-1\",\"label\":\"£500,000\",\"isCorrect\":false,\"feedback\":\"This is the consideration, not goodwill.\",\"sortOrder\":3}]},{\"id\":\"x-far-cons-1\",\"topicId\":\"t-far-cons\",\"difficulty\":\"hard\",\"stem\":\"P acquired 75% of S for £600,000. At acquisition S's net assets were £640,000. NCI is measured at fair value of £190,000. What is goodwill under the full goodwill method (£)?\",\"explanation\":\"Full goodwill = consideration + fair value of NCI − fair value of net assets acquired.\",\"workedSolution\":\"Goodwill = 600,000 + 190,000 − 640,000 = £150,000\",\"relatedConcepts\":[\"Full goodwill\",\"NCI at fair value\"],\"numericAnswer\":150000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"x-far-cons-2\",\"topicId\":\"t-far-cons\",\"difficulty\":\"hard\",\"stem\":\"During the year P sold goods to its subsidiary S for £40,000, marking up cost by 25%. Half of the goods remain in S's inventory at year end. What is the unrealised profit (PURP) to eliminate (£)?\",\"explanation\":\"Profit in the £40,000 sale = 40,000 × 25/125 = £8,000. Half remains unsold, so PURP = £4,000.\",\"workedSolution\":\"Profit in sale = 40,000 × 25/125 = 8,000\\nIn closing inventory (½): 8,000 × 50% = £4,000\",\"relatedConcepts\":[\"Intra-group trading\",\"Unrealised profit\"],\"numericAnswer\":4000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"f-far-cons-1\",\"topicId\":\"t-far-cons\",\"difficulty\":\"hard\",\"scenario\":\"Fir Ltd acquired 80% of Gorse Ltd for £900,000. At acquisition Gorse's net assets were £950,000, including a property whose fair value exceeded book value by £100,000 (not yet reflected). NCI is measured at fair value of £210,000.\",\"stem\":\"What is goodwill on acquisition under the full goodwill method (£)?\",\"explanation\":\"Use fair-valued net assets: 950,000 + 100,000 = 1,050,000. Goodwill = consideration + FV of NCI − FV of net assets.\",\"workedSolution\":\"FV net assets = 950,000 + 100,000 = 1,050,000\\nGoodwill = 900,000 + 210,000 − 1,050,000 = £60,000\",\"relatedConcepts\":[\"Goodwill\",\"Fair value adjustments\",\"NCI at fair value\"],\"numericAnswer\":60000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"f-far-cons-2\",\"topicId\":\"t-far-cons\",\"difficulty\":\"hard\",\"scenario\":\"Holly Ltd owns 30% of Ivy Ltd (an associate) bought for £400,000. In the year Ivy made a profit of £200,000 and paid total dividends of £50,000.\",\"stem\":\"What is the carrying amount of the investment in associate at the year end, using the equity method (£)?\",\"explanation\":\"Equity method: cost + share of post-acquisition profit − share of dividends received.\",\"workedSolution\":\"= 400,000 + (30% × 200,000) − (30% × 50,000) = 400,000 + 60,000 − 15,000 = £445,000\",\"relatedConcepts\":[\"Associates\",\"Equity method\"],\"numericAnswer\":445000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"f-far-cons-3\",\"topicId\":\"t-far-cons\",\"difficulty\":\"hard\",\"scenario\":\"Larch Ltd acquired 60% of Maple Ltd on 1 July 20X4 (half-way through the year). Maple's profit for the full year to 31 Dec 20X4 was £480,000, accruing evenly.\",\"stem\":\"How much of Maple's profit is included in the consolidated profit, and what is the NCI share of post-acquisition profit (£)?\",\"explanation\":\"Only post-acquisition profit (6 months = £240,000) is consolidated; NCI (40%) takes its share of that.\",\"workedSolution\":\"Post-acq profit = 480,000 × 6/12 = 240,000\\nNCI share = 40% × 240,000 = £96,000\",\"relatedConcepts\":[\"Mid-year acquisition\",\"Non-controlling interest\"],\"numericAnswer\":96000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true}],\"t-far-ppe\":[{\"id\":\"f-far-ppe-1\",\"topicId\":\"t-far-ppe\",\"difficulty\":\"hard\",\"scenario\":\"An asset has a carrying amount of £500,000. Its fair value less costs to sell is £420,000 and its value in use is £450,000.\",\"stem\":\"What impairment loss should be recognised (£)?\",\"explanation\":\"Recoverable amount = higher of FVLCS (£420,000) and VIU (£450,000) = £450,000. Impairment = carrying − recoverable.\",\"workedSolution\":\"Recoverable = max(420,000, 450,000) = 450,000\\nImpairment = 500,000 − 450,000 = £50,000\",\"relatedConcepts\":[\"Impairment\",\"Recoverable amount\",\"Value in use\"],\"numericAnswer\":50000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"f-far-ppe-2\",\"topicId\":\"t-far-ppe\",\"difficulty\":\"medium\",\"scenario\":\"A machine cost £120,000 with a 10-year life and nil residual value (straight-line). After 4 years it is revalued to £90,000. Remaining life is unchanged.\",\"stem\":\"What is the annual depreciation charge after the revaluation (£)?\",\"explanation\":\"After revaluation, depreciate the revalued amount over the remaining useful life (6 years).\",\"workedSolution\":\"Remaining life = 10 − 4 = 6 years\\nDepreciation = 90,000 ÷ 6 = £15,000\",\"relatedConcepts\":[\"Revaluation\",\"Depreciation\"],\"numericAnswer\":15000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"f-far-ppe-3\",\"topicId\":\"t-far-ppe\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Under IAS 23, borrowing costs directly attributable to a qualifying asset should be:\",\"explanation\":\"Borrowing costs on a qualifying asset (one that takes a substantial time to get ready for use/sale) must be capitalised as part of its cost.\",\"relatedConcepts\":[\"Borrowing costs\",\"IAS 23\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-f-far-ppe-3-0-160\",\"questionId\":\"f-far-ppe-3\",\"label\":\"Capitalised as part of the asset's cost\",\"isCorrect\":true,\"feedback\":\"Correct — for qualifying assets, during the construction period.\",\"sortOrder\":0},{\"id\":\"a-f-far-ppe-3-1-161\",\"questionId\":\"f-far-ppe-3\",\"label\":\"Always expensed as incurred\",\"isCorrect\":false,\"feedback\":\"That applies to non-qualifying assets only.\",\"sortOrder\":1},{\"id\":\"a-f-far-ppe-3-2-162\",\"questionId\":\"f-far-ppe-3\",\"label\":\"Recognised in other comprehensive income\",\"isCorrect\":false,\"feedback\":\"Borrowing costs are not OCI items.\",\"sortOrder\":2},{\"id\":\"a-f-far-ppe-3-3-163\",\"questionId\":\"f-far-ppe-3\",\"label\":\"Deducted from equity\",\"isCorrect\":false,\"feedback\":\"Incorrect treatment.\",\"sortOrder\":3}]},{\"id\":\"q-t-far-ppe-f0\",\"topicId\":\"t-far-ppe\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"Practice (PPE \u0026 impairment): which statement is most accurate regarding ppe \u0026 impairment?\",\"explanation\":\"This reinforces the core principle of ppe \u0026 impairment.\",\"relatedConcepts\":[\"PPE \u0026 impairment\"],\"rating\":1050,\"estSeconds\":60,\"isPublished\":true,\"answers\":[{\"id\":\"a-q-t-far-ppe-f0-0-252\",\"questionId\":\"q-t-far-ppe-f0\",\"label\":\"It applies the relevant ACA principle correctly\",\"isCorrect\":true,\"feedback\":\"Correct application of the principle.\",\"sortOrder\":0},{\"id\":\"a-q-t-far-ppe-f0-1-253\",\"questionId\":\"q-t-far-ppe-f0\",\"label\":\"It ignores the relevant standard\",\"isCorrect\":false,\"feedback\":\"Standards must be applied.\",\"sortOrder\":1},{\"id\":\"a-q-t-far-ppe-f0-2-254\",\"questionId\":\"q-t-f
