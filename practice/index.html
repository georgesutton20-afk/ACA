e entry must balance.\",\"workedSolution\":\"Dr Office supplies £200\\nCr Cash £200\",\"relatedConcepts\":[\"Debits \u0026 credits\",\"The accounting equation\"],\"rating\":1050,\"estSeconds\":60,\"isPublished\":true,\"answers\":[{\"id\":\"a-q-acc-1-0-0\",\"questionId\":\"q-acc-1\",\"label\":\"Dr Cash £200, Cr Supplies £200\",\"isCorrect\":false,\"feedback\":\"This reverses the entry — cash is going out, not in.\",\"sortOrder\":0},{\"id\":\"a-q-acc-1-1-1\",\"questionId\":\"q-acc-1\",\"label\":\"Dr Supplies £200, Cr Cash £200\",\"isCorrect\":true,\"feedback\":\"Correct — the asset/expense is debited and cash credited.\",\"sortOrder\":1},{\"id\":\"a-q-acc-1-2-2\",\"questionId\":\"q-acc-1\",\"label\":\"Dr Supplies £200, Cr Payables £200\",\"isCorrect\":false,\"feedback\":\"Only if bought on credit; here it is cash.\",\"sortOrder\":2},{\"id\":\"a-q-acc-1-3-3\",\"questionId\":\"q-acc-1\",\"label\":\"Dr Cash £200, Cr Payables £200\",\"isCorrect\":false,\"feedback\":\"Neither account is correct for a cash purchase of supplies.\",\"sortOrder\":3}]},{\"id\":\"x-acc-de-1\",\"topicId\":\"t-acc-de\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"A business purchases inventory for £900 on credit from a supplier. What is the correct double entry?\",\"explanation\":\"Inventory (an asset) increases — debit; the obligation to the supplier (a payable/liability) increases — credit.\",\"workedSolution\":\"Dr Purchases/Inventory £900\\nCr Trade payables £900\",\"relatedConcepts\":[\"Debits \u0026 credits\",\"Credit transactions\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-x-acc-de-1-0-0\",\"questionId\":\"x-acc-de-1\",\"label\":\"Dr Purchases £900, Cr Trade payables £900\",\"isCorrect\":true,\"feedback\":\"Correct — asset up (Dr), liability up (Cr).\",\"sortOrder\":0},{\"id\":\"a-x-acc-de-1-1-1\",\"questionId\":\"x-acc-de-1\",\"label\":\"Dr Trade payables £900, Cr Purchases £900\",\"isCorrect\":false,\"feedback\":\"This reverses the entry.\",\"sortOrder\":1},{\"id\":\"a-x-acc-de-1-2-2\",\"questionId\":\"x-acc-de-1\",\"label\":\"Dr Purchases £900, Cr Cash £900\",\"isCorrect\":false,\"feedback\":\"The goods were bought on credit, not for cash.\",\"sortOrder\":2},{\"id\":\"a-x-acc-de-1-3-3\",\"questionId\":\"x-acc-de-1\",\"label\":\"Dr Cash £900, Cr Trade payables £900\",\"isCorrect\":false,\"feedback\":\"No cash moves on a credit purchase.\",\"sortOrder\":3}]},{\"id\":\"x-acc-de-2\",\"topicId\":\"t-acc-de\",\"difficulty\":\"easy\",\"stem\":\"A business has total assets of £80,000 and total liabilities of £30,000. Applying the accounting equation, what is the owner's capital (£)?\",\"explanation\":\"Assets = Capital + Liabilities, so Capital = Assets − Liabilities.\",\"workedSolution\":\"Capital = 80,000 − 30,000 = £50,000\",\"relatedConcepts\":[\"The accounting equation\"],\"numericAnswer\":50000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1050,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"x-acc-de-3\",\"topicId\":\"t-acc-de\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Which of the following errors would NOT be revealed by extracting a trial balance?\",\"explanation\":\"A trial balance only checks that total debits equal total credits. An error of principle (correct amount, wrong type of account) still balances.\",\"relatedConcepts\":[\"Trial balance\",\"Types of error\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-x-acc-de-3-0-4\",\"questionId\":\"x-acc-de-3\",\"label\":\"An error of principle\",\"isCorrect\":true,\"feedback\":\"Correct — debits still equal credits, so the TB balances.\",\"sortOrder\":0},{\"id\":\"a-x-acc-de-3-1-5\",\"questionId\":\"x-acc-de-3\",\"label\":\"A one-sided entry\",\"isCorrect\":false,\"feedback\":\"This unbalances the trial balance.\",\"sortOrder\":1},{\"id\":\"a-x-acc-de-3-2-6\",\"questionId\":\"x-acc-de-3\",\"label\":\"A transposition in one ledger account only\",\"isCorrect\":false,\"feedback\":\"This causes a difference on the TB.\",\"sortOrder\":2},{\"id\":\"a-x-acc-de-3-3-7\",\"questionId\":\"x-acc-de-3\",\"label\":\"Posting a debit as a credit\",\"isCorrect\":false,\"feedback\":\"This creates a difference of twice the amount.\",\"sortOrder\":3}]},{\"id\":\"ac-de-1\",\"topicId\":\"t-acc-de\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"scenario\":\"A business buys office equipment for £4,000, paying by cheque from its bank account.\",\"stem\":\"What are the correct double entries to record this transaction?\",\"explanation\":\"Equipment is an asset that increases (debit). The bank balance (an asset) decreases (credit).\",\"relatedConcepts\":[\"Debits and credits\",\"Assets\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-ac-de-1-0-184\",\"questionId\":\"ac-de-1\",\"label\":\"Debit equipment £4,000; credit bank £4,000\",\"isCorrect\":true,\"feedback\":\"Correct — increase the asset bought, decrease the bank.\",\"sortOrder\":0},{\"id\":\"a-ac-de-1-1-185\",\"questionId\":\"ac-de-1\",\"label\":\"Debit bank £4,000; credit equipment £4,000\",\"isCorrect\":false,\"feedback\":\"This reverses the entries; the bank is reduced, not increased.\",\"sortOrder\":1},{\"id\":\"a-ac-de-1-2-186\",\"questionId\":\"ac-de-1\",\"label\":\"Debit equipment £4,000; credit capital £4,000\",\"isCorrect\":false,\"feedback\":\"No new capital was introduced; the bank funded the purchase.\",\"sortOrder\":2},{\"id\":\"a-ac-de-1-3-187\",\"questionId\":\"ac-de-1\",\"label\":\"Debit purchases £4,000; credit bank £4,000\",\"isCorrect\":false,\"feedback\":\"Equipment is a non-current asset, not a purchase of goods for resale.\",\"sortOrder\":3}]},{\"id\":\"ac-de-2\",\"topicId\":\"t-acc-de\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"Which of the following accounts normally has a credit balance?\",\"explanation\":\"Liabilities, capital and income carry credit balances; assets and expenses carry debit balances.\",\"relatedConcepts\":[\"Normal balances\",\"Accounting equation\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-ac-de-2-0-188\",\"questionId\":\"ac-de-2\",\"label\":\"Trade payables\",\"isCorrect\":true,\"feedback\":\"Correct — payables are a liability, which has a credit balance.\",\"sortOrder\":0},{\"id\":\"a-ac-de-2-1-189\",\"questionId\":\"ac-de-2\",\"label\":\"Trade receivables\",\"isCorrect\":false,\"feedback\":\"Receivables are an asset and carry a debit balance.\",\"sortOrder\":1},{\"id\":\"a-ac-de-2-2-190\",\"questionId\":\"ac-de-2\",\"label\":\"Motor vehicles\",\"isCorrect\":false,\"feedback\":\"An asset, carrying a debit balance.\",\"sortOrder\":2},{\"id\":\"a-ac-de-2-3-191\",\"questionId\":\"ac-de-2\",\"label\":\"Rent expense\",\"isCorrect\":false,\"feedback\":\"An expense, carrying a debit balance.\",\"sortOrder\":3}]},{\"id\":\"ac-de-3\",\"topicId\":\"t-acc-de\",\"difficulty\":\"easy\",\"scenario\":\"At the year end a sole trader has the following balances: assets £85,000 and liabilities £32,000.\",\"stem\":\"Using the accounting equation, what is the owner's capital (£)?\",\"explanation\":\"The accounting equation states Assets = Capital + Liabilities, so Capital = Assets − Liabilities.\",\"workedSolution\":\"Capital = 85,000 − 32,000 = £53,000\",\"relatedConcepts\":[\"Accounting equation\",\"Capital\"],\"numericAnswer\":53000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1050,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"ac-de-4\",\"topicId\":\"t-acc-de\",\"difficulty\":\"medium\",\"scenario\":\"A trader's capital at the start of the year was £40,000. During the year the owner introduced £10,000 of new capital, drew £18,000 for personal use, and the business made a profit of £25,000.\",\"stem\":\"What is the closing capital balance (£)?\",\"explanation\":\"Closing capital = opening capital + new capital introduced + profit − drawings.\",\"workedSolution\":\"= 40,000 + 10,000 + 25,000 − 18,000 = £57,000\",\"relatedConcepts\":[\"Capital account\",\"Drawings\"],\"numericAnswer\":57000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"ac-de-5\",\"topicId\":\"t-acc-de\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"A business sells goods on credit to a customer for £2,500 plus VAT at 20%. The business is VAT registered.\",\"stem\":\"What is the correct entry to the trade receivables (debtor) account?\",\"explanation\":\"The customer owes the full VAT-inclusive amount. The output VAT (£500) is a liability owed to HMRC and is credited; revenue of £2,500 is credited.\",\"relatedConcepts\":[\"VAT\",\"Output tax\",\"Credit sales\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-ac-de-5-0-192\",\"questionId\":\"ac-de-5\",\"label\":\"Debit receivables £3,000\",\"isCorrect\":true,\"feedback\":\"Correct — the customer owes the gross amount including VAT (2,500 + 500).\",\"sortOrder\":0},{\"id\":\"a-ac-de-5-1-193\",\"questionId\":\"ac-de-5\",\"label\":\"Debit receivables £2,500\",\"isCorrect\":false,\"feedback\":\"The customer also owes the £500 VAT, so the debit is £3,000.\",\"sortOrder\":1},{\"id\":\"a-ac-de-5-2-194\",\"questionId\":\"ac-de-5\",\"label\":\"Debit receivables £2,000\",\"isCorrect\":false,\"feedback\":\"VAT is added to, not deducted from, the net sale.\",\"sortOrder\":2},{\"id\":\"a-ac-de-5-3-195\",\"questionId\":\"ac-de-5\",\"label\":\"Credit receivables £3,000\",\"isCorrect\":false,\"feedback\":\"Sales on credit increase (debit) receivables, not credit them.\",\"sortOrder\":3}]}],\"t-acc-adj\":[{\"id\":\"q-acc-2\",\"topicId\":\"t-acc-adj\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"At year-end, £1,500 of electricity has been consumed but not yet invoiced. What adjustment is needed?\",\"explanation\":\"Under the accruals concept the expense belongs to the period in which it is incurred, so an accrual (liability) is recognised.\",\"workedSolution\":\"Dr Electricity expense £1,500\\nCr Accruals (liability) £1,500\",\"relatedConcepts\":[\"Accruals concept\",\"Matching\"],\"rating\":1200,\"estSeconds\":60,\"isPublished\":true,\"answers\":[{\"id\":\"a-q-acc-2-0-4\",\"questionId\":\"q-acc-2\",\"label\":\"Accrue £1,500: Dr expense, Cr accruals\",\"isCorrect\":true,\"feedback\":\"Correct — match the cost to the period incurred.\",\"sortOrder\":0},{\"id\":\"a-q-acc-2-1-5\",\"questionId\":\"q-acc-2\",\"label\":\"Prepay £1,500: Dr prepayment, Cr expense\",\"isCorrect\":false,\"feedback\":\"A prepayment is for costs paid in advance, not the reverse.\",\"sortOrder\":1},{\"id\":\"a-q-acc-2-2-6\",\"questionId\":\"q-acc-2\",\"label\":\"No adjustment until the invoice arrives\",\"isCorrect\":false,\"feedback\":\"That breaches the accruals concept.\",\"sortOrder\":2},{\"id\":\"a-q-acc-2-3-7\",\"questionId\":\"q-acc-2\",\"label\":\"Dr accruals, Cr expense £1,500\",\"isCorrect\":false,\"feedback\":\"This is the wrong direction.\",\"sortOrder\":3}]},{\"id\":\"x-acc-adj-1\",\"topicId\":\"t-acc-adj\",\"difficulty\":\"medium\",\"stem\":\"On 1 October 20X4 a business pays £12,000 for 12 months' insurance. Its year end is 31 December 20X4. What prepayment is carried forward at the year end (£)?\",\"explanation\":\"Insurance from 1 Jan to 30 Sep 20X5 (9 months) relates to the next period and is a prepayment.\",\"workedSolution\":\"Prepayment = 12,000 × 9/12 = £9,000\",\"relatedConcepts\":[\"Prepayments\",\"Matching concept\"],\"numericAnswer\":9000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"x-acc-adj-2\",\"topicId\":\"t-acc-adj\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Rent receivable of £2,000 has been earned but not yet received at the year end. What is the correct treatment?\",\"explanation\":\"Income earned but not received is accrued income — an asset (receivable) and credit to income.\",\"workedSolution\":\"Dr Accrued income (asset) £2,000\\nCr Rent receivable (income) £2,000\",\"relatedConcepts\":[\"Accrued income\",\"Accruals concept\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-x-acc-adj-2-0-8\",\"questionId\":\"x-acc-adj-2\",\"label\":\"Recognise accrued income: Dr asset, Cr income £2,000\",\"isCorrect\":true,\"feedback\":\"Correct — income is matched to the period earned.\",\"sortOrder\":0},{\"id\":\"a-x-acc-adj-2-1-9\",\"questionId\":\"x-acc-adj-2\",\"label\":\"Do nothing until cash is received\",\"isCorrect\":false,\"feedback\":\"This breaches the accruals concept.\",\"sortOrder\":1},{\"id\":\"a-x-acc-adj-2-2-10\",\"questionId\":\"x-acc-adj-2\",\"label\":\"Recognise deferred income (a liability)\",\"isCorrect\":false,\"feedback\":\"Deferred income is for cash received in advance.\",\"sortOrder\":2},{\"id\":\"a-x-acc-adj-2-3-11\",\"questionId\":\"x-acc-adj-2\",\"label\":\"Reduce this year's income by £2,000\",\"isCorrect\":false,\"feedback\":\"The income has been earned this year.\",\"sortOrder\":3}]},{\"id\":\"ac-adj-1\",\"topicId\":\"t-acc-adj\",\"difficulty\":\"easy\",\"scenario\":\"A business pays rent of £24,000 covering the year to 31 March 20X5. Its financial year ends on 31 December 20X4.\",\"stem\":\"What rent prepayment should be carried forward at 31 December 20X4 (£)?\",\"explanation\":\"The rent paid covers 3 months (Jan–Mar 20X5) beyond the year end. The prepayment is the proportion relating to next year.\",\"workedSolution\":\"Prepayment = 24,000 × 3/12 = £6,000\",\"relatedConcepts\":[\"Prepayments\",\"Matching concept\"],\"numericAnswer\":6000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1050,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"ac-adj-2\",\"topicId\":\"t-acc-adj\",\"difficulty\":\"medium\",\"scenario\":\"During the year a business paid electricity bills totalling £8,200. At the year end an unpaid bill of £900 had been incurred but not recorded, and the opening accrual was £700.\",\"stem\":\"What is the electricity expense for the year in the statement of profit or loss (£)?\",\"explanation\":\"Expense = cash paid + closing accrual − opening accrual.\",\"workedSolution\":\"= 8,200 + 900 − 700 = £8,400\",\"relatedConcepts\":[\"Accruals\",\"Expense recognition\"],\"numericAnswer\":8400,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"ac-adj-3\",\"topicId\":\"t-acc-adj\",\"difficulty\":\"medium\",\"scenario\":\"A business sublets part of its premises for £1,500 per month. During the year to 31 December 20X4 it received £19,500 in cash from the tenant.\",\"stem\":\"What amount of rental income should be recognised for the year, and what is the resulting balance (£)?\",\"explanation\":\"Annual income earned = 1,500 × 12 = £18,000. Cash received was £19,500, so £1,500 relates to next year — income recognised is £18,000.\",\"workedSolution\":\"Income earned = 1,500 × 12 = £18,000 (with £1,500 deferred income carried forward)\",\"relatedConcepts\":[\"Deferred income\",\"Accrued income\"],\"numericAnswer\":18000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"ac-adj-4\",\"topicId\":\"t-acc-adj\",\"difficulty\":\"hard\",\"scenario\":\"Insurance is paid annually in advance on 1 May. The payment on 1 May 20X3 was £12,000 and on 1 May 20X4 it rose to £15,000. The year end is 31 December 20X4.\",\"stem\":\"What is the insurance expense charged for the year ended 31 December 20X4 (£)?\",\"explanation\":\"Jan–Apr 20X4 (4 months) is covered by the 20X3 payment; May–Dec 20X4 (8 months) by the 20X4 payment.\",\"workedSolution\":\"= (12,000 × 4/12) + (15,000 × 8/12) = 4,000 + 10,000 = £14,000\",\"relatedConcepts\":[\"Prepayments\",\"Time apportionment\"],\"numericAnswer\":14000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"ac-adj-5\",\"topicId\":\"t-acc-adj\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"How is a prepayment of an expense presented in the statement of financial position?\",\"explanation\":\"A prepayment is a current asset — the business has paid for a benefit it has not yet consumed.\",\"relatedConcepts\":[\"Prepayments\",\"Current assets\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-ac-adj-5-0-196\",\"questionId\":\"ac-adj-5\",\"label\":\"As a current asset\",\"isCorrect\":true,\"feedback\":\"Correct — a prepaid expense is a current asset.\",\"sortOrder\":0},{\"id\":\"a-ac-adj-5-1-197\",\"questionId\":\"ac-adj-5\",\"label\":\"As a current liability\",\"isCorrect\":false,\"feedback\":\"An accrual (amount owed) is a liability; a prepayment is an asset.\",\"sortOrder\":1},{\"id\":\"a-ac-adj-5-2-198\",\"questionId\":\"ac-adj-5\",\"label\":\"As a deduction from capital\",\"isCorrect\":false,\"feedback\":\"Prepayments are not adjusted against capital.\",\"sortOrder\":2},{\"id\":\"a-ac-adj-5-3-199\",\"questionId\":\"ac-adj-5\",\"label\":\"As revenue\",\"isCorrect\":false,\"feedback\":\"A prepayment is an asset, not income.\",\"sortOrder\":3}]}],\"t-acc-fs\":[{\"id\":\"x-acc-fs-1\",\"topicId\":\"t-acc-fs\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"In which financial statement would a 12-month bank loan repayable in 18 months' time be presented?\",\"explanation\":\"It is a liability due after more than 12 months, so a non-current liability in the statement of financial position.\",\"relatedConcepts\":[\"Statement of financial position\",\"Current vs non-current\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-x-acc-fs-1-0-12\",\"questionId\":\"x-acc-fs-1\",\"label\":\"As a non-current liability in the SoFP\",\"isCorrect\":true,\"feedback\":\"Correct — settlement is due in more than 12 months.\",\"sortOrder\":0},{\"id\":\"a-x-acc-fs-1-1-13\",\"questionId\":\"x-acc-fs-1\",\"label\":\"As a current liability in the SoFP\",\"isCorrect\":false,\"feedback\":\"Current liabilities fall due within 12 months.\",\"sortOrder\":1},{\"id\":\"a-x-acc-fs-1-2-14\",\"questionId\":\"x-acc-fs-1\",\"label\":\"As an expense in the statement of profit or loss\",\"isCorrect\":false,\"feedback\":\"Only the interest is an expense; the loan is a liability.\",\"sortOrder\":2},{\"id\":\"a-x-acc-fs-1-3-15\",\"questionId\":\"x-acc-fs-1\",\"label\":\"As equity\",\"isCorrect\":false,\"feedback\":\"A loan is debt, not equity.\",\"sortOrder\":3}]},{\"id\":\"x-acc-fs-2\",\"topicId\":\"t-acc-fs\",\"difficulty\":\"medium\",\"stem\":\"A business has sales of £150,000, opening inventory £10,000, purchases £90,000 and closing inventory £15,000. What is the gross profit (£)?\",\"explanation\":\"Cost of sales = opening inventory + purchases − closing inventory; gross profit = sales − cost of sales.\",\"workedSolution\":\"COS = 10,000 + 90,000 − 15,000 = 85,000\\nGross profit = 150,000 − 85,000 = £65,000\",\"relatedConcepts\":[\"Cost of sales\",\"Gross profit\"],\"numericAnswer\":65000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"ac-fs-1\",\"topicId\":\"t-acc-fs\",\"difficulty\":\"easy\",\"scenario\":\"A trader has: sales £150,000, cost of sales £90,000, distribution costs £18,000 and administrative expenses £22,000.\",\"stem\":\"What is the profit for the year (£)?\",\"explanation\":\"Gross profit = sales − cost of sales; profit = gross profit − operating expenses.\",\"workedSolution\":\"Gross profit = 150,000 − 90,000 = 60,000\\nProfit = 60,000 − 18,000 − 22,000 = £20,000\",\"relatedConcepts\":[\"Profit or loss\",\"Gross profit\"],\"numericAnswer\":20000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1050,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"ac-fs-2\",\"topicId\":\"t-acc-fs\",\"difficulty\":\"medium\",\"scenario\":\"Opening inventory was £12,000, purchases were £80,000 and closing inventory was £15,000. Carriage inwards of £2,000 was also incurred.\",\"stem\":\"What is the cost of sales for the year (£)?\",\"explanation\":\"Cost of sales = opening inventory + purchases + carriage inwards − closing inventory.\",\"workedSolution\":\"= 12,000 + 80,000 + 2,000 − 15,000 = £79,000\",\"relatedConcepts\":[\"Cost of sales\",\"Carriage inwards\"],\"numericAnswer\":79000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"ac-fs-3\",\"topicId\":\"t-acc-fs\",\"difficulty\":\"medium\",\"scenario\":\"A business has gross profit of £120,000 on sales of £400,000.\",\"stem\":\"What is the gross profit margin, to one decimal place (%)?\",\"explanation\":\"Gross profit margin = gross profit ÷ sales × 100.\",\"workedSolution\":\"= 120,000 ÷ 400,000 × 100 = 30.0%\",\"relatedConcepts\":[\"Profitability ratios\",\"Gross margin\"],\"numericAnswer\":30,\"numericTolerance\":0.1,\"unit\":\"%\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"ac-fs-4\",\"topicId\":\"t-acc-fs\",\"difficulty\":\"medium\",\"scenario\":\"At the year end a company reports: non-current assets £200,000, inventory £30,000, receivables £25,000, cash £5,000, payables £40,000 and a bank loan repayable in five years of £60,000.\",\"stem\":\"What is total equity (net assets) (£)?\",\"explanation\":\"Net assets = total assets − total liabilities, which equals equity.\",\"workedSolution\":\"Total assets = 200,000 + 30,000 + 25,000 + 5,000 = 260,000\\nTotal liabilities = 40,000 + 60,000 = 100,000\\nEquity = 260,000 − 100,000 = £160,000\",\"relatedConcepts\":[\"Net assets\",\"Statement of financial position\"],\"numericAnswer\":160000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"ac-fs-5\",\"topicId\":\"t-acc-fs\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"Which of the following items would appear in the statement of financial position rather than the statement of profit or loss?\",\"explanation\":\"The statement of financial position shows assets, liabilities and equity at a point in time; profit or loss shows income and expenses for a period.\",\"relatedConcepts\":[\"Financial statements\",\"Classification\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-ac-fs-5-0-200\",\"questionId\":\"ac-fs-5\",\"label\":\"Trade payables\",\"isCorrect\":true,\"feedback\":\"Correct — payables are a liability shown in the statement of financial position.\",\"sortOrder\":0},{\"id\":\"a-ac-fs-5-1-201\",\"questionId\":\"ac-fs-5\",\"label\":\"Sales revenue\",\"isCorrect\":false,\"feedback\":\"Revenue is income shown in profit or loss.\",\"sortOrder\":1},{\"id\":\"a-ac-fs-5-2-202\",\"questionId\":\"ac-fs-5\",\"label\":\"Depreciation charge for the year\",\"isCorrect\":false,\"feedback\":\"The charge is an expense in profit or loss (accumulated depreciation is in the SOFP).\",\"sortOrder\":2},{\"id\":\"a-ac-fs-5-3-203\",\"questionId\":\"ac-fs-5\",\"label\":\"Carriage outwards\",\"isCorrect\":false,\"feedback\":\"A distribution expense in profit or loss.\",\"sortOrder\":3}]}],\"t-acc-bank\":[{\"id\":\"ac-bank-1\",\"topicId\":\"t-acc-bank\",\"difficulty\":\"easy\",\"scenario\":\"The cash book shows a balance of £3,200 (debit). Unpresented cheques total £900 and outstanding lodgements (deposits not yet credited) total £400.\",\"stem\":\"What is the balance shown on the bank statement (£)?\",\"explanation\":\"Start from the cash book balance: add back unpresented cheques (not yet deducted by the bank) and deduct outstanding lodgements (not yet added by the bank).\",\"workedSolution\":\"Bank statement balance = 3,200 + 900 − 400 = £3,700\",\"relatedConcepts\":[\"Bank reconciliation\",\"Unpresented cheques\"],\"numericAnswer\":3700,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1050,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"ac-bank-2\",\"topicId\":\"t-acc-bank\",\"difficulty\":\"medium\",\"scenario\":\"The bank statement shows a balance of £5,600. There are unpresented cheques of £1,200 and outstanding lodgements of £800.\",\"stem\":\"What is the corrected cash book balance (£)?\",\"explanation\":\"Work from the bank statement to the cash book: deduct unpresented cheques and add outstanding lodgements.\",\"workedSolution\":\"Cash book balance = 5,600 − 1,200 + 800 = £5,200\",\"relatedConcepts\":[\"Bank reconciliation\",\"Outstanding lodgements\"],\"numericAnswer\":5200,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"ac-bank-3\",\"topicId\":\"t-acc-bank\",\"difficulty\":\"medium\",\"scenario\":\"Before reconciliation the cash book shows £4,000. The bank statement reveals bank charges of £150 and a direct debit of £320 not yet recorded, plus interest received of £90 not yet recorded.\",\"stem\":\"What is the corrected (adjusted) cash book balance (£)?\",\"explanation\":\"Items on the bank statement not yet in the cash book are adjusted in the cash book: deduct charges and direct debits, add interest received.\",\"workedSolution\":\"= 4,000 − 150 − 320 + 90 = £3,620\",\"relatedConcepts\":[\"Adjusted cash book\",\"Bank charges\"],\"numericAnswer\":3620,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"ac-bank-4\",\"topicId\":\"t-acc-bank\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Which of the following requires an adjustment to the cash book (rather than appearing only on the bank reconciliation statement)?\",\"explanation\":\"Items the business is unaware of until it sees the bank statement (charges, standing orders, direct debits, dishonoured cheques) must be entered in the cash book. Timing differences such as unpresented cheques only feature on the reconciliation.\",\"relatedConcepts\":[\"Cash book adjustments\",\"Timing differences\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-ac-bank-4-0-204\",\"questionId\":\"ac-bank-4\",\"label\":\"Bank charges shown on the statement\",\"isCorrect\":true,\"feedback\":\"Correct — these must be recorded in the cash book.\",\"sortOrder\":0},{\"id\":\"a-ac-bank-4-1-205\",\"questionId\":\"ac-bank-4\",\"label\":\"An unpresented cheque\",\"isCorrect\":false,\"feedback\":\"A timing difference shown only on the reconciliation, not adjusted in the cash book.\",\"sortOrder\":1},{\"id\":\"a-ac-bank-4-2-206\",\"questionId\":\"ac-bank-4\",\"label\":\"An outstanding lodgement\",\"isCorrect\":false,\"feedback\":\"A timing difference; no cash book adjustment is needed.\",\"sortOrder\":2},{\"id\":\"a-ac-bank-4-3-207\",\"questionId\":\"ac-bank-4\",\"label\":\"A cheque written and recorded but not yet cleared\",\"isCorrect\":false,\"feedback\":\"This is an unpresented cheque — a timing difference only.\",\"sortOrder\":3}]},{\"id\":\"ac-bank-5\",\"topicId\":\"t-acc-bank\",\"type\":\"scenario\",\"difficulty\":\"easy\",\"scenario\":\"A business cash book shows a credit balance (an overdraft) of £1,500.\",\"stem\":\"How is this balance shown in the statement of financial position?\",\"explanation\":\"A credit balance in the cash book means the business is overdrawn — money is owed to the bank, a current liability.\",\"relatedConcepts\":[\"Overdraft\",\"Current liabilities\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-ac-bank-5-0-208\",\"questionId\":\"ac-bank-5\",\"label\":\"As a current liability (bank overdraft)\",\"isCorrect\":true,\"feedback\":\"Correct — a credit cash book balance is an overdraft owed to the bank.\",\"sortOrder\":0},{\"id\":\"a-ac-bank-5-1-209\",\"questionId\":\"ac-bank-5\",\"label\":\"As a current asset (cash at bank)\",\"isCorrect\":false,\"feedback\":\"A credit balance is an overdraft, not a positive cash asset.\",\"sortOrder\":1},{\"id\":\"a-ac-bank-5-2-210\",\"questionId\":\"ac-bank-5\",\"label\":\"As a non-current liability\",\"isCorrect\":false,\"feedback\":\"An overdraft is repayable on demand, so it is a current liability.\",\"sortOrder\":2},{\"id\":\"a-ac-bank-5-3-211\",\"questionId\":\"ac-bank-5\",\"label\":\"As a deduction from sales\",\"isCorrect\":false,\"feedback\":\"An overdraft is a balance sheet item, not a profit or loss adjustment.\",\"sortOrder\":3}]}],\"t-acc-ctrl\":[{\"id\":\"ac-ctrl-1\",\"topicId\":\"t-acc-ctrl\",\"difficulty\":\"medium\",\"scenario\":\"The receivables ledger control account shows: opening balance £18,000, credit sales £95,000, cash received from customers £88,000, and discounts allowed £2,000.\",\"stem\":\"What is the closing balance on the receivables ledger control account (£)?\",\"explanation\":\"Closing receivables = opening + credit sales − cash received − discounts allowed.\",\"workedSolution\":\"= 18,000 + 95,000 − 88,000 − 2,000 = £23,000\",\"relatedConcepts\":[\"Receivables control account\",\"Discounts allowed\"],\"numericAnswer\":23000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"ac-ctrl-2\",\"topicId\":\"t-acc-ctrl\",\"difficulty\":\"medium\",\"scenario\":\"The payables ledger control account had an opening balance of £14,500. Credit purchases were £62,000, payments to suppliers were £58,000, and contras with the receivables ledger were £1,200.\",\"stem\":\"What is the closing balance on the payables ledger control account (£)?\",\"explanation\":\"Closing payables = opening + credit purchases − payments − contra (set-off) entries.\",\"workedSolution\":\"= 14,500 + 62,000 − 58,000 − 1,200 = £17,300\",\"relatedConcepts\":[\"Payables control account\",\"Contra entries\"],\"numericAnswer\":17300,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"ac-ctrl-3\",\"topicId\":\"t-acc-ctrl\",\"difficulty\":\"hard\",\"scenario\":\"A trial balance failed to agree and the difference was posted to a suspense account. Two errors were then found: a payment for repairs of £450 was completely omitted from the ledgers, and sales of £600 were credited correctly but debited to the bank account as £6,000.\",\"stem\":\"Before correction, what was the suspense account balance arising from these errors (£)?\",\"explanation\":\"The omission of repairs affects both sides equally, so it does not cause an imbalance. The bank was debited £6,000 instead of £600 — an excess debit of £5,400, which the suspense account must offset with a credit of £5,400.\",\"workedSolution\":\"Repairs omission: no imbalance.\\nBank over-debited by 6,000 − 600 = 5,400 (excess debit) → suspense credit of £5,400\",\"relatedConcepts\":[\"Suspense account\",\"Trial balance errors\"],\"numericAnswer\":5400,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"ac-ctrl-4\",\"topicId\":\"t-acc-ctrl\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"scenario\":\"A sale of £270 was recorded in the books as £720 in both the sales account and the receivables account.\",\"stem\":\"What type of error is this?\",\"explanation\":\"Both entries used the same wrong figure, so the trial balance still balances. Reversing two digits (270 vs 720) is an error of transposition, but because both sides are equal it is best classed as an error of original entry affecting both accounts.\",\"relatedConcepts\":[\"Errors\",\"Trial balance\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-ac-ctrl-4-0-212\",\"questionId\":\"ac-ctrl-4\",\"label\":\"An error of original entry (the wrong amount entered on both sides)\",\"isCorrect\":true,\"feedback\":\"Correct — the same incorrect amount was posted to both accounts, so the trial balance still agrees.\",\"sortOrder\":0},{\"id\":\"a-ac-ctrl-4-1-213\",\"questionId\":\"ac-ctrl-4\",\"label\":\"An error of omission\",\"isCorrect\":false,\"feedback\":\"The transaction was recorded, just at the wrong amount.\",\"sortOrder\":1},{\"id\":\"a-ac-ctrl-4-2-214\",\"questionId\":\"ac-ctrl-4\",\"label\":\"A one-sided error revealed by the trial balance\",\"isCorrect\":false,\"feedback\":\"Both sides used £720, so the trial balance still balances.\",\"sortOrder\":2},{\"id\":\"a-ac-ctrl-4-3-215\",\"questionId\":\"ac-ctrl-4\",\"label\":\"An error of principle\",\"isCorrect\":false,\"feedback\":\"The right type of accounts were used; only the amount was wrong.\",\"sortOrder\":3}]},{\"id\":\"ac-ctrl-5\",\"topicId\":\"t-acc-ctrl\",\"type\":\"scenario\",\"difficulty\":\"hard\",\"scenario\":\"Motor repairs of £800 were debited to the motor vehicles (non-current asset) account instead of the repairs expense account.\",\"stem\":\"What type of error has occurred and will the trial balance still balance?\",\"explanation\":\"Debiting an asset account instead of an expense account uses the wrong class of account, an error of principle. Both sides are still equal in total, so the trial balance balances.\",\"relatedConcepts\":[\"Error of principle\",\"Capital vs revenue expenditure\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-ac-ctrl-5-0-216\",\"questionId\":\"ac-ctrl-5\",\"label\":\"An error of principle; the trial balance still balances\",\"isCorrect\":true,\"feedback\":\"Correct — revenue expenditure was treated as capital expenditure, but the debit/credit totals are unaffected.\",\"sortOrder\":0},{\"id\":\"a-ac-ctrl-5-1-217\",\"questionId\":\"ac-ctrl-5\",\"label\":\"A transposition error; the trial balance will not balance\",\"isCorrect\":false,\"feedback\":\"No digits were reversed and the totals still agree.\",\"sortOrder\":1},{\"id\":\"a-ac-ctrl-5-2-218\",\"questionId\":\"ac-ctrl-5\",\"label\":\"An error of commission; the trial balance will not balance\",\"isCorrect\":false,\"feedback\":\"Although the wrong account was used, the totals still agree, so it balances.\",\"sortOrder\":2},{\"id\":\"a-ac-ctrl-5-3-219\",\"questionId\":\"ac-ctrl-5\",\"label\":\"A compensating error\",\"isCorrect\":false,\"feedback\":\"There is a single misposting, not two errors cancelling out.\",\"sortOrder\":3}]}],\"t-acc-inv\":[{\"id\":\"ac-inv-1\",\"topicId\":\"t-acc-inv\",\"difficulty\":\"easy\",\"scenario\":\"An item of inventory cost £40 per unit. Due to damage it can now be sold for £55 but only after repairs costing £20 per unit. There are 100 units.\",\"stem\":\"At what total amount should this inventory be valued under IAS 2 (£)?\",\"explanation\":\"IAS 2 requires inventory at the lower of cost and net realisable value (NRV). NRV = selling price − costs to complete and sell.\",\"workedSolution\":\"NRV per unit = 55 − 20 = 35; lower of cost (40) and NRV (35) = 35\\nTotal = 35 × 100 = £3,500\",\"relatedConcepts\":[\"IAS 2\",\"Net realisable value\"],\"numericAnswer\":3500,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1050,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"ac-inv-2\",\"topicId\":\"t-acc-inv\",\"difficulty\":\"medium\",\"scenario\":\"A company uses FIFO. Opening inventory was 100 units at £10. It then bought 200 units at £12, and later 150 units at £14. During the period it sold 300 units.\",\"stem\":\"What is the value of closing inventory under FIFO (£)?\",\"explanation\":\"FIFO assumes the earliest units are sold first, so closing inventory comprises the most recent purchases. Units left = 100 + 200 + 150 − 300 = 150 units (the latest batch at £14).\",\"workedSolution\":\"Closing units = 450 − 300 = 150, all from the £14 batch\\n= 150 × 14 = £2,100\",\"relatedConcepts\":[\"FIFO\",\"Inventory valuation\"],\"numericAnswer\":2100,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"ac-inv-3\",\"topicId\":\"t-acc-inv\",\"difficulty\":\"hard\",\"scenario\":\"A company uses the periodic weighted average (AVCO) method. Opening inventory was 100 units at £10. It then bought 300 units at £14. During the period it sold 250 units.\",\"stem\":\"What is the value of closing inventory under the periodic AVCO method (£)?\",\"explanation\":\"Average cost = total cost ÷ total units. Closing units are valued at this average.\",\"workedSolution\":\"Total cost = (100 × 10) + (300 × 14) = 1,000 + 4,200 = 5,200\\nAverage = 5,200 ÷ 400 = £13 per unit\\nClosing units = 400 − 250 = 150\\n= 150 × 13 = £1,950\",\"relatedConcepts\":[\"AVCO\",\"Weighted average cost\"],\"numericAnswer\":1950,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"ac-inv-4\",\"topicId\":\"t-acc-inv\",\"difficulty\":\"medium\",\"scenario\":\"A manufacturer incurs the following for a batch of finished goods: raw materials £8,000, direct labour £5,000, production overheads £3,000, and storage of finished goods £1,000. Selling costs are £2,000.\",\"stem\":\"What is the cost of this inventory under IAS 2 (£)?\",\"explanation\":\"IAS 2 cost includes purchase costs and costs of conversion (labour and production overheads). Storage of finished goods and selling costs are excluded.\",\"workedSolution\":\"= 8,000 + 5,000 + 3,000 = £16,000 (storage and selling costs excluded)\",\"relatedConcepts\":[\"IAS 2\",\"Costs of conversion\"],\"numericAnswer\":16000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"ac-inv-5\",\"topicId\":\"t-acc-inv\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"Under IAS 2, which of the following costs may be included in the cost of inventory?\",\"explanation\":\"IAS 2 cost comprises purchase price, import duties, irrecoverable taxes, carriage inwards, and costs of conversion. Selling costs, abnormal waste, storage of finished goods and administrative overheads are excluded.\",\"relatedConcepts\":[\"IAS 2\",\"Inventory cost\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-ac-inv-5-0-220\",\"questionId\":\"ac-inv-5\",\"label\":\"Carriage inwards on raw materials\",\"isCorrect\":true,\"feedback\":\"Correct — costs of bringing inventory to its present location are included.\",\"sortOrder\":0},{\"id\":\"a-ac-inv-5-1-221\",\"questionId\":\"ac-inv-5\",\"label\":\"Selling and distribution costs\",\"isCorrect\":false,\"feedback\":\"These are excluded from inventory cost.\",\"sortOrder\":1},{\"id\":\"a-ac-inv-5-2-222\",\"questionId\":\"ac-inv-5\",\"label\":\"Abnormal amounts of wasted materials\",\"isCorrect\":false,\"feedback\":\"Abnormal waste is expensed, not included in cost.\",\"sortOrder\":2},{\"id\":\"a-ac-inv-5-3-223\",\"questionId\":\"ac-inv-5\",\"label\":\"General administrative overheads\",\"isCorrect\":false,\"feedback\":\"Admin overheads not related to production are excluded.\",\"sortOrder\":3}]}],\"t-ass-proc\":[{\"id\":\"q-ass-1\",\"topicId\":\"t-ass-proc\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"What level of assurance does a 'reasonable assurance' engagement provide?\",\"explanation\":\"Reasonable assurance is high but not absolute, expressed positively (e.g. 'the financial statements give a true and fair view').\",\"relatedConcepts\":[\"Levels of assurance\",\"Audit opinion\"],\"rating\":1050,\"estSeconds\":60,\"isPublished\":true,\"answers\":[{\"id\":\"a-q-ass-1-0-20\",\"questionId\":\"q-ass-1\",\"label\":\"High but not absolute, expressed positively\",\"isCorrect\":true,\"feedback\":\"Correct — e.g. a statutory audit opinion.\",\"sortOrder\":0},{\"id\":\"a-q-ass-1-1-21\",\"questionId\":\"q-ass-1\",\"label\":\"Limited, expressed negatively\",\"isCorrect\":false,\"feedback\":\"That describes a review engagement.\",\"sortOrder\":1},{\"id\":\"a-q-ass-1-2-22\",\"questionId\":\"q-ass-1\",\"label\":\"Absolute assurance\",\"isCorrect\":false,\"feedback\":\"No engagement gives absolute assurance.\",\"sortOrder\":2},{\"id\":\"a-q-ass-1-3-23\",\"questionId\":\"q-ass-1\",\"label\":\"No assurance\",\"isCorrect\":false,\"feedback\":\"An agreed-upon procedures engagement gives no assurance.\",\"sortOrder\":3}]},{\"id\":\"x-ass-proc-1\",\"topicId\":\"t-ass-proc\",\"type\":\"multi\",\"difficulty\":\"medium\",\"stem\":\"Which of the following are elements of an assurance engagement? Select all that apply.\",\"explanation\":\"The five elements are: a three-party relationship, subject matter, suitable criteria, sufficient appropriate evidence, and a written assurance report.\",\"relatedConcepts\":[\"Elements of assurance\",\"Assurance engagements\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-x-ass-proc-1-0-16\",\"questionId\":\"x-ass-proc-1\",\"label\":\"A three-party relationship\",\"isCorrect\":true,\"feedback\":\"Correct — practitioner, responsible party and intended users.\",\"sortOrder\":0},{\"id\":\"a-x-ass-proc-1-1-17\",\"questionId\":\"x-ass-proc-1\",\"label\":\"Suitable criteria\",\"isCorrect\":true,\"feedback\":\"Correct — benchmarks against which the subject matter is evaluated.\",\"sortOrder\":1},{\"id\":\"a-x-ass-proc-1-2-18\",\"questionId\":\"x-ass-proc-1\",\"label\":\"Sufficient appropriate evidence\",\"isCorrect\":true,\"feedback\":\"Correct — to support the conclusion.\",\"sortOrder\":2},{\"id\":\"a-x-ass-proc-1-3-19\",\"questionId\":\"x-ass-proc-1\",\"label\":\"A guarantee that no errors exist\",\"isCorrect\":false,\"feedback\":\"No engagement provides absolute assurance.\",\"sortOrder\":3}]},{\"id\":\"x-ass-proc-2\",\"topicId\":\"t-ass-proc\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"A review engagement provides which level of assurance and form of conclusion?\",\"explanation\":\"A review gives limited assurance, expressed in the negative form (e.g. 'nothing has come to our attention…').\",\"relatedConcepts\":[\"Limited assurance\",\"Negative assurance\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-x-ass-proc-2-0-20\",\"questionId\":\"x-ass-proc-2\",\"label\":\"Limited assurance, negative conclusion\",\"isCorrect\":true,\"feedback\":\"Correct — lower than an audit's reasonable assurance.\",\"sortOrder\":0},{\"id\":\"a-x-ass-proc-2-1-21\",\"questionId\":\"x-ass-proc-2\",\"label\":\"Reasonable assurance, positive conclusion\",\"isCorrect\":false,\"feedback\":\"That describes an audit.\",\"sortOrder\":1},{\"id\":\"a-x-ass-proc-2-2-22\",\"questionId\":\"x-ass-proc-2\",\"label\":\"Absolute assurance\",\"isCorrect\":false,\"feedback\":\"No engagement gives absolute assurance.\",\"sortOrder\":2},{\"id\":\"a-x-ass-proc-2-3-23\",\"questionId\":\"x-ass-proc-2\",\"label\":\"No assurance\",\"isCorrect\":false,\"feedback\":\"A review does provide limited assurance.\",\"sortOrder\":3}]},{\"id\":\"as-proc-1\",\"topicId\":\"t-ass-proc\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"Which of the following is an essential element of an assurance engagement?\",\"explanation\":\"The five elements are: a three-party relationship, suitable subject matter, suitable criteria, sufficient appropriate evidence, and a written assurance report.\",\"relatedConcepts\":[\"Elements of assurance\",\"Three-party relationship\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-proc-1-0-224\",\"questionId\":\"as-proc-1\",\"label\":\"A three-party relationship between practitioner, responsible party and intended users\",\"isCorrect\":true,\"feedback\":\"Correct — this is one of the five essential elements.\",\"sortOrder\":0},{\"id\":\"a-as-proc-1-1-225\",\"questionId\":\"as-proc-1\",\"label\":\"A guarantee that the subject matter is free from error\",\"isCorrect\":false,\"feedback\":\"Assurance gives a conclusion, never a guarantee of absolute correctness.\",\"sortOrder\":1},{\"id\":\"a-as-proc-1-2-226\",\"questionId\":\"as-proc-1\",\"label\":\"A contingent fee linked to the outcome of the engagement\",\"isCorrect\":false,\"feedback\":\"Contingent fees create a self-interest threat and are not an element of assurance.\",\"sortOrder\":2},{\"id\":\"a-as-proc-1-3-227\",\"questionId\":\"as-proc-1\",\"label\":\"A promise that fraud will always be detected\",\"isCorrect\":false,\"feedback\":\"Assurance does not guarantee the detection of all fraud.\",\"sortOrder\":3}]},{\"id\":\"as-proc-2\",\"topicId\":\"t-ass-proc\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"A practitioner is engaged to review interim financial statements. The report will state that 'nothing has come to our attention' to suggest the statements are misstated.\",\"stem\":\"What level of assurance is being provided?\",\"explanation\":\"A negatively worded ('nothing has come to our attention') conclusion based on limited procedures, mainly enquiry and analytical review, provides limited assurance.\",\"relatedConcepts\":[\"Limited assurance\",\"Negative conclusion\",\"Review engagement\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-proc-2-0-228\",\"questionId\":\"as-proc-2\",\"label\":\"Limited assurance\",\"isCorrect\":true,\"feedback\":\"Correct — the negative form of words and reduced procedures indicate a limited (moderate) assurance engagement.\",\"sortOrder\":0},{\"id\":\"a-as-proc-2-1-229\",\"questionId\":\"as-proc-2\",\"label\":\"Reasonable assurance\",\"isCorrect\":false,\"feedback\":\"Reasonable assurance uses a positive conclusion ('in our opinion'), not 'nothing has come to our attention'.\",\"sortOrder\":1},{\"id\":\"a-as-proc-2-2-230\",\"questionId\":\"as-proc-2\",\"label\":\"Absolute assurance\",\"isCorrect\":false,\"feedback\":\"Absolute assurance is never attainable due to inherent limitations.\",\"sortOrder\":2},{\"id\":\"a-as-proc-2-3-231\",\"questionId\":\"as-proc-2\",\"label\":\"No assurance at all\",\"isCorrect\":false,\"feedback\":\"A review provides a conclusion and therefore a level of assurance.\",\"sortOrder\":3}]},{\"id\":\"as-proc-3\",\"topicId\":\"t-ass-proc\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Compared with a limited assurance engagement, a reasonable assurance engagement involves:\",\"explanation\":\"Reasonable assurance is the higher level: more extensive procedures, a lower (reduced) acceptable level of engagement risk and a positively worded conclusion.\",\"relatedConcepts\":[\"Reasonable assurance\",\"Engagement risk\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-proc-3-0-232\",\"questionId\":\"as-proc-3\",\"label\":\"More extensive procedures and a positively worded conclusion\",\"isCorrect\":true,\"feedback\":\"Correct — reasonable assurance reduces engagement risk to an acceptably low level and gives a positive opinion.\",\"sortOrder\":0},{\"id\":\"a-as-proc-3-1-233\",\"questionId\":\"as-proc-3\",\"label\":\"Fewer procedures and a higher level of engagement risk\",\"isCorrect\":false,\"feedback\":\"That describes limited assurance, which is the lower level.\",\"sortOrder\":1},{\"id\":\"a-as-proc-3-2-234\",\"questionId\":\"as-proc-3\",\"label\":\"A guarantee of accuracy\",\"isCorrect\":false,\"feedback\":\"No engagement provides a guarantee.\",\"sortOrder\":2},{\"id\":\"a-as-proc-3-3-235\",\"questionId\":\"as-proc-3\",\"label\":\"No requirement to gather evidence\",\"isCorrect\":false,\"feedback\":\"All assurance requires sufficient appropriate evidence.\",\"sortOrder\":3}]},{\"id\":\"as-proc-4\",\"topicId\":\"t-ass-proc\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"What is the principal benefit of an assurance engagement to the intended users?\",\"explanation\":\"Assurance enhances the degree of confidence intended users can place in the subject matter, reducing information risk.\",\"relatedConcepts\":[\"Information risk\",\"Credibility\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-proc-4-0-236\",\"questionId\":\"as-proc-4\",\"label\":\"It enhances the credibility of the information and reduces information risk\",\"isCorrect\":true,\"feedback\":\"Correct — increased user confidence is the core benefit.\",\"sortOrder\":0},{\"id\":\"a-as-proc-4-1-237\",\"questionId\":\"as-proc-4\",\"label\":\"It removes all responsibility from the directors\",\"isCorrect\":false,\"feedback\":\"Responsibility for the subject matter remains with the responsible party.\",\"sortOrder\":1},{\"id\":\"a-as-proc-4-2-238\",\"questionId\":\"as-proc-4\",\"label\":\"It eliminates the possibility of error in the information\",\"isCorrect\":false,\"feedback\":\"Assurance reduces, but cannot eliminate, the risk of error.\",\"sortOrder\":2},{\"id\":\"a-as-proc-4-3-239\",\"questionId\":\"as-proc-4\",\"label\":\"It guarantees the company will not fail\",\"isCorrect\":false,\"feedback\":\"Assurance is not a guarantee of future viability.\",\"sortOrder\":3}]},{\"id\":\"as-proc-5\",\"topicId\":\"t-ass-proc\",\"type\":\"multi\",\"difficulty\":\"medium\",\"stem\":\"Select ALL of the following that are inherent limitations of an assurance engagement.\",\"explanation\":\"Inherent limitations include the use of sampling/testing rather than 100% checking, the use of judgement, the nature of evidence being persuasive rather than conclusive, and the existence of collusion/concealment of fraud. A written report is not a limitation.\",\"relatedConcepts\":[\"Inherent limitations\",\"Sampling\",\"Persuasive evidence\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-proc-5-0-240\",\"questionId\":\"as-proc-5\",\"label\":\"The use of testing/sampling rather than examining every item\",\"isCorrect\":true,\"feedback\":\"Correct — testing only a sample is an inherent limitation.\",\"sortOrder\":0},{\"id\":\"a-as-proc-5-1-241\",\"questionId\":\"as-proc-5\",\"label\":\"Evidence being persuasive rather than conclusive\",\"isCorrect\":true,\"feedback\":\"Correct — most assurance evidence is persuasive only.\",\"sortOrder\":1},{\"id\":\"a-as-proc-5-2-242\",\"questionId\":\"as-proc-5\",\"label\":\"The possibility of fraud being concealed through collusion\",\"isCorrect\":true,\"feedback\":\"Correct — well-concealed collusion may not be detected.\",\"sortOrder\":2},{\"id\":\"a-as-proc-5-3-243\",\"questionId\":\"as-proc-5\",\"label\":\"The issue of a written report to intended users\",\"isCorrect\":false,\"feedback\":\"A written report is a required element, not a limitation.\",\"sortOrder\":3}]},{\"id\":\"as-proc-6\",\"topicId\":\"t-ass-proc\",\"type\":\"mcq\",\"difficulty\":\"hard\",\"scenario\":\"A practitioner is asked to provide assurance over a forecast of a company's profits for the next three years.\",\"stem\":\"Why can only limited assurance, at best, normally be given over a profit forecast?\",\"explanation\":\"A forecast concerns future events and depends on assumptions that are inherently uncertain, so reasonable assurance cannot be given; the practitioner reports on the reasonableness of assumptions with limited (negative) assurance.\",\"relatedConcepts\":[\"Prospective information\",\"Assumptions\",\"Limited assurance\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-proc-6-0-244\",\"questionId\":\"as-proc-6\",\"label\":\"The subject matter relates to uncertain future events based on assumptions\",\"isCorrect\":true,\"feedback\":\"Correct — future-oriented information is inherently uncertain, limiting the assurance available.\",\"sortOrder\":0},{\"id\":\"a-as-proc-6-1-245\",\"questionId\":\"as-proc-6\",\"label\":\"Forecasts are never the responsibility of the directors\",\"isCorrect\":false,\"feedback\":\"The forecast remains the directors' responsibility.\",\"sortOrder\":1},{\"id\":\"a-as-proc-6-2-246\",\"questionId\":\"as-proc-6\",\"label\":\"Forecasts contain no subject matter to examine\",\"isCorrect\":false,\"feedback\":\"A forecast is suitable subject matter; the issue is uncertainty.\",\"sortOrder\":2},{\"id\":\"a-as-proc-6-3-247\",\"questionId\":\"as-proc-6\",\"label\":\"Limited assurance always gives more confidence than reasonable assurance\",\"isCorrect\":false,\"feedback\":\"Limited assurance gives less confidence than reasonable assurance.\",\"sortOrder\":3}]}],\"t-ass-int\":[{\"id\":\"x-ass-int-1\",\"topicId\":\"t-ass-int\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Which of the following is an inherent limitation of any internal control system?\",\"explanation\":\"Controls can be overridden by management, circumvented by collusion, or fail through human error — inherent limitations no system removes.\",\"relatedConcepts\":[\"Internal control\",\"Limitations of control\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-x-ass-int-1-0-24\",\"questionId\":\"x-ass-int-1\",\"label\":\"The possibility of management override of controls\",\"isCorrect\":true,\"feedback\":\"Correct — a classic inherent limitation.\",\"sortOrder\":0},{\"id\":\"a-x-ass-int-1-1-25\",\"questionId\":\"x-ass-int-1\",\"label\":\"Segregation of duties\",\"isCorrect\":false,\"feedback\":\"This is a control, not a limitation.\",\"sortOrder\":1},{\"id\":\"a-x-ass-int-1-2-26\",\"questionId\":\"x-ass-int-1\",\"label\":\"Authorisation procedures\",\"isCorrect\":false,\"feedback\":\"This is a control activity.\",\"sortOrder\":2},{\"id\":\"a-x-ass-int-1-3-27\",\"questionId\":\"x-ass-int-1\",\"label\":\"Reconciliations being performed\",\"isCorrect\":false,\"feedback\":\"This is a control.\",\"sortOrder\":3}]},{\"id\":\"as-int-1\",\"topicId\":\"t-ass-int\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"At Harlow Ltd the same warehouse clerk raises purchase orders, receives the goods and approves the supplier invoices for payment.\",\"stem\":\"Which control deficiency does this most directly illustrate?\",\"explanation\":\"Combining ordering, receiving and invoice approval in one person is a lack of segregation of duties, increasing the risk of fraud and unauthorised purchases going undetected.\",\"relatedConcepts\":[\"Segregation of duties\",\"Purchases cycle\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-int-1-0-248\",\"questionId\":\"as-int-1\",\"label\":\"A lack of segregation of duties\",\"isCorrect\":true,\"feedback\":\"Correct — incompatible functions are concentrated in one individual.\",\"sortOrder\":0},{\"id\":\"a-as-int-1-1-249\",\"questionId\":\"as-int-1\",\"label\":\"A weakness in physical controls over inventory\",\"isCorrect\":false,\"feedback\":\"The issue is duties, not physical security.\",\"sortOrder\":1},{\"id\":\"a-as-int-1-2-250\",\"questionId\":\"as-int-1\",\"label\":\"An absence of analytical review\",\"isCorrect\":false,\"feedback\":\"Analytical review is a substantive procedure, not the deficiency here.\",\"sortOrder\":2},{\"id\":\"a-as-int-1-3-251\",\"questionId\":\"as-int-1\",\"label\":\"A failure of the external confirmation process\",\"isCorrect\":false,\"feedback\":\"External confirmation is an evidence technique, not the control issue.\",\"sortOrder\":3}]},{\"id\":\"as-int-2\",\"topicId\":\"t-ass-int\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"A requirement that all purchase invoices over £10,000 be approved by a manager before payment is an example of which type of control?\",\"explanation\":\"An authorisation/approval control ensures transactions are sanctioned by an appropriate person before being processed.\",\"relatedConcepts\":[\"Authorisation controls\",\"Control activities\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-int-2-0-252\",\"questionId\":\"as-int-2\",\"label\":\"An authorisation (approval) control\",\"isCorrect\":true,\"feedback\":\"Correct — approval limits are authorisation controls.\",\"sortOrder\":0},{\"id\":\"a-as-int-2-1-253\",\"questionId\":\"as-int-2\",\"label\":\"A reconciliation control\",\"isCorrect\":false,\"feedback\":\"Reconciliations compare two sets of records; this is approval.\",\"sortOrder\":1},{\"id\":\"a-as-int-2-2-254\",\"questionId\":\"as-int-2\",\"label\":\"A physical control\",\"isCorrect\":false,\"feedback\":\"Physical controls restrict access to assets and records.\",\"sortOrder\":2},{\"id\":\"a-as-int-2-3-255\",\"questionId\":\"as-int-2\",\"label\":\"An arithmetical/accuracy control\",\"isCorrect\":false,\"feedback\":\"That checks calculations, not whether a transaction is sanctioned.\",\"sortOrder\":3}]},{\"id\":\"as-int-3\",\"topicId\":\"t-ass-int\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Which of the following best describes a test of controls (as opposed to a substantive procedure)?\",\"explanation\":\"A test of controls evaluates the operating effectiveness of a control in preventing or detecting misstatements, e.g. inspecting evidence that invoices were authorised.\",\"relatedConcepts\":[\"Tests of controls\",\"Operating effectiveness\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-int-3-0-256\",\"questionId\":\"as-int-3\",\"label\":\"Inspecting a sample of invoices for evidence of authorisation\",\"isCorrect\":true,\"feedback\":\"Correct — this tests whether the control operated, not the balance directly.\",\"sortOrder\":0},{\"id\":\"a-as-int-3-1-257\",\"questionId\":\"as-int-3\",\"label\":\"Recalculating the closing inventory valuation\",\"isCorrect\":false,\"feedback\":\"That is a substantive procedure testing the balance.\",\"sortOrder\":1},{\"id\":\"a-as-int-3-2-258\",\"questionId\":\"as-int-3\",\"label\":\"Confirming a receivables balance with the customer\",\"isCorrect\":false,\"feedback\":\"External confirmation is a substantive procedure.\",\"sortOrder\":2},{\"id\":\"a-as-int-3-3-259\",\"questionId\":\"as-int-3\",\"label\":\"Performing analytical review on gross margin\",\"isCorrect\":false,\"feedback\":\"That is a substantive analytical procedure.\",\"sortOrder\":3}]},{\"id\":\"as-int-4\",\"topicId\":\"t-ass-int\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"During the walkthrough of Mersey Ltd's sales system, the practitioner finds that monthly bank reconciliations are prepared but are never reviewed or signed off by a second person.\",\"stem\":\"What is the most appropriate recommendation to address this deficiency?\",\"explanation\":\"An independent review and sign-off of reconciliations by someone other than the preparer provides a monitoring control over accuracy and reduces the risk of errors or manipulation going undetected.\",\"relatedConcepts\":[\"Reconciliations\",\"Independent review\",\"Monitoring\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-int-4-0-260\",\"questionId\":\"as-int-4\",\"label\":\"Reconciliations should be independently reviewed and signed by a responsible official\",\"isCorrect\":true,\"feedback\":\"Correct — independent review and evidence of it (sign-off) addresses the deficiency.\",\"sortOrder\":0},{\"id\":\"a-as-int-4-1-261\",\"questionId\":\"as-int-4\",\"label\":\"Reconciliations should be discontinued to save time\",\"isCorrect\":false,\"feedback\":\"Removing the control increases risk.\",\"sortOrder\":1},{\"id\":\"a-as-int-4-2-262\",\"questionId\":\"as-int-4\",\"label\":\"The same preparer should review their own work twice\",\"isCorrect\":false,\"feedback\":\"Self-review does not provide independent oversight.\",\"sortOrder\":2},{\"id\":\"a-as-int-4-3-263\",\"questionId\":\"as-int-4\",\"label\":\"A contingent bonus should be paid for reconciliations completed\",\"isCorrect\":false,\"feedback\":\"This introduces incentives for manipulation, not control.\",\"sortOrder\":3}]},{\"id\":\"as-int-5\",\"topicId\":\"t-ass-int\",\"type\":\"mcq\",\"difficulty\":\"hard\",\"stem\":\"Which statement about the limitations of internal control is correct?\",\"explanation\":\"Even a well-designed system can be overridden by management, defeated by collusion, or fail through human error; controls also tend to address routine rather than non-routine transactions, and their cost should not exceed their benefit.\",\"relatedConcepts\":[\"Limitations of internal control\",\"Management override\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-int-5-0-264\",\"questionId\":\"as-int-5\",\"label\":\"Controls can be overridden by management or defeated by collusion\",\"isCorrect\":true,\"feedback\":\"Correct — these are recognised inherent limitations of any control system.\",\"sortOrder\":0},{\"id\":\"a-as-int-5-1-265\",\"questionId\":\"as-int-5\",\"label\":\"A good system of internal control eliminates all risk of misstatement\",\"isCorrect\":false,\"feedback\":\"No system removes all risk; limitations always remain.\",\"sortOrder\":1},{\"id\":\"a-as-int-5-2-266\",\"questionId\":\"as-int-5\",\"label\":\"Internal controls remove the need for the practitioner to gather evidence\",\"isCorrect\":false,\"feedback\":\"Evidence is still required regardless of controls.\",\"sortOrder\":2},{\"id\":\"a-as-int-5-3-267\",\"questionId\":\"as-int-5\",\"label\":\"Controls are equally effective for routine and non-routine transactions\",\"isCorrect\":false,\"feedback\":\"Controls typically address routine transactions better than unusual ones.\",\"sortOrder\":3}]},{\"id\":\"as-int-6\",\"topicId\":\"t-ass-int\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"A practitioner draws a flowchart and writes narrative notes describing how the wages system processes data from clock-in to payment. This is an example of:\",\"explanation\":\"Documenting a system using narrative notes, flowcharts or questionnaires is part of recording and understanding the system before evaluating its controls.\",\"relatedConcepts\":[\"Documenting systems\",\"Flowcharts\",\"Narrative notes\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-int-6-0-268\",\"questionId\":\"as-int-6\",\"label\":\"Recording (documenting) the accounting system\",\"isCorrect\":true,\"feedback\":\"Correct — flowcharts and narrative notes are methods of recording systems.\",\"sortOrder\":0},{\"id\":\"a-as-int-6-1-269\",\"questionId\":\"as-int-6\",\"label\":\"Performing a test of detail on the wages balance\",\"isCorrect\":false,\"feedback\":\"That is a substantive procedure, not recording the system.\",\"sortOrder\":1},{\"id\":\"a-as-int-6-2-270\",\"questionId\":\"as-int-6\",\"label\":\"Issuing the assurance report\",\"isCorrect\":false,\"feedback\":\"Documentation precedes any reporting.\",\"sortOrder\":2},{\"id\":\"a-as-int-6-3-271\",\"questionId\":\"as-int-6\",\"label\":\"Confirming wages with employees\",\"isCorrect\":false,\"feedback\":\"External confirmation is an evidence technique, not system documentation.\",\"sortOrder\":3}]}],\"t-ass-evid\":[{\"id\":\"as-evid-1\",\"topicId\":\"t-ass-evid\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Sufficient appropriate evidence has two dimensions. 'Sufficiency' and 'appropriateness' respectively refer to:\",\"explanation\":\"Sufficiency is the measure of the quantity of evidence; appropriateness is the measure of its quality — its relevance and reliability.\",\"relatedConcepts\":[\"Sufficiency\",\"Appropriateness\",\"Relevance and reliability\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-evid-1-0-272\",\"questionId\":\"as-evid-1\",\"label\":\"The quantity of evidence; and its quality (relevance and reliability)\",\"isCorrect\":true,\"feedback\":\"Correct — sufficiency = quantity, appropriateness = quality.\",\"sortOrder\":0},{\"id\":\"a-as-evid-1-1-273\",\"questionId\":\"as-evid-1\",\"label\":\"The cost of evidence; and the time taken to obtain it\",\"isCorrect\":false,\"feedback\":\"Neither dimension is about cost or time.\",\"sortOrder\":1},{\"id\":\"a-as-evid-1-2-274\",\"questionId\":\"as-evid-1\",\"label\":\"The number of staff used; and their seniority\",\"isCorrect\":false,\"feedback\":\"These relate to resourcing, not evidence quality.\",\"sortOrder\":2},{\"id\":\"a-as-evid-1-3-275\",\"questionId\":\"as-evid-1\",\"label\":\"The length of the report; and its tone\",\"isCorrect\":false,\"feedback\":\"These describe the report, not evidence.\",\"sortOrder\":3}]},{\"id\":\"as-evid-2\",\"topicId\":\"t-ass-evid\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"A practitioner attends Severn Ltd's year-end inventory count and personally counts a sample of items, agreeing them to the count sheets.\",\"stem\":\"Which financial statement assertion does physically counting the inventory MOST directly support?\",\"explanation\":\"Physically inspecting and counting inventory primarily provides evidence that the recorded inventory exists (existence assertion).\",\"relatedConcepts\":[\"Existence\",\"Inventory count\",\"Inspection\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-evid-2-0-276\",\"questionId\":\"as-evid-2\",\"label\":\"Existence\",\"isCorrect\":true,\"feedback\":\"Correct — counting confirms that recorded inventory physically exists.\",\"sortOrder\":0},{\"id\":\"a-as-evid-2-1-277\",\"questionId\":\"as-evid-2\",\"label\":\"Cut-off of revenue\",\"isCorrect\":false,\"feedback\":\"Cut-off relates to recording transactions in the correct period.\",\"sortOrder\":1},{\"id\":\"a-as-evid-2-2-278\",\"questionId\":\"as-evid-2\",\"label\":\"Rights and obligations over receivables\",\"isCorrect\":false,\"feedback\":\"That concerns ownership of receivables, not the count.\",\"sortOrder\":2},{\"id\":\"a-as-evid-2-3-279\",\"questionId\":\"as-evid-2\",\"label\":\"Classification of expenses\",\"isCorrect\":false,\"feedback\":\"Classification is about the correct account, not existence of stock.\",\"sortOrder\":3}]},{\"id\":\"as-evid-3\",\"topicId\":\"t-ass-evid\",\"type\":\"mcq\",\"difficulty\":\"hard\",\"stem\":\"According to the generally accepted hierarchy of evidence reliability, which source is normally the MOST reliable?\",\"explanation\":\"Evidence is more reliable when obtained from independent external sources, when generated under effective controls, when obtained directly by the practitioner, and when documentary/original rather than oral.\",\"relatedConcepts\":[\"Reliability of evidence\",\"External evidence\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-evid-3-0-280\",\"questionId\":\"as-evid-3\",\"label\":\"A confirmation received directly from an independent third party\",\"isCorrect\":true,\"feedback\":\"Correct — external, directly obtained documentary evidence is the most reliable.\",\"sortOrder\":0},{\"id\":\"a-as-evid-3-1-281\",\"questionId\":\"as-evid-3\",\"label\":\"An oral representation from a member of management\",\"isCorrect\":false,\"feedback\":\"Oral internal evidence is among the least reliable.\",\"sortOrder\":1},{\"id\":\"a-as-evid-3-2-282\",\"questionId\":\"as-evid-3\",\"label\":\"A photocopy of an internal document provided by the client\",\"isCorrect\":false,\"feedback\":\"Internally generated copies are less reliable than external originals.\",\"sortOrder\":2},{\"id\":\"a-as-evid-3-3-283\",\"questionId\":\"as-evid-3\",\"label\":\"A draft schedule prepared by the client's bookkeeper\",\"isCorrect\":false,\"feedback\":\"Internally generated evidence is weaker than external evidence.\",\"sortOrder\":3}]},{\"id\":\"as-evid-4\",\"topicId\":\"t-ass-evid\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"The practitioner is concerned that Trent Ltd may have recorded sales in the current year that actually relate to goods dispatched after the year end.\",\"stem\":\"Which assertion is the practitioner primarily testing, and which procedure best addresses it?\",\"explanation\":\"This is a cut-off (occurrence/period) concern; inspecting goods dispatch notes around the year end and agreeing them to the date sales were recorded tests cut-off.\",\"relatedConcepts\":[\"Cut-off\",\"Occurrence\",\"Dispatch notes\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-evid-4-0-284\",\"questionId\":\"as-evid-4\",\"label\":\"Cut-off — by inspecting dispatch notes immediately before and after the year end\",\"isCorrect\":true,\"feedback\":\"Correct — matching dispatch dates to recording dates tests cut-off.\",\"sortOrder\":0},{\"id\":\"a-as-evid-4-1-285\",\"questionId\":\"as-evid-4\",\"label\":\"Valuation — by recalculating depreciation\",\"isCorrect\":false,\"feedback\":\"Depreciation is unrelated to the timing of sales.\",\"sortOrder\":1},{\"id\":\"a-as-evid-4-2-286\",\"questionId\":\"as-evid-4\",\"label\":\"Existence — by counting inventory\",\"isCorrect\":false,\"feedback\":\"Counting stock does not address when sales were recorded.\",\"sortOrder\":2},{\"id\":\"a-as-evid-4-3-287\",\"questionId\":\"as-evid-4\",\"label\":\"Rights — by inspecting the company's statutory books\",\"isCorrect\":false,\"feedback\":\"Statutory books do not test sales cut-off.\",\"sortOrder\":3}]},{\"id\":\"as-evid-5\",\"topicId\":\"t-ass-evid\",\"type\":\"multi\",\"difficulty\":\"medium\",\"stem\":\"Select ALL of the following that are recognised procedures for obtaining assurance evidence.\",\"explanation\":\"Recognised techniques include inspection, observation, external confirmation, recalculation, reperformance, analytical procedures and enquiry. 'Guaranteeing the result' is not a procedure.\",\"relatedConcepts\":[\"Evidence-gathering procedures\",\"AEIOU\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-evid-5-0-288\",\"questionId\":\"as-evid-5\",\"label\":\"Inspection of records or documents\",\"isCorrect\":true,\"feedback\":\"Correct — inspection is a recognised procedure.\",\"sortOrder\":0},{\"id\":\"a-as-evid-5-1-289\",\"questionId\":\"as-evid-5\",\"label\":\"External confirmation from a third party\",\"isCorrect\":true,\"feedback\":\"Correct — confirmation is a recognised procedure.\",\"sortOrder\":1},{\"id\":\"a-as-evid-5-2-290\",\"questionId\":\"as-evid-5\",\"label\":\"Recalculation of a figure for arithmetical accuracy\",\"isCorrect\":true,\"feedback\":\"Correct — recalculation is a recognised procedure.\",\"sortOrder\":2},{\"id\":\"a-as-evid-5-3-291\",\"questionId\":\"as-evid-5\",\"label\":\"Guaranteeing that the financial statements are correct\",\"isCorrect\":false,\"feedback\":\"Assurance never guarantees correctness; this is not a procedure.\",\"sortOrder\":3}]},{\"id\":\"as-evid-6\",\"topicId\":\"t-ass-evid\",\"type\":\"scenario\",\"difficulty\":\"easy\",\"scenario\":\"To test the completeness of recorded purchases, a practitioner wishes to ensure that all goods received have been recorded as liabilities.\",\"stem\":\"Which direction of testing is appropriate?\",\"explanation\":\"To test completeness, trace from source documents (e.g. goods received notes) forward to the accounting records, ensuring nothing has been omitted.\",\"relatedConcepts\":[\"Completeness\",\"Direction of testing\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-evid-6-0-292\",\"questionId\":\"as-evid-6\",\"label\":\"Trace from goods received notes to the purchase ledger\",\"isCorrect\":true,\"feedback\":\"Correct — testing from source to records tests completeness (understatement).\",\"sortOrder\":0},{\"id\":\"a-as-evid-6-1-293\",\"questionId\":\"as-evid-6\",\"label\":\"Trace from the purchase ledger to goods received notes\",\"isCorrect\":false,\"feedback\":\"That direction tests occurrence/existence, not completeness.\",\"sortOrder\":1},{\"id\":\"a-as-evid-6-2-294\",\"questionId\":\"as-evid-6\",\"label\":\"Confirm the year-end bank balance\",\"isCorrect\":false,\"feedback\":\"Irrelevant to completeness of purchases.\",\"sortOrder\":2},{\"id\":\"a-as-evid-6-3-295\",\"questionId\":\"as-evid-6\",\"label\":\"Recalculate depreciation on plant\",\"isCorrect\":false,\"feedback\":\"Unrelated to recording of purchases.\",\"sortOrder\":3}]}],\"t-ass-eth\":[{\"id\":\"as-eth-1\",\"topicId\":\"t-ass-eth\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"Which of the following is NOT one of the five fundamental principles in the IESBA/ICAEW Code of Ethics?\",\"explanation\":\"The five fundamental principles are integrity, objectivity, professional competence and due care, confidentiality, and professional behaviour. Independence is a related concept but not itself one of the five principles.\",\"relatedConcepts\":[\"Fundamental principles\",\"Code of Ethics\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-eth-1-0-296\",\"questionId\":\"as-eth-1\",\"label\":\"Profitability\",\"isCorrect\":true,\"feedback\":\"Correct — profitability is not a fundamental principle.\",\"sortOrder\":0},{\"id\":\"a-as-eth-1-1-297\",\"questionId\":\"as-eth-1\",\"label\":\"Integrity\",\"isCorrect\":false,\"feedback\":\"Integrity is one of the five fundamental principles.\",\"sortOrder\":1},{\"id\":\"a-as-eth-1-2-298\",\"questionId\":\"as-eth-1\",\"label\":\"Objectivity\",\"isCorrect\":false,\"feedback\":\"Objectivity is one of the five fundamental principles.\",\"sortOrder\":2},{\"id\":\"a-as-eth-1-3-299\",\"questionId\":\"as-eth-1\",\"label\":\"Confidentiality\",\"isCorrect\":false,\"feedback\":\"Confidentiality is one of the five fundamental principles.\",\"sortOrder\":3}]},{\"id\":\"as-eth-2\",\"topicId\":\"t-ass-eth\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"The fees from a single assurance client represent 18% of the practice's total fee income, and the partner is worried about losing the client.\",\"stem\":\"Which threat to the fundamental principles does this primarily create?\",\"explanation\":\"Fee dependence creates a self-interest threat — the firm's financial interest may inappropriately influence its judgement and objectivity.\",\"relatedConcepts\":[\"Self-interest threat\",\"Fee dependence\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-eth-2-0-300\",\"questionId\":\"as-eth-2\",\"label\":\"Self-interest threat\",\"isCorrect\":true,\"feedback\":\"Correct — economic dependence on the client's fees is a self-interest threat.\",\"sortOrder\":0},{\"id\":\"a-as-eth-2-1-301\",\"questionId\":\"as-eth-2\",\"label\":\"Advocacy threat\",\"isCorrect\":false,\"feedback\":\"Advocacy arises from promoting a client's position, not fee dependence.\",\"sortOrder\":1},{\"id\":\"a-as-eth-2-2-302\",\"questionId\":\"as-eth-2\",\"label\":\"Familiarity threat\",\"isCorrect\":false,\"feedback\":\"Familiarity arises from close relationships, not fees.\",\"sortOrder\":2},{\"id\":\"a-as-eth-2-3-303\",\"questionId\":\"as-eth-2\",\"label\":\"Intimidation threat\",\"isCorrect\":false,\"feedback\":\"Intimidation involves pressure or threats, not voluntary fee reliance.\",\"sortOrder\":3}]},{\"id\":\"as-eth-3\",\"topicId\":\"t-ass-eth\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"A firm prepares the accounting records and financial statements of an assurance client and then provides assurance on those same financial statements.\",\"stem\":\"Which threat does this most directly create?\",\"explanation\":\"Reviewing work that the firm itself produced is a self-review threat, because the firm may be reluctant to highlight errors in its own work.\",\"relatedConcepts\":[\"Self-review threat\",\"Provision of accounting services\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-eth-3-0-304\",\"questionId\":\"as-eth-3\",\"label\":\"Self-review threat\",\"isCorrect\":true,\"feedback\":\"Correct — the firm would be reviewing its own work.\",\"sortOrder\":0},{\"id\":\"a-as-eth-3-1-305\",\"questionId\":\"as-eth-3\",\"label\":\"Self-interest threat\",\"isCorrect\":false,\"feedback\":\"The issue is reviewing own work, not a financial interest.\",\"sortOrder\":1},{\"id\":\"a-as-eth-3-2-306\",\"questionId\":\"as-eth-3\",\"label\":\"Advocacy threat\",\"isCorrect\":false,\"feedback\":\"No promotion of the client's position is involved.\",\"sortOrder\":2},{\"id\":\"a-as-eth-3-3-307\",\"questionId\":\"as-eth-3\",\"label\":\"Intimidation threat\",\"isCorrect\":false,\"feedback\":\"There is no pressure or threat from the client here.\",\"sortOrder\":3}]},{\"id\":\"as-eth-4\",\"topicId\":\"t-ass-eth\",\"type\":\"scenario\",\"difficulty\":\"hard\",\"scenario\":\"The finance director of an assurance client threatens to remove the firm from all engagements unless it agrees not to raise a contentious adjustment.\",\"stem\":\"Identify the threat and the most appropriate safeguard.\",\"explanation\":\"Pressure and threats from the client create an intimidation threat; appropriate responses include escalating within the firm, consulting those charged with governance, and ultimately being prepared to resign if objectivity cannot be maintained.\",\"relatedConcepts\":[\"Intimidation threat\",\"Safeguards\",\"Withdrawal\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-eth-4-0-308\",\"questionId\":\"as-eth-4\",\"label\":\"Intimidation threat — escalate within the firm and be prepared to resign if objectivity is compromised\",\"isCorrect\":true,\"feedback\":\"Correct — coercion is intimidation; the firm must protect objectivity, resigning if necessary.\",\"sortOrder\":0},{\"id\":\"a-as-eth-4-1-309\",\"questionId\":\"as-eth-4\",\"label\":\"Familiarity threat — rotate the engagement partner only\",\"isCorrect\":false,\"feedback\":\"This is intimidation, not familiarity; rotation alone does not address the coercion.\",\"sortOrder\":1},{\"id\":\"a-as-eth-4-2-310\",\"questionId\":\"as-eth-4\",\"label\":\"Self-interest threat — accept the client's demand to keep the fees\",\"isCorrect\":false,\"feedback\":\"Accepting the demand would breach objectivity and integrity.\",\"sortOrder\":2},{\"id\":\"a-as-eth-4-3-311\",\"questionId\":\"as-eth-4\",\"label\":\"Advocacy threat — promote the client's preferred treatment publicly\",\"isCorrect\":false,\"feedback\":\"Promoting the client's position would worsen, not safeguard, objectivity.\",\"sortOrder\":3}]},{\"id\":\"as-eth-5\",\"topicId\":\"t-ass-eth\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"The same audit/assurance engagement partner has acted for a client for over twelve years and has developed a close personal friendship with the directors.\",\"stem\":\"Which threat does this create, and which safeguard is most appropriate?\",\"explanation\":\"A long association and close relationship create a familiarity threat; rotating the engagement partner (and senior staff) is the standard safeguard.\",\"relatedConcepts\":[\"Familiarity threat\",\"Long association\",\"Rotation\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-eth-5-0-312\",\"questionId\":\"as-eth-5\",\"label\":\"Familiarity threat — rotate the engagement partner\",\"isCorrect\":true,\"feedback\":\"Correct — long association and close ties are a familiarity threat, addressed by rotation.\",\"sortOrder\":0},{\"id\":\"a-as-eth-5-1-313\",\"questionId\":\"as-eth-5\",\"label\":\"Advocacy threat — issue a press release supporting the client\",\"isCorrect\":false,\"feedback\":\"This is familiarity, not advocacy, and the 'safeguard' is inappropriate.\",\"sortOrder\":1},{\"id\":\"a-as-eth-5-2-314\",\"questionId\":\"as-eth-5\",\"label\":\"Intimidation threat — accept lower fees\",\"isCorrect\":false,\"feedback\":\"There is no coercion here; this is familiarity.\",\"sortOrder\":2},{\"id\":\"a-as-eth-5-3-315\",\"questionId\":\"as-eth-5\",\"label\":\"Self-review threat — review the firm's own accounting work\",\"isCorrect\":false,\"feedback\":\"No self-review is described; the issue is the close relationship.\",\"sortOrder\":3}]},{\"id\":\"as-eth-6\",\"topicId\":\"t-ass-eth\",\"type\":\"scenario\",\"difficulty\":\"hard\",\"scenario\":\"An assurance firm is asked to act as an expert witness, promoting and defending its client's position in a court dispute over the client's financial position.\",\"stem\":\"Which threat does acting in this capacity create?\",\"explanation\":\"Promoting or advocating a client's position to the point that objectivity is compromised is an advocacy threat.\",\"relatedConcepts\":[\"Advocacy threat\",\"Litigation support\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"a
