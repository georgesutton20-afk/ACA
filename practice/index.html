egal personality.\",\"sortOrder\":1},{\"id\":\"a-lw-co-1-2-487\",\"questionId\":\"lw-co-1\",\"label\":\"The company is a sham because one person controls it\",\"isCorrect\":false,\"feedback\":\"A company controlled by one person is still validly separate (Salomon).\",\"sortOrder\":2},{\"id\":\"a-lw-co-1-3-488\",\"questionId\":\"lw-co-1\",\"label\":\"The unsecured creditors rank ahead of Mr S's debentures\",\"isCorrect\":false,\"feedback\":\"A secured creditor ranks ahead of unsecured creditors.\",\"sortOrder\":3}]},{\"id\":\"lw-co-2\",\"topicId\":\"t-law-co\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"Under the Companies Act 2006, which document, once registered, principally governs a company's internal rules and the relationship between the company and its members?\",\"explanation\":\"Under CA 2006 the articles of association are the company's constitution governing internal management and the relationship between the company and members. The certificate of incorporation evidences that the company exists.\",\"relatedConcepts\":[\"Articles of association\",\"Company constitution\",\"CA 2006\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-co-2-0-489\",\"questionId\":\"lw-co-2\",\"label\":\"The articles of association\",\"isCorrect\":true,\"feedback\":\"Correct — the articles are the principal constitutional document under CA 2006.\",\"sortOrder\":0},{\"id\":\"a-lw-co-2-1-490\",\"questionId\":\"lw-co-2\",\"label\":\"The certificate of incorporation\",\"isCorrect\":false,\"feedback\":\"The certificate evidences incorporation; it does not set the internal rules.\",\"sortOrder\":1},{\"id\":\"a-lw-co-2-2-491\",\"questionId\":\"lw-co-2\",\"label\":\"The statement of capital\",\"isCorrect\":false,\"feedback\":\"This records share capital details, not the company's internal governance rules.\",\"sortOrder\":2},{\"id\":\"a-lw-co-2-3-492\",\"questionId\":\"lw-co-2\",\"label\":\"The register of members\",\"isCorrect\":false,\"feedback\":\"This lists shareholders; it is not the constitution.\",\"sortOrder\":3}]},{\"id\":\"lw-co-3\",\"topicId\":\"t-law-co\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Under the Companies Act 2006, which of the following is a codified general duty of a director?\",\"explanation\":\"CA 2006 ss.171–177 codify the general duties, including the duty to promote the success of the company for the benefit of members as a whole (s.172), to exercise independent judgement (s.173), reasonable care, skill and diligence (s.174), and to avoid conflicts of interest (s.175).\",\"relatedConcepts\":[\"Directors' duties\",\"CA 2006 ss.171–177\",\"Promote the success of the company\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-co-3-0-493\",\"questionId\":\"lw-co-3\",\"label\":\"The duty to promote the success of the company for the benefit of its members as a whole\",\"isCorrect\":true,\"feedback\":\"Correct — s.172 CA 2006.\",\"sortOrder\":0},{\"id\":\"a-lw-co-3-1-494\",\"questionId\":\"lw-co-3\",\"label\":\"The duty to maximise short-term dividends every year\",\"isCorrect\":false,\"feedback\":\"There is no such duty; s.172 focuses on long-term success for members as a whole.\",\"sortOrder\":1},{\"id\":\"a-lw-co-3-2-495\",\"questionId\":\"lw-co-3\",\"label\":\"The duty to personally guarantee all company debts\",\"isCorrect\":false,\"feedback\":\"Directors do not personally guarantee company debts by virtue of office.\",\"sortOrder\":2},{\"id\":\"a-lw-co-3-3-496\",\"questionId\":\"lw-co-3\",\"label\":\"The duty to hold a minimum number of shares\",\"isCorrect\":false,\"feedback\":\"CA 2006 does not require directors to hold a share qualification.\",\"sortOrder\":3}]},{\"id\":\"lw-co-4\",\"topicId\":\"t-law-co\",\"type\":\"multi\",\"difficulty\":\"hard\",\"stem\":\"Which TWO of the following correctly describe directors' duties under the Companies Act 2006?\",\"explanation\":\"A director must avoid situations of conflict between personal interests and the company's (s.175) and must declare any interest in a proposed transaction (s.177). The s.174 duty of care, skill and diligence applies an objective standard, raised by the director's actual knowledge and experience (a dual subjective/objective test).\",\"relatedConcepts\":[\"Conflict of interest s.175\",\"Declaration of interest s.177\",\"Duty of care s.174\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-co-4-0-497\",\"questionId\":\"lw-co-4\",\"label\":\"A director must avoid a situation in which personal interests conflict with the company's interests (s.175)\",\"isCorrect\":true,\"feedback\":\"Correct — the s.175 duty to avoid conflicts of interest.\",\"sortOrder\":0},{\"id\":\"a-lw-co-4-1-498\",\"questionId\":\"lw-co-4\",\"label\":\"A director must declare the nature and extent of any interest in a proposed transaction (s.177)\",\"isCorrect\":true,\"feedback\":\"Correct — the s.177 duty to declare interests.\",\"sortOrder\":1},{\"id\":\"a-lw-co-4-2-499\",\"questionId\":\"lw-co-4\",\"label\":\"The duty of care is judged on a purely subjective standard regardless of the director's experience\",\"isCorrect\":false,\"feedback\":\"Section 174 applies an objective minimum standard, raised by any greater actual knowledge/experience.\",\"sortOrder\":2},{\"id\":\"a-lw-co-4-3-500\",\"questionId\":\"lw-co-4\",\"label\":\"A director may freely retain a personal profit from his position without disclosure\",\"isCorrect\":false,\"feedback\":\"Retaining a secret profit from the position breaches the no-profit/no-conflict duties.\",\"sortOrder\":3}]},{\"id\":\"lw-co-5\",\"topicId\":\"t-law-co\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"scenario\":\"A private company limited by shares wishes to alter its articles of association.\",\"stem\":\"What is required under the Companies Act 2006 to alter the articles?\",\"explanation\":\"Under s.21 CA 2006, a company may amend its articles by special resolution (at least 75% of votes cast). Certain entrenched provisions may require more.\",\"relatedConcepts\":[\"Special resolution\",\"Alteration of articles s.21\",\"Shares and voting\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-co-5-0-501\",\"questionId\":\"lw-co-5\",\"label\":\"A special resolution (at least 75% of the votes cast)\",\"isCorrect\":true,\"feedback\":\"Correct — s.21 CA 2006 requires a special resolution to alter the articles.\",\"sortOrder\":0},{\"id\":\"a-lw-co-5-1-502\",\"questionId\":\"lw-co-5\",\"label\":\"An ordinary resolution (a simple majority)\",\"isCorrect\":false,\"feedback\":\"An ordinary resolution is insufficient; alteration needs a special resolution.\",\"sortOrder\":1},{\"id\":\"a-lw-co-5-2-503\",\"questionId\":\"lw-co-5\",\"label\":\"A unanimous decision of all members in every case\",\"isCorrect\":false,\"feedback\":\"Unanimity is not generally required; 75% suffices (subject to entrenchment).\",\"sortOrder\":2},{\"id\":\"a-lw-co-5-3-504\",\"questionId\":\"lw-co-5\",\"label\":\"A board resolution of the directors alone\",\"isCorrect\":false,\"feedback\":\"Directors alone cannot alter the articles; members must pass a special resolution.\",\"sortOrder\":3}]},{\"id\":\"lw-co-6\",\"topicId\":\"t-law-co\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"Which feature distinguishes a public limited company (plc) from a private limited company under the Companies Act 2006?\",\"explanation\":\"A plc must have allotted share capital of at least the authorised minimum (£50,000, with at least one quarter paid up) and may offer its shares to the public; a private company may not offer shares to the public.\",\"relatedConcepts\":[\"Public vs private company\",\"Authorised minimum capital\",\"Offer of shares to public\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-co-6-0-505\",\"questionId\":\"lw-co-6\",\"label\":\"A plc may offer its shares to the public and must meet the £50,000 minimum allotted capital\",\"isCorrect\":true,\"feedback\":\"Correct — only a plc may offer shares to the public and must meet the authorised minimum.\",\"sortOrder\":0},{\"id\":\"a-lw-co-6-1-506\",\"questionId\":\"lw-co-6\",\"label\":\"A private company must have at least £50,000 of allotted share capital\",\"isCorrect\":false,\"feedback\":\"The authorised minimum applies to plcs, not private companies.\",\"sortOrder\":1},{\"id\":\"a-lw-co-6-2-507\",\"questionId\":\"lw-co-6\",\"label\":\"A plc cannot have limited liability\",\"isCorrect\":false,\"feedback\":\"A plc is a limited company; its members' liability is limited.\",\"sortOrder\":2},{\"id\":\"a-lw-co-6-3-508\",\"questionId\":\"lw-co-6\",\"label\":\"A private company must always have at least two directors\",\"isCorrect\":false,\"feedback\":\"A private company needs only one director under CA 2006.\",\"sortOrder\":3}]}],\"t-law-agency\":[{\"id\":\"lw-agency-1\",\"topicId\":\"t-law-agency\",\"type\":\"scenario\",\"difficulty\":\"hard\",\"scenario\":\"A director, with no actual authority to do so, enters a contract on the company's behalf with a third party. The company had previously allowed that director to make similar contracts, and the third party reasonably believed he was authorised.\",\"stem\":\"What is the company's most likely position regarding the contract?\",\"explanation\":\"Where a principal represents (including by past conduct) that an agent has authority, the principal may be bound by apparent (ostensible) authority even without actual authority, provided the third party relied on that representation (Freeman \u0026 Lockyer v Buckhurst Park Properties).\",\"relatedConcepts\":[\"Apparent (ostensible) authority\",\"Freeman \u0026 Lockyer\",\"Agency\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-agency-1-0-509\",\"questionId\":\"lw-agency-1\",\"label\":\"The company is bound, because the director had apparent (ostensible) authority\",\"isCorrect\":true,\"feedback\":\"Correct — past conduct created a representation of authority on which the third party relied.\",\"sortOrder\":0},{\"id\":\"a-lw-agency-1-1-510\",\"questionId\":\"lw-agency-1\",\"label\":\"The company is not bound under any circumstances without actual authority\",\"isCorrect\":false,\"feedback\":\"Apparent authority can bind a principal even absent actual authority.\",\"sortOrder\":1},{\"id\":\"a-lw-agency-1-2-511\",\"questionId\":\"lw-agency-1\",\"label\":\"The contract is automatically void\",\"isCorrect\":false,\"feedback\":\"It is not void; the company may be bound via apparent authority (or by ratification).\",\"sortOrder\":2},{\"id\":\"a-lw-agency-1-3-512\",\"questionId\":\"lw-agency-1\",\"label\":\"The third party can only sue the director, never the company\",\"isCorrect\":false,\"feedback\":\"The company may be bound where apparent authority is established.\",\"sortOrder\":3}]},{\"id\":\"lw-agency-2\",\"topicId\":\"t-law-agency\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"An agent acts beyond their authority, but the principal, with full knowledge, later approves the transaction. What is this called and what is its effect?\",\"explanation\":\"Ratification is the principal's subsequent adoption of an unauthorised act. Once ratified (with full knowledge and the principal having existed and been competent at the time of the act), the contract is treated as authorised from the outset.\",\"relatedConcepts\":[\"Ratification\",\"Authority of agents\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-agency-2-0-513\",\"questionId\":\"lw-agency-2\",\"label\":\"Ratification — the act is treated as authorised from the outset\",\"isCorrect\":true,\"feedback\":\"Correct — valid ratification has retrospective effect.\",\"sortOrder\":0},{\"id\":\"a-lw-agency-2-1-514\",\"questionId\":\"lw-agency-2\",\"label\":\"Estoppel — the principal is barred from denying the contract going forward only\",\"isCorrect\":false,\"feedback\":\"This is ratification, which operates retrospectively, not merely prospective estoppel.\",\"sortOrder\":1},{\"id\":\"a-lw-agency-2-2-515\",\"questionId\":\"lw-agency-2\",\"label\":\"Novation — a wholly new contract replaces the old\",\"isCorrect\":false,\"feedback\":\"No new contract is substituted; the original act is adopted by ratification.\",\"sortOrder\":2},{\"id\":\"a-lw-agency-2-3-516\",\"questionId\":\"lw-agency-2\",\"label\":\"Rescission — the contract is unwound\",\"isCorrect\":false,\"feedback\":\"The principal is approving, not unwinding, the transaction.\",\"sortOrder\":3}]},{\"id\":\"lw-agency-3\",\"topicId\":\"t-law-agency\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Which factor most strongly indicates that a worker is an employee (under a contract of service) rather than an independent contractor (contract for services)?\",\"explanation\":\"Key tests include control over how the work is done, personal service (no unfettered right to substitute), and mutuality of obligation. A genuine, unlimited right to send a substitute points towards self-employment (Ready Mixed Concrete v MPNI).\",\"relatedConcepts\":[\"Employment status\",\"Control test\",\"Mutuality of obligation\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-agency-3-0-517\",\"questionId\":\"lw-agency-3\",\"label\":\"The employer controls how, when and where the work is done, and the worker must perform it personally\",\"isCorrect\":true,\"feedback\":\"Correct — control plus personal service point towards employee status.\",\"sortOrder\":0},{\"id\":\"a-lw-agency-3-1-518\",\"questionId\":\"lw-agency-3\",\"label\":\"The worker may freely send any substitute to do the work\",\"isCorrect\":false,\"feedback\":\"An unfettered right of substitution indicates self-employment, not employee status.\",\"sortOrder\":1},{\"id\":\"a-lw-agency-3-2-519\",\"questionId\":\"lw-agency-3\",\"label\":\"The worker provides all their own major equipment and bears financial risk\",\"isCorrect\":false,\"feedback\":\"Providing own equipment and bearing risk points to independent contractor status.\",\"sortOrder\":2},{\"id\":\"a-lw-agency-3-3-520\",\"questionId\":\"lw-agency-3\",\"label\":\"The worker invoices the business and is registered for VAT\",\"isCorrect\":false,\"feedback\":\"Invoicing/VAT registration suggests self-employment, not employee status.\",\"sortOrder\":3}]},{\"id\":\"lw-agency-4\",\"topicId\":\"t-law-agency\",\"type\":\"multi\",\"difficulty\":\"hard\",\"stem\":\"Which TWO of the following are duties owed by an agent to the principal?\",\"explanation\":\"An agent owes fiduciary duties: to act in the principal's best interests, to avoid conflicts of interest, not to make a secret profit or take a bribe, and to account. The agent must also obey lawful instructions and exercise reasonable care and skill.\",\"relatedConcepts\":[\"Agent's duties\",\"Fiduciary duty\",\"Secret profit\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-agency-4-0-521\",\"questionId\":\"lw-agency-4\",\"label\":\"A duty not to make a secret profit or take a bribe\",\"isCorrect\":true,\"feedback\":\"Correct — an agent must not secretly profit from the position.\",\"sortOrder\":0},{\"id\":\"a-lw-agency-4-1-522\",\"questionId\":\"lw-agency-4\",\"label\":\"A duty to obey the principal's lawful and reasonable instructions\",\"isCorrect\":true,\"feedback\":\"Correct — the agent must follow lawful instructions and act with reasonable care and skill.\",\"sortOrder\":1},{\"id\":\"a-lw-agency-4-2-523\",\"questionId\":\"lw-agency-4\",\"label\":\"A duty to indemnify the principal against all market losses\",\"isCorrect\":false,\"feedback\":\"An agent does not guarantee the principal against ordinary commercial losses.\",\"sortOrder\":2},{\"id\":\"a-lw-agency-4-3-524\",\"questionId\":\"lw-agency-4\",\"label\":\"A duty to delegate the task to a sub-agent wherever possible\",\"isCorrect\":false,\"feedback\":\"An agent generally must perform personally and not delegate without authority.\",\"sortOrder\":3}]},{\"id\":\"lw-agency-5\",\"topicId\":\"t-law-agency\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"An agent acting within their actual authority makes a contract with a third party, disclosing that they act for a named principal.\",\"stem\":\"Who is generally party to, and liable on, the resulting contract?\",\"explanation\":\"Where an agent acts within authority for a disclosed and named principal, the contract is between the principal and the third party; the agent generally drops out and is neither liable nor entitled on it.\",\"relatedConcepts\":[\"Disclosed principal\",\"Agent's liability\",\"Privity\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-agency-5-0-525\",\"questionId\":\"lw-agency-5\",\"label\":\"The principal and the third party; the agent generally drops out\",\"isCorrect\":true,\"feedback\":\"Correct — for a disclosed, named principal the agent is generally not a party.\",\"sortOrder\":0},{\"id\":\"a-lw-agency-5-1-526\",\"questionId\":\"lw-agency-5\",\"label\":\"The agent and the third party only\",\"isCorrect\":false,\"feedback\":\"With a disclosed named principal, the contract is with the principal, not the agent.\",\"sortOrder\":1},{\"id\":\"a-lw-agency-5-2-527\",\"questionId\":\"lw-agency-5\",\"label\":\"The agent alone, with no liability for the principal\",\"isCorrect\":false,\"feedback\":\"The principal, not the agent, is the contracting party here.\",\"sortOrder\":2},{\"id\":\"a-lw-agency-5-3-528\",\"questionId\":\"lw-agency-5\",\"label\":\"No one, because an agent cannot create binding contracts\",\"isCorrect\":false,\"feedback\":\"An authorised agent can bind the principal to a valid contract.\",\"sortOrder\":3}]},{\"id\":\"lw-agency-6\",\"topicId\":\"t-law-agency\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"Actual authority that is not expressly stated, but is necessarily implied from the agent's position or the conduct of the parties, is known as:\",\"explanation\":\"Actual authority may be express (expressly conferred) or implied (arising by implication from the agent's position, the parties' conduct, or business custom). This is distinct from apparent authority, which arises from the principal's representation to a third party.\",\"relatedConcepts\":[\"Implied actual authority\",\"Express vs implied authority\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-agency-6-0-529\",\"questionId\":\"lw-agency-6\",\"label\":\"Implied actual authority\",\"isCorrect\":true,\"feedback\":\"Correct — authority implied from the agent's position or the parties' conduct.\",\"sortOrder\":0},{\"id\":\"a-lw-agency-6-1-530\",\"questionId\":\"lw-agency-6\",\"label\":\"Apparent authority\",\"isCorrect\":false,\"feedback\":\"Apparent authority arises from the principal's representation to the third party, not by implication of actual authority.\",\"sortOrder\":1},{\"id\":\"a-lw-agency-6-2-531\",\"questionId\":\"lw-agency-6\",\"label\":\"Express authority\",\"isCorrect\":false,\"feedback\":\"Express authority is specifically stated, not implied.\",\"sortOrder\":2},{\"id\":\"a-lw-agency-6-3-532\",\"questionId\":\"lw-agency-6\",\"label\":\"Usual authority of an undisclosed principal\",\"isCorrect\":false,\"feedback\":\"That is a distinct doctrine; the question concerns implied actual authority.\",\"sortOrder\":3}]}],\"t-law-tort\":[{\"id\":\"lw-tort-1\",\"topicId\":\"t-law-tort\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"A consumer drank ginger beer from an opaque bottle bought by a friend, then discovered a decomposed snail inside and became ill. There was no contract between the consumer and the manufacturer.\",\"stem\":\"On these facts (mirroring Donoghue v Stevenson), can the consumer sue the manufacturer?\",\"explanation\":\"Donoghue v Stevenson established the modern law of negligence and the 'neighbour principle': a manufacturer owes a duty of care to the ultimate consumer despite the absence of any contract.\",\"relatedConcepts\":[\"Duty of care\",\"Donoghue v Stevenson\",\"Neighbour principle\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-tort-1-0-533\",\"questionId\":\"lw-tort-1\",\"label\":\"Yes — the manufacturer owed the consumer a duty of care in negligence despite no contract\",\"isCorrect\":true,\"feedback\":\"Correct — the neighbour principle in Donoghue v Stevenson.\",\"sortOrder\":0},{\"id\":\"a-lw-tort-1-1-534\",\"questionId\":\"lw-tort-1\",\"label\":\"No — without a contract there can be no liability at all\",\"isCorrect\":false,\"feedback\":\"Negligence does not require a contract; a duty of care can arise independently.\",\"sortOrder\":1},{\"id\":\"a-lw-tort-1-2-535\",\"questionId\":\"lw-tort-1\",\"label\":\"No — only the friend who bought the drink could sue\",\"isCorrect\":false,\"feedback\":\"The consumer can sue in negligence even though the friend bought the drink.\",\"sortOrder\":2},{\"id\":\"a-lw-tort-1-3-536\",\"questionId\":\"lw-tort-1\",\"label\":\"Yes — but only for breach of contract\",\"isCorrect\":false,\"feedback\":\"There is no contract; the claim lies in the tort of negligence.\",\"sortOrder\":3}]},{\"id\":\"lw-tort-2\",\"topicId\":\"t-law-tort\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Which of the following lists the essential elements a claimant must establish in the tort of negligence?\",\"explanation\":\"To succeed in negligence the claimant must prove: (1) the defendant owed a duty of care; (2) the defendant breached that duty (fell below the standard of the reasonable person); and (3) the breach caused (factually and legally) reasonably foreseeable loss that is not too remote.\",\"relatedConcepts\":[\"Duty\",\"Breach\",\"Causation\",\"Remoteness\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-tort-2-0-537\",\"questionId\":\"lw-tort-2\",\"label\":\"A duty of care, breach of that duty, and resulting (foreseeable, non-remote) damage caused by the breach\",\"isCorrect\":true,\"feedback\":\"Correct — duty, breach and causation of non-remote loss.\",\"sortOrder\":0},{\"id\":\"a-lw-tort-2-1-538\",\"questionId\":\"lw-tort-2\",\"label\":\"A contract, consideration and an intention to create legal relations\",\"isCorrect\":false,\"feedback\":\"Those are contract elements; negligence is a tort.\",\"sortOrder\":1},{\"id\":\"a-lw-tort-2-2-539\",\"questionId\":\"lw-tort-2\",\"label\":\"Only that the claimant suffered some loss\",\"isCorrect\":false,\"feedback\":\"Loss alone is insufficient; duty, breach and causation must also be shown.\",\"sortOrder\":2},{\"id\":\"a-lw-tort-2-3-540\",\"questionId\":\"lw-tort-2\",\"label\":\"Bad faith and a deliberate intention to harm\",\"isCorrect\":false,\"feedback\":\"Negligence does not require intention to harm; it concerns failure to take reasonable care.\",\"sortOrder\":3}]},{\"id\":\"lw-tort-3\",\"topicId\":\"t-law-tort\",\"type\":\"mcq\",\"difficulty\":\"hard\",\"stem\":\"Which test is generally used to establish factual causation in negligence?\",\"explanation\":\"Factual causation is generally established by the 'but for' test (Barnett v Chelsea \u0026 Kensington Hospital): but for the defendant's breach, would the claimant have suffered the loss? If the loss would have occurred anyway, causation fails.\",\"relatedConcepts\":[\"Factual causation\",\"'But for' test\",\"Barnett v Chelsea \u0026 Kensington\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-tort-3-0-541\",\"questionId\":\"lw-tort-3\",\"label\":\"The 'but for' test — would the loss have occurred but for the breach?\",\"isCorrect\":true,\"feedback\":\"Correct — the standard test for factual causation (Barnett).\",\"sortOrder\":0},{\"id\":\"a-lw-tort-3-1-542\",\"questionId\":\"lw-tort-3\",\"label\":\"The reasonable person test\",\"isCorrect\":false,\"feedback\":\"That concerns the standard of care (breach), not factual causation.\",\"sortOrder\":1},{\"id\":\"a-lw-tort-3-2-543\",\"questionId\":\"lw-tort-3\",\"label\":\"The neighbour principle\",\"isCorrect\":false,\"feedback\":\"The neighbour principle concerns duty of care, not causation.\",\"sortOrder\":2},{\"id\":\"a-lw-tort-3-3-544\",\"questionId\":\"lw-tort-3\",\"label\":\"The contra proferentem rule\",\"isCorrect\":false,\"feedback\":\"That is a rule of contractual interpretation, not causation in tort.\",\"sortOrder\":3}]},{\"id\":\"lw-tort-4\",\"topicId\":\"t-law-tort\",\"type\":\"scenario\",\"difficulty\":\"hard\",\"scenario\":\"Accountants negligently prepared a company's audited accounts. A third party, who the accountants did not know would see the accounts, relied on them when deciding to invest and suffered loss.\",\"stem\":\"Applying the principles in Caparo v Dickman, is the accountants' duty of care to that third party most likely established?\",\"explanation\":\"Caparo v Dickman set out that for a duty of care for negligent misstatement causing pure economic loss there must be foreseeability, proximity and that it is fair, just and reasonable. Auditors generally owe no duty to the world at large; proximity (a special relationship / known reliance for a known purpose) is needed.\",\"relatedConcepts\":[\"Pure economic loss\",\"Negligent misstatement\",\"Caparo v Dickman\",\"Proximity\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-tort-4-0-545\",\"questionId\":\"lw-tort-4\",\"label\":\"No — there is insufficient proximity, as the accountants did not know the third party would rely on the accounts for that purpose\",\"isCorrect\":true,\"feedback\":\"Correct — Caparo requires proximity/known reliance for a known purpose; absent it, no duty arises.\",\"sortOrder\":0},{\"id\":\"a-lw-tort-4-1-546\",\"questionId\":\"lw-tort-4\",\"label\":\"Yes — accountants owe a duty to anyone in the world who relies on their accounts\",\"isCorrect\":false,\"feedback\":\"Caparo rejects an unlimited duty to the world; proximity is required.\",\"sortOrder\":1},{\"id\":\"a-lw-tort-4-2-547\",\"questionId\":\"lw-tort-4\",\"label\":\"Yes — pure economic loss is always recoverable in negligence\",\"isCorrect\":false,\"feedback\":\"Pure economic loss from a misstatement requires the Caparo/Hedley Byrne special relationship.\",\"sortOrder\":2},{\"id\":\"a-lw-tort-4-3-548\",\"questionId\":\"lw-tort-4\",\"label\":\"No — accountants can never be liable in negligence\",\"isCorrect\":false,\"feedback\":\"They can be liable where the Caparo elements (including proximity) are satisfied.\",\"sortOrder\":3}]},{\"id\":\"lw-tort-5\",\"topicId\":\"t-law-tort\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"A claimant's own carelessness contributed to the injury they suffered through the defendant's negligence. What is the likely effect under the Law Reform (Contributory Negligence) Act 1945?\",\"explanation\":\"Where the claimant's own fault contributes to the damage, contributory negligence reduces the damages by the extent the court thinks just and equitable, reflecting the claimant's share of responsibility. It is a partial, not complete, defence.\",\"relatedConcepts\":[\"Contributory negligence\",\"Apportionment of damages\",\"Defences in negligence\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-tort-5-0-549\",\"questionId\":\"lw-tort-5\",\"label\":\"The claimant's damages are reduced to the extent that is just and equitable\",\"isCorrect\":true,\"feedback\":\"Correct — contributory negligence is a partial defence reducing damages.\",\"sortOrder\":0},{\"id\":\"a-lw-tort-5-1-550\",\"questionId\":\"lw-tort-5\",\"label\":\"The claim is automatically defeated in full\",\"isCorrect\":false,\"feedback\":\"Contributory negligence reduces, but does not necessarily extinguish, damages.\",\"sortOrder\":1},{\"id\":\"a-lw-tort-5-2-551\",\"questionId\":\"lw-tort-5\",\"label\":\"The defendant's liability is unaffected\",\"isCorrect\":false,\"feedback\":\"Damages are reduced to reflect the claimant's share of responsibility.\",\"sortOrder\":2},{\"id\":\"a-lw-tort-5-3-552\",\"questionId\":\"lw-tort-5\",\"label\":\"The claimant must instead sue in contract\",\"isCorrect\":false,\"feedback\":\"Contributory negligence operates within the negligence claim; it does not redirect it to contract.\",\"sortOrder\":3}]},{\"id\":\"lw-tort-6\",\"topicId\":\"t-law-tort\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"What standard of care does the law generally expect of a person carrying out a skilled professional activity?\",\"explanation\":\"A professional is judged by the standard of the ordinary competent member of that profession (the Bolam test): the standard of a reasonably competent professional exercising and professing to have that special skill, not the highest expert in the field.\",\"relatedConcepts\":[\"Standard of care\",\"Bolam test\",\"Professional negligence\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-tort-6-0-553\",\"questionId\":\"lw-tort-6\",\"label\":\"The standard of a reasonably competent member of that profession\",\"isCorrect\":true,\"feedback\":\"Correct — the Bolam standard for professionals.\",\"sortOrder\":0},{\"id\":\"a-lw-tort-6-1-554\",\"questionId\":\"lw-tort-6\",\"label\":\"The standard of the most eminent expert in the field\",\"isCorrect\":false,\"feedback\":\"The law expects reasonable competence, not the highest possible expertise.\",\"sortOrder\":1},{\"id\":\"a-lw-tort-6-2-555\",\"questionId\":\"lw-tort-6\",\"label\":\"The standard of an ordinary layperson\",\"isCorrect\":false,\"feedback\":\"A professional is held to a professional, not a layperson, standard.\",\"sortOrder\":2},{\"id\":\"a-lw-tort-6-3-556\",\"questionId\":\"lw-tort-6\",\"label\":\"No particular standard, provided they act in good faith\",\"isCorrect\":false,\"feedback\":\"Good faith is not enough; the professional must meet the competence standard.\",\"sortOrder\":3}]}],\"t-law-ins\":[{\"id\":\"lw-ins-1\",\"topicId\":\"t-law-ins\",\"type\":\"scenario\",\"difficulty\":\"hard\",\"scenario\":\"A director realised the company had no reasonable prospect of avoiding insolvent liquidation but continued trading, increasing the deficit to creditors. The company later went into insolvent liquidation.\",\"stem\":\"Under the Insolvency Act 1986, what is the director most likely liable for?\",\"explanation\":\"Wrongful trading (s.214 IA 1986) arises where a director continued trading after the point at which they knew or ought to have concluded there was no reasonable prospect of avoiding insolvent liquidation and failed to take every step to minimise loss to creditors. The court may order a contribution to the company's assets.\",\"relatedConcepts\":[\"Wrongful trading s.214\",\"Insolvency Act 1986\",\"Contribution to assets\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-ins-1-0-557\",\"questionId\":\"lw-ins-1\",\"label\":\"Wrongful trading — the court may order a contribution to the company's assets\",\"isCorrect\":true,\"feedback\":\"Correct — s.214 IA 1986 applies where there was no reasonable prospect of avoiding insolvent liquidation.\",\"sortOrder\":0},{\"id\":\"a-lw-ins-1-1-558\",\"questionId\":\"lw-ins-1\",\"label\":\"Fraudulent trading, which requires no dishonesty\",\"isCorrect\":false,\"feedback\":\"Fraudulent trading (s.213) requires actual dishonesty/intent to defraud; these facts point to wrongful trading.\",\"sortOrder\":1},{\"id\":\"a-lw-ins-1-2-559\",\"questionId\":\"lw-ins-1\",\"label\":\"Nothing, because directors are never liable for company debts\",\"isCorrect\":false,\"feedback\":\"Wrongful trading is a key exception to limited liability.\",\"sortOrder\":2},{\"id\":\"a-lw-ins-1-3-560\",\"questionId\":\"lw-ins-1\",\"label\":\"Breach of contract with creditors\",\"isCorrect\":false,\"feedback\":\"The liability arises under statute (s.214), not in contract with creditors.\",\"sortOrder\":3}]},{\"id\":\"lw-ins-2\",\"topicId\":\"t-law-ins\",\"type\":\"mcq\",\"difficulty\":\"hard\",\"stem\":\"How does fraudulent trading under s.213 Insolvency Act 1986 differ from wrongful trading under s.214?\",\"explanation\":\"Fraudulent trading (s.213) requires that the business was carried on with intent to defraud creditors or for a fraudulent purpose — actual dishonesty must be shown. Wrongful trading (s.214) requires no dishonesty; it is judged objectively on whether the director should have realised insolvent liquidation was unavoidable.\",\"relatedConcepts\":[\"Fraudulent trading s.213\",\"Wrongful trading s.214\",\"Dishonesty\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-ins-2-0-561\",\"questionId\":\"lw-ins-2\",\"label\":\"Fraudulent trading requires actual intent to defraud (dishonesty); wrongful trading does not\",\"isCorrect\":true,\"feedback\":\"Correct — dishonesty is the key distinguishing feature of s.213.\",\"sortOrder\":0},{\"id\":\"a-lw-ins-2-1-562\",\"questionId\":\"lw-ins-2\",\"label\":\"Wrongful trading requires dishonesty, but fraudulent trading does not\",\"isCorrect\":false,\"feedback\":\"It is the reverse: fraudulent trading needs dishonesty; wrongful trading is judged objectively.\",\"sortOrder\":1},{\"id\":\"a-lw-ins-2-2-563\",\"questionId\":\"lw-ins-2\",\"label\":\"Both require proof of dishonest intent to defraud\",\"isCorrect\":false,\"feedback\":\"Wrongful trading (s.214) does not require dishonesty.\",\"sortOrder\":2},{\"id\":\"a-lw-ins-2-3-564\",\"questionId\":\"lw-ins-2\",\"label\":\"Neither can result in personal liability for directors\",\"isCorrect\":false,\"feedback\":\"Both can lead to a court order that a director contribute to the company's assets.\",\"sortOrder\":3}]},{\"id\":\"lw-ins-3\",\"topicId\":\"t-law-ins\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"In a compulsory winding up by the court, on what ground is a company most commonly wound up?\",\"explanation\":\"The most common ground for compulsory winding up (s.122 IA 1986) is that the company is unable to pay its debts, typically evidenced by failure to satisfy a statutory demand or an unsatisfied judgment. The court may also wind up on the 'just and equitable' ground.\",\"relatedConcepts\":[\"Compulsory liquidation\",\"Inability to pay debts\",\"Statutory demand\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-ins-3-0-565\",\"questionId\":\"lw-ins-3\",\"label\":\"That the company is unable to pay its debts\",\"isCorrect\":true,\"feedback\":\"Correct — the most common ground under s.122 IA 1986.\",\"sortOrder\":0},{\"id\":\"a-lw-ins-3-1-566\",\"questionId\":\"lw-ins-3\",\"label\":\"That the directors disagree on strategy\",\"isCorrect\":false,\"feedback\":\"Mere disagreement is not a ground for compulsory winding up.\",\"sortOrder\":1},{\"id\":\"a-lw-ins-3-2-567\",\"questionId\":\"lw-ins-3\",\"label\":\"That the company has made a small loss in one year\",\"isCorrect\":false,\"feedback\":\"A single loss does not establish inability to pay debts.\",\"sortOrder\":2},{\"id\":\"a-lw-ins-3-3-568\",\"questionId\":\"lw-ins-3\",\"label\":\"That a shareholder simply wishes to sell their shares\",\"isCorrect\":false,\"feedback\":\"A wish to sell shares is not a ground for the court to wind up the company.\",\"sortOrder\":3}]},{\"id\":\"lw-ins-4\",\"topicId\":\"t-law-ins\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"On a liquidation, in what general order are the company's funds distributed?\",\"explanation\":\"The statutory order is broadly: fixed-charge creditors (from their security), then liquidation expenses, preferential creditors, the prescribed part for unsecured creditors, floating-charge creditors, then unsecured creditors, and finally members. Secured (fixed charge) holders rank ahead of unsecured creditors.\",\"relatedConcepts\":[\"Order of priority\",\"Secured vs unsecured creditors\",\"Preferential creditors\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-ins-4-0-569\",\"questionId\":\"lw-ins-4\",\"label\":\"Fixed-charge holders and expenses first, then preferential and floating-charge creditors, then unsecured creditors, with members last\",\"isCorrect\":true,\"feedback\":\"Correct — broadly the statutory order of priority on liquidation.\",\"sortOrder\":0},{\"id\":\"a-lw-ins-4-1-570\",\"questionId\":\"lw-ins-4\",\"label\":\"Members (shareholders) are paid before any creditors\",\"isCorrect\":false,\"feedback\":\"Members rank last, after creditors have been paid.\",\"sortOrder\":1},{\"id\":\"a-lw-ins-4-2-571\",\"questionId\":\"lw-ins-4\",\"label\":\"Unsecured creditors rank ahead of secured creditors\",\"isCorrect\":false,\"feedback\":\"Secured creditors generally rank ahead of unsecured creditors.\",\"sortOrder\":2},{\"id\":\"a-lw-ins-4-3-572\",\"questionId\":\"lw-ins-4\",\"label\":\"All creditors are always paid in full regardless of the order\",\"isCorrect\":false,\"feedback\":\"In an insolvent liquidation there are insufficient funds; priority order determines who is paid.\",\"sortOrder\":3}]},{\"id\":\"lw-ins-5\",\"topicId\":\"t-law-ins\",\"type\":\"multi\",\"difficulty\":\"hard\",\"stem\":\"Which TWO of the following are potential consequences for a director arising from a company's insolvency?\",\"explanation\":\"A director may be ordered to contribute to the company's assets for wrongful or fraudulent trading (IA 1986). A director may also be disqualified under the Company Directors Disqualification Act 1986 (e.g. for unfit conduct), for between 2 and 15 years.\",\"relatedConcepts\":[\"Director contribution\",\"Disqualification\",\"CDDA 1986\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-ins-5-0-573\",\"questionId\":\"lw-ins-5\",\"label\":\"A court order to contribute to the company's assets for wrongful trading\",\"isCorrect\":true,\"feedback\":\"Correct — under s.214 IA 1986 the court may order a contribution.\",\"sortOrder\":0},{\"id\":\"a-lw-ins-5-1-574\",\"questionId\":\"lw-ins-5\",\"label\":\"Disqualification from acting as a director under the CDDA 1986\",\"isCorrect\":true,\"feedback\":\"Correct — unfit conduct can lead to disqualification of 2–15 years.\",\"sortOrder\":1},{\"id\":\"a-lw-ins-5-2-575\",\"questionId\":\"lw-ins-5\",\"label\":\"Automatic criminal liability for every debt the company owes\",\"isCorrect\":false,\"feedback\":\"Directors are not automatically criminally liable for company debts.\",\"sortOrder\":2},{\"id\":\"a-lw-ins-5-3-576\",\"questionId\":\"lw-ins-5\",\"label\":\"Personal liability for all company debts simply because the company is insolvent\",\"isCorrect\":false,\"feedback\":\"Insolvency alone does not strip limited liability; specific statutory grounds must be met.\",\"sortOrder\":3}]},{\"id\":\"lw-ins-6\",\"topicId\":\"t-law-ins\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"Shortly before going into insolvent liquidation, a company repaid a loan in full to one ordinary unsecured creditor (who happened to be a friend of a director), leaving other unsecured creditors with little. The repayment put that creditor in a better position than they would have been in the liquidation.\",\"stem\":\"Under the Insolvency Act 1986, how might a liquidator challenge this repayment?\",\"explanation\":\"A liquidator may apply to set aside a preference (s.239 IA 1986): a transaction that puts a creditor in a better position on insolvent liquidation than they would otherwise have been, where the company was influenced by a desire to prefer (presumed for connected persons). The relevant time is up to 6 months before insolvency (2 years for connected persons).\",\"relatedConcepts\":[\"Preferences s.239\",\"Antecedent transactions\",\"Connected persons\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-ins-6-0-577\",\"questionId\":\"lw-ins-6\",\"label\":\"As a voidable preference under s.239 IA 1986\",\"isCorrect\":true,\"feedback\":\"Correct — the repayment may be set aside as a preference where the company desired to prefer that creditor.\",\"sortOrder\":0},{\"id\":\"a-lw-ins-6-1-578\",\"questionId\":\"lw-ins-6\",\"label\":\"It cannot be challenged once the money has been paid\",\"isCorrect\":false,\"feedback\":\"A liquidator can apply to set aside preferences made within the statutory period.\",\"sortOrder\":1},{\"id\":\"a-lw-ins-6-2-579\",\"questionId\":\"lw-ins-6\",\"label\":\"As wrongful trading by the creditor\",\"isCorrect\":false,\"feedback\":\"Wrongful trading applies to directors, not to a creditor receiving payment.\",\"sortOrder\":2},{\"id\":\"a-lw-ins-6-3-580\",\"questionId\":\"lw-ins-6\",\"label\":\"Only the creditor, not the liquidator, can take action\",\"isCorrect\":false,\"feedback\":\"It is the liquidator who applies to the court to set aside the preference.\",\"sortOrder\":3}]}],\"t-mi-cost\":[{\"id\":\"x-mi-cost-1\",\"topicId\":\"t-mi-cost\",\"difficulty\":\"medium\",\"stem\":\"Budgeted production overhead is £240,000 and budgeted labour hours are 30,000. Overheads are absorbed on a labour-hour basis. What is the overhead absorption rate (£ per labour hour)?\",\"explanation\":\"OAR = budgeted overhead ÷ budgeted activity level.\",\"workedSolution\":\"OAR = 240,000 ÷ 30,000 = £8 per labour hour\",\"relatedConcepts\":[\"Overhead absorption\",\"OAR\"],\"numericAnswer\":8,\"numericTolerance\":0,\"unit\":\"£/hour\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"x-mi-cost-2\",\"topicId\":\"t-mi-cost\",\"difficulty\":\"hard\",\"stem\":\"Using an OAR of £8/labour hour, actual overheads were £250,000 and actual labour hours were 32,000. What is the over- or under-absorption (£)? Enter the absolute amount.\",\"explanation\":\"Absorbed = actual hours × OAR = 32,000 × 8 = £256,000. Absorbed (256,000) \u003e incurred (250,000), so overheads are over-absorbed by £6,000.\",\"workedSolution\":\"Absorbed = 32,000 × 8 = 256,000\\nOver-absorption = 256,000 − 250,000 = £6,000\",\"relatedConcepts\":[\"Over/under absorption\"],\"numericAnswer\":6000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"x-mi-cost-3\",\"topicId\":\"t-mi-cost\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"When inventory levels increase during a period, how does profit under absorption costing compare with profit under marginal costing?\",\"explanation\":\"Absorption costing carries fixed overhead into closing inventory, so when inventory rises, absorption profit is higher than marginal profit.\",\"relatedConcepts\":[\"Absorption vs marginal costing\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-x-mi-cost-3-0-56\",\"questionId\":\"x-mi-cost-3\",\"label\":\"Absorption profit is higher\",\"isCorrect\":true,\"feedback\":\"Correct — fixed overhead is deferred in rising inventory.\",\"sortOrder\":0},{\"id\":\"a-x-mi-cost-3-1-57\",\"questionId\":\"x-mi-cost-3\",\"label\":\"Marginal profit is higher\",\"isCorrect\":false,\"feedback\":\"This is true when inventory falls, not rises.\",\"sortOrder\":1},{\"id\":\"a-x-mi-cost-3-2-58\",\"questionId\":\"x-mi-cost-3\",\"label\":\"They are always equal\",\"isCorrect\":false,\"feedback\":\"They differ whenever inventory levels change.\",\"sortOrder\":2},{\"id\":\"a-x-mi-cost-3-3-59\",\"questionId\":\"x-mi-cost-3\",\"label\":\"It cannot be determined\",\"isCorrect\":false,\"feedback\":\"The direction is predictable from the inventory movement.\",\"sortOrder\":3}]},{\"id\":\"mi-cost-w1\",\"topicId\":\"t-mi-cost\",\"difficulty\":\"easy\",\"scenario\":\"Budgeted production overhead is £240,000 and budgeted activity is 30,000 labour hours.\",\"stem\":\"Calculate the overhead absorption rate (OAR) per labour hour, in £.\",\"explanation\":\"OAR = budgeted overhead ÷ budgeted activity level.\",\"workedSolution\":\"OAR = 240,000 ÷ 30,000 = £8.00 per labour hour.\",\"relatedConcepts\":[\"Overhead absorption rate\",\"Absorption costing\"],\"numericAnswer\":8,\"numericTolerance\":0.01,\"unit\":\"£/hour\",\"type\":\"calc\",\"rating\":1050,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-cost-w2\",\"topicId\":\"t-mi-cost\",\"difficulty\":\"medium\",\"scenario\":\"A company absorbs overhead at £8 per labour hour. Actual overhead incurred was £252,000 and actual labour hours worked were 30,500.\",\"stem\":\"Calculate the over- or under-absorbed overhead, in £ (give the absolute amount).\",\"explanation\":\"Absorbed overhead = OAR × actual hours. Compare with actual overhead incurred. Absorbed \u003c actual ⇒ under-absorbed.\",\"workedSolution\":\"Absorbed = 8 × 30,500 = 244,000\\nActual incurred = 252,000\\nUnder-absorbed = 252,000 − 244,000 = £8,000.\",\"relatedConcepts\":[\"Over/under-absorption\",\"Absorption costing\"],\"numericAnswer\":8000,\"numericTolerance\":1,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-cost-w3\",\"topicId\":\"t-mi-cost\",\"difficulty\":\"medium\",\"scenario\":\"A product has direct materials £14, direct labour £10 and variable production overhead £6 per unit. Budgeted fixed production overhead is £100,000 for budgeted output of 20,000 units.\",\"stem\":\"Calculate the full absorption cost per unit, in £.\",\"explanation\":\"Absorption cost = prime cost + variable production overhead + fixed overhead per unit. Fixed per unit = total fixed ÷ budgeted output.\",\"workedSolution\":\"Fixed per unit = 100,000 ÷ 20,000 = 5\\nAbsorption cost = 14 + 10 + 6 + 5 = £35.00.\",\"relatedConcepts\":[\"Absorption costing\",\"Unit cost\"],\"numericAnswer\":35,\"numericTolerance\":0.01,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-cost-w4\",\"topicId\":\"t-mi-cost\",\"difficulty\":\"hard\",\"scenario\":\"A factory has two production departments. Overhead is absorbed on machine hours in Machining (£180,000 budgeted overhead, 12,000 machine hours) and on labour hours in Assembly (£90,000 budgeted overhead, 15,000 labour hours). Job 42 uses 4 machine hours and 6 labour hours.\",\"stem\":\"Calculate the total production overhead absorbed by Job 42, in £.\",\"explanation\":\"Compute a separate OAR for each department, then apply each rate to the job's usage.\",\"workedSolution\":\"Machining OAR = 180,000 ÷ 12,000 = £15/machine hour\\nAssembly OAR = 90,000 ÷ 15,000 = £6/labour hour\\nJob 42 = (4 × 15) + (6 × 6) = 60 + 36 = £96.00.\",\"relatedConcepts\":[\"Departmental OAR\",\"Absorption costing\"],\"numericAnswer\":96,\"numericTolerance\":0.01,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-cost-w5\",\"topicId\":\"t-mi-cost\",\"difficulty\":\"hard\",\"scenario\":\"Under activity-based costing, the machine set-up cost pool is £120,000 and the cost driver is the number of set-ups, totalling 800 set-ups across all products. Product Z requires 50 set-ups for a production run of 2,000 units.\",\"stem\":\"Calculate the set-up cost absorbed per unit of Product Z, in £.\",\"explanation\":\"ABC: cost driver rate = cost pool ÷ total driver volume, then allocate to the product and spread over its units.\",\"workedSolution\":\"Rate = 120,000 ÷ 800 = £150 per set-up\\nCost to Z = 150 × 50 = 7,500\\nPer unit = 7,500 ÷ 2,000 = £3.75.\",\"relatedConcepts\":[\"Activity-based costing\",\"Cost driver rate\"],\"numericAnswer\":3.75,\"numericTolerance\":0.01,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-cost-w6\",\"topicId\":\"t-mi-cost\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"scenario\":\"In a period, production exceeded sales (closing inventory rose). Fixed production overhead was incurred as budgeted.\",\"stem\":\"How will absorption-costing profit compare with marginal-costing profit?\",\"explanation\":\"When inventory increases, absorption costing carries forward some fixed overhead in closing inventory, so it reports a higher profit than marginal costing.\",\"relatedConcepts\":[\"Absorption vs marginal costing\",\"Inventory movement\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-mi-cost-w6-0-581\",\"questionId\":\"mi-cost-w6\",\"label\":\"Absorption profit will be higher than marginal profit\",\"isCorrect\":true,\"feedback\":\"Correct — rising inventory defers fixed overhead in the SOFP under absorption costing.\",\"sortOrder\":0},{\"id\":\"a-mi-cost-w6-1-582\",\"questionId\":\"mi-cost-w6\",\"label\":\"Marginal profit will be higher than absorption profit\",\"isCorrect\":false,\"feedback\":\"That occurs when inventory falls, not rises.\",\"sortOrder\":1},{\"id\":\"a-mi-cost-w6-2-583\",\"questionId\":\"mi-cost-w6\",\"label\":\"They will be equal\",\"isCorrect\":false,\"feedback\":\"They are equal only when production equals sales (no inventory change).\",\"sortOrder\":2},{\"id\":\"a-mi-cost-w6-3-584\",\"questionId\":\"mi-cost-w6\",\"label\":\"It cannot be determined without sales price\",\"isCorrect\":false,\"feedback\":\"The direction depends only on the inventory movement.\",\"sortOrder\":3}]}],\"t-mi-cvp\":[{\"id\":\"q-mi-1\",\"topicId\":\"t-mi-cvp\",\"type\":\"calc\",\"difficulty\":\"medium\",\"stem\":\"A product sells for £40 with variable costs of £25 per unit. Fixed costs are £60,000. How many units must be sold to break even?\",\"explanation\":\"Breakeven units = fixed costs ÷ contribution per unit. Contribution = £40 − £25 = £15.\",\"workedSolution\":\"Contribution = 40 − 25 = £15\\nBreakeven = 60,000 ÷ 15 = 4,000 units\",\"relatedConcepts\":[\"Contribution\",\"Margin of safety\"],\"numericAnswer\":4000,\"numericTolerance\":0,\"unit\":\"units\",\"rating\":1220,\"estSeconds\":90,\"isPublished\":true},{\"id\":\"q-mi-2\",\"topicId\":\"t-mi-cvp\",\"type\":\"calc\",\"difficulty\":\"hard\",\"stem\":\"Using the same product (price £40, variable cost £25, fixed costs £60,000), if budgeted sales are 5,000 units, what is the margin of safety as a %? Give your answer to the nearest whole percent.\",\"explanation\":\"Margin of safety % = (budgeted − breakeven) ÷ budgeted. Breakeven is 4,000 units.\",\"workedSolution\":\"MoS = (5,000 − 4,000) ÷ 5,000 = 20%\",\"relatedConcepts\":[\"Breakeven\",\"Margin of safety\"],\"numericAnswer\":20,\"numericTolerance\":0,\"unit\":\"%\",\"rating\":1380,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"x-mi-cvp-1\",\"topicId\":\"t-mi-cvp\",\"difficulty\":\"medium\",\"stem\":\"A product sells for £50 with variable cost £30. Fixed costs are £80,000 and the target profit is £40,000. How many units must be sold to achieve the target profit?\",\"explanation\":\"Units = (fixed costs + target profit) ÷ contribution per unit. Contribution = 50 − 30 = £20.\",\"workedSolution\":\"Units = (80,000 + 40,000) ÷ 20 = 120,000 ÷ 20 = 6,000 units\",\"relatedConcepts\":[\"Target profit\",\"Contribution\"],\"numericAnswer\":6000,\"numericTolerance\":0,\"unit\":\"units\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"x-mi-cvp-2\",\"topicId\":\"t-mi-cvp\",\"difficulty\":\"medium\",\"stem\":\"A product sells for £50 with variable cost £30. What is the contribution to sales (C/S) ratio, as a percentage?\",\"explanation\":\"C/S ratio = contribution ÷ selling price.\",\"workedSolution\":\"Contribution = 50 − 30 = 20\\nC/S = 20 ÷ 50 = 40%\",\"relatedConcepts\":[\"C/S ratio\",\"Contribution\"],\"numericAnswer\":40,\"numericTolerance\":0,\"unit\":\"%\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-cvp-w1\",\"topicId\":\"t-mi-cvp\",\"difficulty\":\"easy\",\"scenario\":\"A product sells for £40, has variable cost of £24 per unit, and total fixed costs are £96,000.\",\"stem\":\"Calculate the breakeven point in units.\",\"explanation\":\"Breakeven units = fixed costs ÷ contribution per unit, where contribution = selling price − variable cost.\",\"workedSolution\":\"Contribution = 40 − 24 = 16\\nBreakeven = 96,000 ÷ 16 = 6,000 units.\",\"relatedConcepts\":[\"Breakeven point\",\"Contribution per unit\"],\"numericAnswer\":6000,\"numericTolerance\":1,\"unit\":\"units\",\"type\":\"calc\",\"rating\":1050,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-cvp-w2\",\"topicId\":\"t-mi-cvp\",\"difficulty\":\"easy\",\"scenario\":\"A product sells for £50 with variable cost of £30 per unit.\",\"stem\":\"Calculate the contribution to sales (C/S) ratio, as a percentage.\",\"explanation\":\"C/S ratio = contribution ÷ selling price.\",\"workedSolution\":\"Contribution = 50 − 30 = 20\\nC/S ratio = 20 ÷ 50 = 40%.\",\"relatedConcepts\":[\"C/S ratio\",\"Contribution\"],\"numericAnswer\":40,\"numericTolerance\":0.1,\"unit\":\"%\",\"type\":\"calc\",\"rating\":1050,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-cvp-w3\",\"topicId\":\"t-mi-cvp\",\"difficulty\":\"medium\",\"scenario\":\"Fixed costs are £150,000. The C/S ratio is 30%.\",\"stem\":\"Calculate the breakeven revenue, in £.\",\"explanation\":\"Breakeven revenue = fixed costs ÷ C/S ratio.\",\"workedSolution\":\"Breakeven revenue = 150,000 ÷ 0.30 = £500,000.\",\"relatedConcepts\":[\"Breakeven revenue\",\"C/S ratio\"],\"numericAnswer\":500000,\"numericTolerance\":1,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-cvp-w4\",\"topicId\":\"t-mi-cvp\",\"difficulty\":\"medium\",\"scenario\":\"A product earns contribution of £12 per unit. Fixed costs are £180,000 and the company targets a profit of £60,000.\",\"stem\":\"Calculate the sales volume (units) required to achieve the target profit.\",\"explanation\":\"Required units = (fixed costs + target profit) ÷ contribution per unit.\",\"workedSolution\":\"Required units = (180,000 + 60,000) ÷ 12 = 240,000 ÷ 12 = 20,000 units.\",\"relatedConcepts\":[\"Target profit\",\"Contribution per unit\"],\"numericAnswer\":20000,\"numericTolerance\":1,\"unit\":\"units\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-cvp-w5\",\"topicId\":\"t-mi-cvp\",\"difficulty\":\"medium\",\"scenario\":\"Budgeted sales are 10,000 units. The breakeven point is 7,500 units.\",\"stem\":\"Calculate the margin of safety as a percentage of budgeted sales.\",\"explanation\":\"Margin of safety % = (budgeted sales − breakeven sales) ÷ budgeted sales.\",\"workedSolution\":\"MoS = (10,000 − 7,500) ÷ 10,000 = 2,500 ÷ 10,000 = 25%.\",\"relatedConcepts\":[\"Margin of safety\",\"Breakeven\"],\"numericAnswer\":25,\"numericTolerance\":0.1,\"unit\":\"%\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-cvp-w6\",\"topicId\":\"t-mi-cvp\",\"difficulty\":\"hard\",\"scenario\":\"A company sells two products in a constant mix of 3 units of A to 1 unit of B. Contribution is £5 per unit of A and £9 per unit of B. Fixed costs are £168,000.\",\"stem\":\"Calculate the number of complete mix-batches required to break even (each batch = 3A + 1B).\",\"explanation\":\"Find the contribution per batch, then divide fixed costs by it.\",\"workedSolution\":\"Contribution per batch = (3 × 5) + (1 × 9) = 15 + 9 = 24\\nBreakeven batches = 168,000 ÷ 24 = 7,000 batches.\",\"relatedConcepts\":[\"Multi-product breakeven\",\"Sales mix\"],\"numericAnswer\":7000,\"numericTolerance\":1,\"unit\":\"batches\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true}],\"t-mi-bud\":[{\"id\":\"x-mi-bud-1\",\"topicId\":\"t-mi-bud\",\"difficulty\":\"hard\",\"stem\":\"Standard material cost is 3 kg at £4/kg. Actual production used 5,000 kg costing £22,000 to make 1,600 units. What is the material price variance (£)? Enter the absolute amount.\",\"explanation\":\"Price variance = (standard price − actual price) × actual quantity = actual quantity × std price − actual cost = (5,000 × 4) − 22,000 = 20,000 − 22,000 = −2,000 (adverse).\",\"workedSolution\":\"Std cost of actual qty = 5,000 × 4 = 20,000\\nActual cost = 22,000\\nPrice variance = 2,000 Adverse\",\"relatedConcepts\":[\"Material price variance\",\"Standard costing\"],\"numericAnswer\":2000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"x-mi-bud-2\",\"topicId\":\"t-mi-bud\",\"difficulty\":\"hard\",\"stem\":\"Standard usage is 3 kg per unit at £4/kg. Actual production was 1,600 units using 5,000 kg. What is the material usage variance (£)? Enter the absolute amount.\",\"explanation\":\"Usage variance = (standard quantity for actual production − actual quantity) × standard price. Std qty = 1,600 × 3 = 4,800 kg.\",\"workedSolution\":\"Std qty = 1,600 × 3 = 4,800 kg\\nUsage var = (4,800 − 5,000) × 4 = −800 = £800 Adverse\",\"relatedConcepts\":[\"Material usage variance\"],\"numericAnswer\":800,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-bud-w1\",\"topicId\":\"t-mi-bud\",\"difficulty\":\"medium\",\"scenario\":\"Standard material cost is 4 kg per unit at £6 per kg. Actual production was 5,000 units, using 21,000 kg costing £121,800.\",\"stem\":\"Calculate the direct material price variance, in £, and state whether it is favourable or adverse (enter the amount only).\",\"explanation\":\"Price variance = (standard price − actual price) × actual quantity purchased/used = (AQ × SP) − actual cost.\",\"workedSolution\":\"AQ × SP = 21,000 × 6 = 126,000\\nActual cost = 121,800\\nVariance = 126,000 − 121,800 = £4,200 Favourable.\",\"relatedConcepts\":[\"Material price variance\",\"Standard costing\"],\"numericAnswer\":4200,\"numericTolerance\":1,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-bud-w2\",\"topicId\":\"t-mi-bud\",\"difficulty\":\"medium\",\"scenario\":\"Standard material usage is 4 kg per unit at £6 per kg. Actual production was 5,000 units, using 21,000 kg.\",\"stem\":\"Calculate the direct material usage variance, in £ (enter the amount only).\",\"explanation\":\"Usage variance = (standard quantity for actual output − actual quantity) × standard price.\",\"workedSolution\":\"Standard qty = 5,000 × 4 = 20,000 kg\\nUsage diff = 20,000 − 21,000 = −1,000 kg (extra used)\\nVariance = 1,000 × 6 = £6,000 Adverse.\",\"relatedConcepts\":[\"Material usage variance\",\"Standard costing\"],\"numericAnswer\":6000,\"numericTolerance\":1,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-bud-w3\",\"topicId\":\"t-mi-bud\",\"difficulty\":\"medium\",\"scenario\":\"Standard labour rate is £12 per hour. Actual hours paid were 8,200 at a total cost of £100,860.\",\"stem\":\"Calculate the direct labour rate variance, in £ (enter the amount only).\",\"explanation\":\"Rate variance = (standard rate × actual hours) − actual cost.\",\"workedSolution\":\"AH × SR = 8,200 × 12 = 98,400\\nActual cost = 100,860\\nVariance = 98,400 − 100,860 = £2,460 Adverse.\",\"relatedConcepts\":[\"Labour rate variance\",\"Standard costing\"],\"numericAnswer\":2460,\"numericTolerance\":1,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-bud-w4\",\"topicId\":\"t-mi-bud\",\"difficulty\":\"medium\",\"scenario\":\"Standard labour time is 1.5 hours per unit at £12 per hour. Actual output was 5,000 units and actual hours worked were 8,200.\",\"stem\":\"Calculate the labour efficiency variance, in £ (enter the amount only).\",\"explanation\":\"Efficiency variance = (standard hours for actual output − actual hours) × standard rate.\",\"workedSolution\":\"Standard hours = 5,000 × 1.5 = 7,500\\nDiff = 7,500 − 8,200 = −700 hours\\nVariance = 700 × 12 = £8,400 Adverse.\",\"relatedConcepts\":[\"Labour efficiency variance\",\"Standard costing\"],\"numericAnswer\":8400,\"numericTolerance\":1,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-bud-w5\",\"topicId\":\"t-mi-bud\",\"difficulty\":\"hard\",\"scenario\":\"Variable production overhead is absorbed at £4 per labour hour. The standard is 2 hours per unit. Actual output was 3,000 units, actual hours worked were 6,200, and actual variable overhead cost was £23,560.\",\"stem\":\"Calculate the variable overhead expenditure (rate) variance, in £ (enter the amount only).\",\"explanation\":\"Expenditure variance = (standard rate × actual hours) − actual variable overhead cost.\",\"workedSolution\":\"AH × SR = 6,200 × 4 = 24,800\\nActual cost = 23,560\\nVariance = 24,800 − 23,560 = £1,240 Favourable.\",\"relatedConcepts\":[\"Variable overhead expenditure variance\",\"Standard costing\"],\"numericAnswer\":1240,\"numericTolerance\":1,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-bud-w6\",\"topicId\":\"t-mi-bud\",\"difficulty\":\"hard\",\"scenario\":\"A flexible budget has fixed costs of £40,000 and variable costs of £6 per unit. Budgeted output was 10,000 units. Actual output was 11,000 units.\",\"stem\":\"Calculate the total flexed budget cost allowance for the actual output, in £.\",\"explanation\":\"Flex the budget to actual output: fixed costs stay constant, variable costs flex with volume.\",\"workedSolution\":\"Variable = 6 × 11,000 = 66,000\\nFlexed cost = 40,000 + 66,000 = £106,000.\",\"relatedConcepts\":[\"Flexed budget\",\"Cost behaviour\"],\"numericAnswer\":106000,\"numericTolerance\":1,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true}],\"t-mi-price\":[{\"id\":\"mi-price-w1\",\"topicId\":\"t-mi-price\",\"difficulty\":\"easy\",\"scenario\":\"A product has a total cost of £40 per unit. The company uses cost-plus pricing with a 25% mark-up on cost.\",\"stem\":\"Calculate the selling price per unit, in £.\",\"explanation\":\"Cost-plus price = cost × (1 + mark-up%).\",\"workedSolution\":\"Price = 40 × 1.25 = £50.00.\",\"relatedConcepts\":[\"Cost-plus pricing\",\"Mark-up\"],\"numericAnswer\":50,\"numericTolerance\":0.01,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1050,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-price-w2\",\"topicId\":\"t-mi-price\",\"difficulty\":\"medium\",\"scenario\":\"A product costs £60 per unit to make. Management wants a gross profit margin of 20% of selling price.\",\"stem\":\"Calculate the selling price per unit, in £.\",\"explanation\":\"When margin is expressed on selling price, cost = (1 − margin%) of price, so price = cost ÷ (1 − margin%).\",\"workedSolution\":\"Price = 60 ÷ (1 − 0.20) = 60 ÷ 0.80 = £75.00.\",\"relatedConcepts\":[\"Margin vs mark-up\",\"Pricing\"],\"numericAnswer\":75,\"numericTolerance\":0.01,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-price-w3\",\"topicId\":\"t-mi-price\",\"difficulty\":\"hard\",\"scenario\":\"A special order requires 200 kg of material X already in inventory. It originally cost £8/kg. Material X is in regular use; its current replacement cost is £9/kg and its scrap value is £2/kg.\",\"stem\":\"Calculate the relevant cost of the material X for the special order, in £.\",\"explanation\":\"For material in regular use, the relevant cost is the replacement cost (it must be replaced), not historical cost or scrap value.\",\"workedSolution\":\"Relevant cost = 200 × £9 (replacement) = £1,800.\",\"relatedConcepts\":[\"Relevant costing\",\"Replacement cost\"],\"numericAnswer\":1800,\"numericTolerance\":1,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-price-w4\",\"topicId\":\"t-mi-price\",\"difficulty\":\"medium\",\"scenario\":\"A component can be bought in for £18 per unit. To make it internally costs £11 variable cost plus £5 per unit of fixed overhead, of which £2 per unit is avoidable if production ceases. 4,000 units are required.\",\"stem\":\"Calculate the annual saving from making rather than buying the component, in £.\",\"explanation\":\"Compare the buy-in price with the relevant cost of making (variable + avoidable fixed only). Unavoidable fixed cost is ignored.\",\"workedSolution\":\"Relevant cost to make = 11 + 2 = £13/unit\\nSaving per unit = 18 − 13 = £5\\nTotal saving = 5 × 4,000 = £20,000.\",\"relatedConcepts\":[\"Make-or-buy\",\"Avoidable cost\"],\"numericAnswer\":20000,\"numericTolerance\":1,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-price-w5\",\"topicId\":\"t-mi-price\",\"difficulty\":\"hard\",\"scenario\":\"Two products share a scarce machine. Product A: contribution £30/unit, 3 machine hours/unit. Product B: contribution £24/unit, 2 machine hours/unit.\",\"stem\":\"Calculate the contribution per machine hour of the product that should be prioritised, in £.\",\"explanation\":\"With a single limiting factor, rank by contribution per unit of the scarce resource and prioritise the highest.\",\"workedSolution\":\"A = 30 ÷ 3 = £10/hour\\nB = 24 ÷ 2 = £12/hour\\nPrioritise B at £12.00 per machine hour.\",\"relatedConcepts\":[\"Limiting factor\",\"Contribution per scarce resource\"],\"numericAnswer\":12,\"numericTolerance\":0.01,\"unit\":\"£/hour\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-price-w6\",\"topicId\":\"t-mi-price\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"scenario\":\"A short-term decision involves labour that is currently idle but paid under a guaranteed wage agreement (the workers will be paid whether or not they work on this order).\",\"stem\":\"What is the relevant cost of this labour for the decision?\",\"explanation\":\"Idle labour paid under a guaranteed wage is a committed cost incurred regardless of the decision, so its relevant cost is nil.\",\"relatedConcepts\":[\"Relevant costing\",\"Committed cost\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-mi-price-w6-0-585\",\"questionId\":\"mi-price-w6\",\"label\":\"Nil — the wage is paid regardless of the ing\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-cash-w3\",\"topicId\":\"t-mi-cash\",\"difficulty\":\"hard\",\"scenario\":\"A business buys goods on credit, paying suppliers in the month after purchase. Purchases are: April £30,000, May £36,000, June £33,000. Cost of sales each month is paid for from these purchases.\",\"stem\":\"Calculate the cash paid to suppliers in June, in £.\",\"explanation\":\"Payment lags purchases by one month, so June pays for May's purchases.\",\"workedSolution\":\"June payment = May purchases = £36,000.\",\"relatedConcepts\":[\"Payments forecasting\",\"Payment lag\"],\"numericAnswer\":36000,\"numericTolerance\":1,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-cash-w4\",\"topicId\":\"t-mi-cash\",\"difficulty\":\"medium\",\"scenario\":\"Forecast profit before tax for the year is £120,000. This is after charging depreciation of £18,000. There are no other non-cash items and no working capital changes.\",\"stem\":\"Calculate the forecast cash generated from operations, in £.\",\"explanation\":\"Add back non-cash items (depreciation) to profit to approximate operating cash flow.\",\"workedSolution\":\"Cash from operations = 120,000 + 18,000 = £138,000.\",\"relatedConcepts\":[\"Cash forecasting\",\"Non-cash items\"],\"numericAnswer\":138000,\"numericTolerance\":1,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"mi-cash-w5\",\"topicId\":\"t-mi-cash\",\"difficulty\":\"hard\",\"scenario\":\"Sales of £200,000 are made on credit. Receivables are expected to be £35,000 at the start of the period and £50,000 at the end of the period.\",\"stem\":\"Calculate the cash received from customers during the period, in £.\",\"explanation\":\"Cash received = opening receivables + credit sales − closing receivables.\",\"workedSolution\":\"Cash received = 35,000 + 200,000 − 50,000 = £185,000.\",\"relatedConcepts\":[\"Receivables movement\",\
