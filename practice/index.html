nswers\":[{\"id\":\"a-as-eth-6-0-316\",\"questionId\":\"as-eth-6\",\"label\":\"Advocacy threat\",\"isCorrect\":true,\"feedback\":\"Correct — taking the client's side in a dispute is an advocacy threat to objectivity.\",\"sortOrder\":0},{\"id\":\"a-as-eth-6-1-317\",\"questionId\":\"as-eth-6\",\"label\":\"Self-review threat\",\"isCorrect\":false,\"feedback\":\"The firm is not reviewing its own prior work here.\",\"sortOrder\":1},{\"id\":\"a-as-eth-6-2-318\",\"questionId\":\"as-eth-6\",\"label\":\"Familiarity threat\",\"isCorrect\":false,\"feedback\":\"No close relationship is described; the issue is promotion of the client's position.\",\"sortOrder\":2},{\"id\":\"a-as-eth-6-3-319\",\"questionId\":\"as-eth-6\",\"label\":\"Professional competence threat\",\"isCorrect\":false,\"feedback\":\"Competence is a principle, not one of the five threats.\",\"sortOrder\":3}]},{\"id\":\"as-eth-7\",\"topicId\":\"t-ass-eth\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Under the principle of confidentiality, in which circumstance may a member disclose confidential client information?\",\"explanation\":\"Disclosure is permitted where authorised by the client, required by law (e.g. money-laundering reporting), or there is a professional duty/right to disclose and it is not prohibited by law.\",\"relatedConcepts\":[\"Confidentiality\",\"Permitted disclosure\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-eth-7-0-320\",\"questionId\":\"as-eth-7\",\"label\":\"Where disclosure is required by law, such as reporting suspected money laundering\",\"isCorrect\":true,\"feedback\":\"Correct — legal obligation is a recognised ground for permitted disclosure.\",\"sortOrder\":0},{\"id\":\"a-as-eth-7-1-321\",\"questionId\":\"as-eth-7\",\"label\":\"Whenever it would be commercially useful to the firm\",\"isCorrect\":false,\"feedback\":\"Commercial advantage is never a valid reason to breach confidentiality.\",\"sortOrder\":1},{\"id\":\"a-as-eth-7-2-322\",\"questionId\":\"as-eth-7\",\"label\":\"To impress a prospective client at a networking event\",\"isCorrect\":false,\"feedback\":\"This is an improper use of confidential information.\",\"sortOrder\":2},{\"id\":\"a-as-eth-7-3-323\",\"questionId\":\"as-eth-7\",\"label\":\"Because the information is interesting to discuss socially\",\"isCorrect\":false,\"feedback\":\"Social discussion of client matters breaches confidentiality.\",\"sortOrder\":3}]}],\"t-ass-rep\":[{\"id\":\"as-rep-1\",\"topicId\":\"t-ass-rep\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"An auditor concludes that the financial statements give a true and fair view in all material respects, with no significant issues.\",\"stem\":\"Which type of audit opinion should be issued?\",\"explanation\":\"When the statements are free from material misstatement, an unmodified (unqualified) opinion is given.\",\"relatedConcepts\":[\"Unmodified opinion\",\"True and fair view\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-rep-1-0-324\",\"questionId\":\"as-rep-1\",\"label\":\"An unmodified (unqualified) opinion\",\"isCorrect\":true,\"feedback\":\"Correct — no material issues means an unmodified opinion.\",\"sortOrder\":0},{\"id\":\"a-as-rep-1-1-325\",\"questionId\":\"as-rep-1\",\"label\":\"A qualified 'except for' opinion\",\"isCorrect\":false,\"feedback\":\"A qualification is only needed for a material but not pervasive issue.\",\"sortOrder\":1},{\"id\":\"a-as-rep-1-2-326\",\"questionId\":\"as-rep-1\",\"label\":\"An adverse opinion\",\"isCorrect\":false,\"feedback\":\"An adverse opinion is for pervasive material misstatement.\",\"sortOrder\":2},{\"id\":\"a-as-rep-1-3-327\",\"questionId\":\"as-rep-1\",\"label\":\"A disclaimer of opinion\",\"isCorrect\":false,\"feedback\":\"A disclaimer is for a pervasive inability to obtain evidence.\",\"sortOrder\":3}]},{\"id\":\"as-rep-2\",\"topicId\":\"t-ass-rep\",\"type\":\"scenario\",\"difficulty\":\"hard\",\"scenario\":\"Inventory is materially overstated because it is not written down to net realisable value. The misstatement is material but confined to that one balance and is not pervasive.\",\"stem\":\"What opinion is appropriate?\",\"explanation\":\"A material but not pervasive misstatement leads to a qualified ('except for') opinion.\",\"relatedConcepts\":[\"Qualified opinion\",\"Material but not pervasive\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-rep-2-0-328\",\"questionId\":\"as-rep-2\",\"label\":\"A qualified 'except for' opinion\",\"isCorrect\":true,\"feedback\":\"Correct — material but not pervasive misstatement gives an 'except for' qualification.\",\"sortOrder\":0},{\"id\":\"a-as-rep-2-1-329\",\"questionId\":\"as-rep-2\",\"label\":\"An unmodified opinion\",\"isCorrect\":false,\"feedback\":\"A material misstatement cannot be reported as unmodified.\",\"sortOrder\":1},{\"id\":\"a-as-rep-2-2-330\",\"questionId\":\"as-rep-2\",\"label\":\"An adverse opinion\",\"isCorrect\":false,\"feedback\":\"Adverse is reserved for pervasive misstatement; this is confined to one balance.\",\"sortOrder\":2},{\"id\":\"a-as-rep-2-3-331\",\"questionId\":\"as-rep-2\",\"label\":\"A disclaimer of opinion\",\"isCorrect\":false,\"feedback\":\"A disclaimer concerns inability to obtain evidence, not a known misstatement.\",\"sortOrder\":3}]},{\"id\":\"as-rep-3\",\"topicId\":\"t-ass-rep\",\"type\":\"scenario\",\"difficulty\":\"hard\",\"scenario\":\"The auditor is unable to obtain any evidence over a subsidiary that represents the majority of group assets, so cannot form a view on the group financial statements as a whole.\",\"stem\":\"What opinion should be issued?\",\"explanation\":\"A pervasive inability to obtain sufficient appropriate evidence leads to a disclaimer of opinion.\",\"relatedConcepts\":[\"Disclaimer of opinion\",\"Limitation of scope\",\"Pervasive\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-rep-3-0-332\",\"questionId\":\"as-rep-3\",\"label\":\"A disclaimer of opinion\",\"isCorrect\":true,\"feedback\":\"Correct — a pervasive limitation on scope means the auditor disclaims an opinion.\",\"sortOrder\":0},{\"id\":\"a-as-rep-3-1-333\",\"questionId\":\"as-rep-3\",\"label\":\"A qualified 'except for' opinion\",\"isCorrect\":false,\"feedback\":\"Qualification applies when the matter is material but not pervasive.\",\"sortOrder\":1},{\"id\":\"a-as-rep-3-2-334\",\"questionId\":\"as-rep-3\",\"label\":\"An adverse opinion\",\"isCorrect\":false,\"feedback\":\"Adverse opinions arise from misstatement, not from missing evidence.\",\"sortOrder\":2},{\"id\":\"a-as-rep-3-3-335\",\"questionId\":\"as-rep-3\",\"label\":\"An unmodified opinion\",\"isCorrect\":false,\"feedback\":\"An opinion cannot be unmodified when evidence is pervasively lacking.\",\"sortOrder\":3}]},{\"id\":\"as-rep-4\",\"topicId\":\"t-ass-rep\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"Which of the following is a required element of an external auditor's report?\",\"explanation\":\"An auditor's report includes, among other elements, a title, addressee, the opinion, basis for opinion, respective responsibilities of directors and auditors, and the auditor's signature and date.\",\"relatedConcepts\":[\"Contents of the auditor's report\",\"Basis for opinion\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-rep-4-0-336\",\"questionId\":\"as-rep-4\",\"label\":\"A statement of the respective responsibilities of directors and auditors\",\"isCorrect\":true,\"feedback\":\"Correct — describing responsibilities is a required element.\",\"sortOrder\":0},{\"id\":\"a-as-rep-4-1-337\",\"questionId\":\"as-rep-4\",\"label\":\"A guarantee that the company is a going concern forever\",\"isCorrect\":false,\"feedback\":\"No guarantee of future viability is given.\",\"sortOrder\":1},{\"id\":\"a-as-rep-4-2-338\",\"questionId\":\"as-rep-4\",\"label\":\"A forecast of next year's profits\",\"isCorrect\":false,\"feedback\":\"The report addresses historical statements, not forecasts.\",\"sortOrder\":2},{\"id\":\"a-as-rep-4-3-339\",\"questionId\":\"as-rep-4\",\"label\":\"The auditor's personal opinion on management's competence\",\"isCorrect\":false,\"feedback\":\"The report opines on the financial statements, not management ability.\",\"sortOrder\":3}]},{\"id\":\"as-rep-5\",\"topicId\":\"t-ass-rep\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"There is a material uncertainty over going concern, but it is adequately disclosed in the financial statements and the auditor agrees with the going concern basis.\",\"stem\":\"How should the auditor report this?\",\"explanation\":\"Where a material uncertainty is adequately disclosed, the auditor issues an unmodified opinion but includes a separate 'Material Uncertainty Related to Going Concern' section drawing attention to the disclosure.\",\"relatedConcepts\":[\"Going concern\",\"Material uncertainty section\",\"Unmodified opinion\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-rep-5-0-340\",\"questionId\":\"as-rep-5\",\"label\":\"Issue an unmodified opinion with a 'Material Uncertainty Related to Going Concern' section\",\"isCorrect\":true,\"feedback\":\"Correct — adequate disclosure means the opinion is not modified, but a specific section highlights the uncertainty.\",\"sortOrder\":0},{\"id\":\"a-as-rep-5-1-341\",\"questionId\":\"as-rep-5\",\"label\":\"Issue an adverse opinion\",\"isCorrect\":false,\"feedback\":\"Adequate disclosure does not warrant an adverse opinion.\",\"sortOrder\":1},{\"id\":\"a-as-rep-5-2-342\",\"questionId\":\"as-rep-5\",\"label\":\"Issue a qualified opinion\",\"isCorrect\":false,\"feedback\":\"No qualification is needed where the uncertainty is adequately disclosed.\",\"sortOrder\":2},{\"id\":\"a-as-rep-5-3-343\",\"questionId\":\"as-rep-5\",\"label\":\"Say nothing about going concern in the report\",\"isCorrect\":false,\"feedback\":\"The uncertainty must be drawn to users' attention.\",\"sortOrder\":3}]},{\"id\":\"as-rep-6\",\"topicId\":\"t-ass-rep\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"What is the purpose of an 'Emphasis of Matter' paragraph in an auditor's report?\",\"explanation\":\"An Emphasis of Matter paragraph draws users' attention to a matter appropriately presented or disclosed in the financial statements that is fundamental to their understanding; it does not modify the opinion.\",\"relatedConcepts\":[\"Emphasis of Matter\",\"Unmodified opinion\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-as-rep-6-0-344\",\"questionId\":\"as-rep-6\",\"label\":\"To draw attention to a fundamental, correctly disclosed matter without modifying the opinion\",\"isCorrect\":true,\"feedback\":\"Correct — it highlights a disclosed matter and does not change the opinion.\",\"sortOrder\":0},{\"id\":\"a-as-rep-6-1-345\",\"questionId\":\"as-rep-6\",\"label\":\"To express a qualified opinion on a balance\",\"isCorrect\":false,\"feedback\":\"Emphasis of Matter does not modify or qualify the opinion.\",\"sortOrder\":1},{\"id\":\"a-as-rep-6-2-346\",\"questionId\":\"as-rep-6\",\"label\":\"To replace the basis for opinion section\",\"isCorrect\":false,\"feedback\":\"It is additional to, not a replacement for, the basis for opinion.\",\"sortOrder\":2},{\"id\":\"a-as-rep-6-3-347\",\"questionId\":\"as-rep-6\",\"label\":\"To report a material misstatement the directors refuse to correct\",\"isCorrect\":false,\"feedback\":\"An uncorrected material misstatement leads to a modified opinion, not an Emphasis of Matter.\",\"sortOrder\":3}]}],\"t-btf-gov\":[{\"id\":\"x-btf-gov-1\",\"topicId\":\"t-btf-gov\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"An audit firm is asked to prepare a client's financial statements and then audit them. Which fundamental threat to objectivity is MOST directly created?\",\"explanation\":\"Auditing your own work creates a self-review threat. The firm would be reviewing figures it prepared.\",\"relatedConcepts\":[\"Ethical threats\",\"Objectivity\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-x-btf-gov-1-0-28\",\"questionId\":\"x-btf-gov-1\",\"label\":\"Self-review threat\",\"isCorrect\":true,\"feedback\":\"Correct — the firm would audit work it has prepared.\",\"sortOrder\":0},{\"id\":\"a-x-btf-gov-1-1-29\",\"questionId\":\"x-btf-gov-1\",\"label\":\"Advocacy threat\",\"isCorrect\":false,\"feedback\":\"Advocacy is promoting a client's position.\",\"sortOrder\":1},{\"id\":\"a-x-btf-gov-1-2-30\",\"questionId\":\"x-btf-gov-1\",\"label\":\"Intimidation threat\",\"isCorrect\":false,\"feedback\":\"That arises from pressure or threats.\",\"sortOrder\":2},{\"id\":\"a-x-btf-gov-1-3-31\",\"questionId\":\"x-btf-gov-1\",\"label\":\"Familiarity threat\",\"isCorrect\":false,\"feedback\":\"That arises from a close relationship over time.\",\"sortOrder\":3}]},{\"id\":\"x-btf-gov-2\",\"topicId\":\"t-btf-gov\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"In a unitary board structure, what is the principal role of non-executive directors (NEDs)?\",\"explanation\":\"NEDs provide independent judgement and constructive challenge, and sit on key committees (audit, remuneration, nomination).\",\"relatedConcepts\":[\"Corporate governance\",\"Board structure\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-x-btf-gov-2-0-32\",\"questionId\":\"x-btf-gov-2\",\"label\":\"To provide independent oversight and challenge\",\"isCorrect\":true,\"feedback\":\"Correct — independence and scrutiny are their core role.\",\"sortOrder\":0},{\"id\":\"a-x-btf-gov-2-1-33\",\"questionId\":\"x-btf-gov-2\",\"label\":\"To run the day-to-day operations\",\"isCorrect\":false,\"feedback\":\"That is the executive directors' role.\",\"sortOrder\":1},{\"id\":\"a-x-btf-gov-2-2-34\",\"questionId\":\"x-btf-gov-2\",\"label\":\"To act as the external auditor\",\"isCorrect\":false,\"feedback\":\"NEDs are not the auditor.\",\"sortOrder\":2},{\"id\":\"a-x-btf-gov-2-3-35\",\"questionId\":\"x-btf-gov-2\",\"label\":\"To replace the shareholders in general meetings\",\"isCorrect\":false,\"feedback\":\"Shareholders retain their statutory rights.\",\"sortOrder\":3}]},{\"id\":\"bf-gov-1\",\"topicId\":\"t-btf-gov\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"What is the primary role of a non-executive director (NED) on a company board?\",\"explanation\":\"NEDs are not part of day-to-day management. Their role is to provide independent judgement and constructively challenge and monitor the executive directors.\",\"relatedConcepts\":[\"Non-executive directors\",\"Board composition\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-gov-1-0-348\",\"questionId\":\"bf-gov-1\",\"label\":\"To provide independent judgement and challenge executive management\",\"isCorrect\":true,\"feedback\":\"Correct — NEDs bring objectivity and oversight, not daily management.\",\"sortOrder\":0},{\"id\":\"a-bf-gov-1-1-349\",\"questionId\":\"bf-gov-1\",\"label\":\"To run the company's day-to-day operations\",\"isCorrect\":false,\"feedback\":\"That is the role of the executive directors and management.\",\"sortOrder\":1},{\"id\":\"a-bf-gov-1-2-350\",\"questionId\":\"bf-gov-1\",\"label\":\"To audit the financial statements\",\"isCorrect\":false,\"feedback\":\"That is the role of the external auditor, who is independent of the board.\",\"sortOrder\":2},{\"id\":\"a-bf-gov-1-3-351\",\"questionId\":\"bf-gov-1\",\"label\":\"To represent the trade unions on the board\",\"isCorrect\":false,\"feedback\":\"NEDs represent the interests of the company as a whole, not a single group.\",\"sortOrder\":3}]},{\"id\":\"bf-gov-2\",\"topicId\":\"t-btf-gov\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"The directors of Atlas Ltd hold no shares and are tempted to award themselves large bonuses and pursue empire-building acquisitions that boost their status but not shareholder value.\",\"stem\":\"Which concept best describes the conflict of interest between the directors and the shareholders here?\",\"explanation\":\"The agency problem arises because directors (agents) may act in their own interest rather than that of the shareholders (principals) who own the company.\",\"relatedConcepts\":[\"Agency theory\",\"Principal and agent\",\"Corporate governance\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-gov-2-0-352\",\"questionId\":\"bf-gov-2\",\"label\":\"The agency problem\",\"isCorrect\":true,\"feedback\":\"Correct — agents (directors) pursuing their own goals over the principals' (shareholders') interests.\",\"sortOrder\":0},{\"id\":\"a-bf-gov-2-1-353\",\"questionId\":\"bf-gov-2\",\"label\":\"The expectation gap\",\"isCorrect\":false,\"feedback\":\"The expectation gap relates to differing views of an auditor's responsibilities.\",\"sortOrder\":1},{\"id\":\"a-bf-gov-2-2-354\",\"questionId\":\"bf-gov-2\",\"label\":\"The going concern problem\",\"isCorrect\":false,\"feedback\":\"Going concern concerns an entity's ability to continue trading.\",\"sortOrder\":2},{\"id\":\"a-bf-gov-2-3-355\",\"questionId\":\"bf-gov-2\",\"label\":\"The separation of powers\",\"isCorrect\":false,\"feedback\":\"This is a constitutional/legal concept, not the director–shareholder conflict.\",\"sortOrder\":3}]},{\"id\":\"bf-gov-3\",\"topicId\":\"t-btf-gov\",\"type\":\"multi\",\"difficulty\":\"medium\",\"stem\":\"Which of the following are recognised fundamental principles in the ICAEW (IESBA-based) Code of Ethics? (Select all that apply.)\",\"explanation\":\"The five fundamental principles are integrity, objectivity, professional competence and due care, confidentiality, and professional behaviour. Profitability and aggressiveness are not ethical principles.\",\"relatedConcepts\":[\"Code of Ethics\",\"Fundamental principles\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-gov-3-0-356\",\"questionId\":\"bf-gov-3\",\"label\":\"Integrity\",\"isCorrect\":true,\"feedback\":\"Correct — being straightforward and honest.\",\"sortOrder\":0},{\"id\":\"a-bf-gov-3-1-357\",\"questionId\":\"bf-gov-3\",\"label\":\"Objectivity\",\"isCorrect\":true,\"feedback\":\"Correct — not allowing bias or conflicts of interest to override judgement.\",\"sortOrder\":1},{\"id\":\"a-bf-gov-3-2-358\",\"questionId\":\"bf-gov-3\",\"label\":\"Profit maximisation\",\"isCorrect\":false,\"feedback\":\"Not an ethical principle — it is a financial objective.\",\"sortOrder\":2},{\"id\":\"a-bf-gov-3-3-359\",\"questionId\":\"bf-gov-3\",\"label\":\"Professional behaviour\",\"isCorrect\":true,\"feedback\":\"Correct — complying with laws and avoiding discrediting the profession.\",\"sortOrder\":3},{\"id\":\"a-bf-gov-3-4-360\",\"questionId\":\"bf-gov-3\",\"label\":\"Confidentiality\",\"isCorrect\":true,\"feedback\":\"Correct — respecting the confidentiality of information acquired.\",\"sortOrder\":4}]},{\"id\":\"bf-gov-4\",\"topicId\":\"t-btf-gov\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Under the UK Corporate Governance Code, why is it recommended to separate the roles of chair and chief executive (CEO)?\",\"explanation\":\"Splitting the roles prevents an excessive concentration of power in one individual and ensures a balance of authority between running the board (chair) and running the business (CEO).\",\"relatedConcepts\":[\"Chair and CEO split\",\"Concentration of power\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-gov-4-0-361\",\"questionId\":\"bf-gov-4\",\"label\":\"To avoid an excessive concentration of power in one person\",\"isCorrect\":true,\"feedback\":\"Correct — it provides a balance of power and authority.\",\"sortOrder\":0},{\"id\":\"a-bf-gov-4-1-362\",\"questionId\":\"bf-gov-4\",\"label\":\"To reduce the company's tax liability\",\"isCorrect\":false,\"feedback\":\"Governance structure does not affect tax in this way.\",\"sortOrder\":1},{\"id\":\"a-bf-gov-4-2-363\",\"questionId\":\"bf-gov-4\",\"label\":\"Because company law makes it a legal requirement for all companies\",\"isCorrect\":false,\"feedback\":\"It is a 'comply or explain' Code provision, not a statutory rule for all companies.\",\"sortOrder\":2},{\"id\":\"a-bf-gov-4-3-364\",\"questionId\":\"bf-gov-4\",\"label\":\"To remove the need for non-executive directors\",\"isCorrect\":false,\"feedback\":\"NEDs remain essential regardless of the chair/CEO split.\",\"sortOrder\":3}]},{\"id\":\"bf-gov-5\",\"topicId\":\"t-btf-gov\",\"type\":\"scenario\",\"difficulty\":\"hard\",\"scenario\":\"A finance trainee discovers that a senior manager has asked them to record fictitious sales to hit a quarterly target. The trainee feels pressured because the manager controls their appraisal.\",\"stem\":\"Which threat to the fundamental ethical principles is most directly created by this situation?\",\"explanation\":\"The pressure exerted by a person in a position of authority over the trainee, deterring them from acting objectively, is an intimidation threat.\",\"relatedConcepts\":[\"Threats and safeguards\",\"Intimidation threat\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-gov-5-0-365\",\"questionId\":\"bf-gov-5\",\"label\":\"Intimidation threat\",\"isCorrect\":true,\"feedback\":\"Correct — pressure from a person in authority deters objective behaviour.\",\"sortOrder\":0},{\"id\":\"a-bf-gov-5-1-366\",\"questionId\":\"bf-gov-5\",\"label\":\"Self-review threat\",\"isCorrect\":false,\"feedback\":\"Self-review arises when reviewing one's own previous judgements, not from pressure.\",\"sortOrder\":1},{\"id\":\"a-bf-gov-5-2-367\",\"questionId\":\"bf-gov-5\",\"label\":\"Familiarity threat\",\"isCorrect\":false,\"feedback\":\"Familiarity arises from close relationships, not coercion.\",\"sortOrder\":2},{\"id\":\"a-bf-gov-5-3-368\",\"questionId\":\"bf-gov-5\",\"label\":\"Advocacy threat\",\"isCorrect\":false,\"feedback\":\"Advocacy arises from promoting a client's position, which is not the issue here.\",\"sortOrder\":3}]}],\"t-btf-fin\":[{\"id\":\"q-btf-1\",\"topicId\":\"t-btf-fin\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Which source of finance typically carries the lowest cost to a profitable company, ignoring issue costs?\",\"explanation\":\"Debt is usually cheaper than equity because interest is tax-deductible and lenders bear less risk than shareholders.\",\"relatedConcepts\":[\"Cost of capital\",\"Gearing\"],\"rating\":1200,\"estSeconds\":60,\"isPublished\":true,\"answers\":[{\"id\":\"a-q-btf-1-0-28\",\"questionId\":\"q-btf-1\",\"label\":\"Debt finance\",\"isCorrect\":true,\"feedback\":\"Correct — interest is tax-deductible and lower risk than equity.\",\"sortOrder\":0},{\"id\":\"a-q-btf-1-1-29\",\"questionId\":\"q-btf-1\",\"label\":\"Ordinary shares\",\"isCorrect\":false,\"feedback\":\"Equity is generally the most expensive source.\",\"sortOrder\":1},{\"id\":\"a-q-btf-1-2-30\",\"questionId\":\"q-btf-1\",\"label\":\"Retained earnings at the cost of equity\",\"isCorrect\":false,\"feedback\":\"This carries the cost of equity, higher than debt.\",\"sortOrder\":2},{\"id\":\"a-q-btf-1-3-31\",\"questionId\":\"q-btf-1\",\"label\":\"Preference shares\",\"isCorrect\":false,\"feedback\":\"Usually between debt and ordinary equity.\",\"sortOrder\":3}]},{\"id\":\"x-btf-fin-1\",\"topicId\":\"t-btf-fin\",\"difficulty\":\"medium\",\"stem\":\"A company has inventory days of 60, receivables days of 45 and payables days of 30. What is the length of its working-capital (cash operating) cycle in days?\",\"explanation\":\"Cycle = inventory days + receivables days − payables days.\",\"workedSolution\":\"60 + 45 − 30 = 75 days\",\"relatedConcepts\":[\"Working capital cycle\",\"Liquidity\"],\"numericAnswer\":75,\"numericTolerance\":0,\"unit\":\"days\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"x-btf-fin-2\",\"topicId\":\"t-btf-fin\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Which source of finance is most appropriate to fund a short-term seasonal increase in working capital?\",\"explanation\":\"Matching principle: short-term needs should be funded by short-term finance such as an overdraft.\",\"relatedConcepts\":[\"Matching principle\",\"Short-term finance\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-x-btf-fin-2-0-36\",\"questionId\":\"x-btf-fin-2\",\"label\":\"A bank overdraft\",\"isCorrect\":true,\"feedback\":\"Correct — flexible short-term finance for fluctuating needs.\",\"sortOrder\":0},{\"id\":\"a-x-btf-fin-2-1-37\",\"questionId\":\"x-btf-fin-2\",\"label\":\"A 10-year debenture\",\"isCorrect\":false,\"feedback\":\"Long-term debt is inappropriate for a short-term need.\",\"sortOrder\":1},{\"id\":\"a-x-btf-fin-2-2-38\",\"questionId\":\"x-btf-fin-2\",\"label\":\"An issue of ordinary shares\",\"isCorrect\":false,\"feedback\":\"Equity is permanent, long-term capital.\",\"sortOrder\":2},{\"id\":\"a-x-btf-fin-2-3-39\",\"questionId\":\"x-btf-fin-2\",\"label\":\"A finance lease on machinery\",\"isCorrect\":false,\"feedback\":\"This funds a long-term asset, not working capital.\",\"sortOrder\":3}]},{\"id\":\"bf-fin-1\",\"topicId\":\"t-btf-fin\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"Which of the following is a key difference between debt finance and equity finance?\",\"explanation\":\"Debt (e.g. a loan) carries a contractual obligation to pay interest and repay capital and ranks ahead of equity. Equity (shares) gives ownership and a variable dividend with no obligation to repay capital.\",\"relatedConcepts\":[\"Debt vs equity\",\"Sources of finance\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-fin-1-0-369\",\"questionId\":\"bf-fin-1\",\"label\":\"Interest on debt is a contractual obligation, whereas dividends on equity are discretionary\",\"isCorrect\":true,\"feedback\":\"Correct — interest must be paid; dividends are at the company's discretion.\",\"sortOrder\":0},{\"id\":\"a-bf-fin-1-1-370\",\"questionId\":\"bf-fin-1\",\"label\":\"Debt holders own the company, whereas equity holders are lenders\",\"isCorrect\":false,\"feedback\":\"It is the reverse — equity holders own the company; debt holders are lenders.\",\"sortOrder\":1},{\"id\":\"a-bf-fin-1-2-371\",\"questionId\":\"bf-fin-1\",\"label\":\"Equity must always be repaid before debt on a winding up\",\"isCorrect\":false,\"feedback\":\"Debt ranks ahead of equity on a winding up.\",\"sortOrder\":2},{\"id\":\"a-bf-fin-1-3-372\",\"questionId\":\"bf-fin-1\",\"label\":\"Debt finance always dilutes existing shareholders' control\",\"isCorrect\":false,\"feedback\":\"Issuing new equity dilutes control; debt does not confer voting rights.\",\"sortOrder\":3}]},{\"id\":\"bf-fin-2\",\"topicId\":\"t-btf-fin\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"A company offers existing shareholders the right to buy new shares in proportion to their current holding, usually at a discount. What is this called?\",\"explanation\":\"A rights issue offers new shares to existing shareholders pro rata to their holdings, helping them maintain their proportionate ownership and avoid dilution.\",\"relatedConcepts\":[\"Rights issue\",\"Equity finance\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-fin-2-0-373\",\"questionId\":\"bf-fin-2\",\"label\":\"A rights issue\",\"isCorrect\":true,\"feedback\":\"Correct — pro rata offer to existing shareholders, usually at a discount.\",\"sortOrder\":0},{\"id\":\"a-bf-fin-2-1-374\",\"questionId\":\"bf-fin-2\",\"label\":\"A bonus issue\",\"isCorrect\":false,\"feedback\":\"A bonus issue gives free shares from reserves and raises no new cash.\",\"sortOrder\":1},{\"id\":\"a-bf-fin-2-2-375\",\"questionId\":\"bf-fin-2\",\"label\":\"A debenture\",\"isCorrect\":false,\"feedback\":\"A debenture is a form of long-term debt, not an equity offer.\",\"sortOrder\":2},{\"id\":\"a-bf-fin-2-3-376\",\"questionId\":\"bf-fin-2\",\"label\":\"An overdraft\",\"isCorrect\":false,\"feedback\":\"An overdraft is short-term bank borrowing, not a share issue.\",\"sortOrder\":3}]},{\"id\":\"bf-fin-3\",\"topicId\":\"t-btf-fin\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Which source of finance is most appropriate to fund a short-term, fluctuating working-capital need?\",\"explanation\":\"Matching principle: short-term, fluctuating needs should be funded by short-term finance such as a bank overdraft, which is flexible and only incurs interest on the amount used.\",\"relatedConcepts\":[\"Matching principle\",\"Short-term finance\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-fin-3-0-377\",\"questionId\":\"bf-fin-3\",\"label\":\"A bank overdraft\",\"isCorrect\":true,\"feedback\":\"Correct — flexible short-term finance suited to fluctuating needs.\",\"sortOrder\":0},{\"id\":\"a-bf-fin-3-1-378\",\"questionId\":\"bf-fin-3\",\"label\":\"A 25-year mortgage\",\"isCorrect\":false,\"feedback\":\"Long-term finance is mismatched to a short-term fluctuating need.\",\"sortOrder\":1},{\"id\":\"a-bf-fin-3-2-379\",\"questionId\":\"bf-fin-3\",\"label\":\"An issue of ordinary shares\",\"isCorrect\":false,\"feedback\":\"Equity is permanent capital, unsuitable for short-term fluctuations.\",\"sortOrder\":2},{\"id\":\"a-bf-fin-3-3-380\",\"questionId\":\"bf-fin-3\",\"label\":\"Retained earnings reinvested in non-current assets\",\"isCorrect\":false,\"feedback\":\"This funds long-term assets, not fluctuating working capital.\",\"sortOrder\":3}]},{\"id\":\"bf-fin-4\",\"topicId\":\"t-btf-fin\",\"difficulty\":\"medium\",\"scenario\":\"Beech Ltd has the following data: inventory holding period 60 days, trade receivables collection period 45 days, and trade payables payment period 30 days.\",\"stem\":\"What is the length of the working-capital (cash operating) cycle, in days?\",\"explanation\":\"The working-capital cycle = inventory days + receivables days − payables days.\",\"workedSolution\":\"60 + 45 − 30 = 75 days\",\"relatedConcepts\":[\"Working-capital cycle\",\"Cash operating cycle\"],\"numericAnswer\":75,\"numericTolerance\":0,\"unit\":\"days\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"bf-fin-5\",\"topicId\":\"t-btf-fin\",\"difficulty\":\"medium\",\"scenario\":\"Cedar Ltd has long-term debt of £400,000 and ordinary shareholders' equity of £600,000. Gearing is measured as debt ÷ (debt + equity).\",\"stem\":\"What is the company's gearing ratio, expressed as a percentage?\",\"explanation\":\"Gearing (capital basis) = debt ÷ (debt + equity) × 100.\",\"workedSolution\":\"400,000 ÷ (400,000 + 600,000) = 400,000 ÷ 1,000,000 = 40%\",\"relatedConcepts\":[\"Gearing\",\"Capital structure\"],\"numericAnswer\":40,\"numericTolerance\":0,\"unit\":\"%\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"bf-fin-6\",\"topicId\":\"t-btf-fin\",\"difficulty\":\"medium\",\"scenario\":\"Dale Ltd has current assets of £180,000 (including inventory of £80,000) and current liabilities of £100,000.\",\"stem\":\"What is the quick (acid-test) ratio? Give your answer to two decimal places.\",\"explanation\":\"The quick ratio excludes inventory: (current assets − inventory) ÷ current liabilities.\",\"workedSolution\":\"(180,000 − 80,000) ÷ 100,000 = 100,000 ÷ 100,000 = 1.00\",\"relatedConcepts\":[\"Quick ratio\",\"Liquidity\"],\"numericAnswer\":1,\"numericTolerance\":0.01,\"unit\":\":1\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true}],\"t-btf-org\":[{\"id\":\"bf-org-1\",\"topicId\":\"t-btf-org\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"Which of the following best describes a 'stakeholder' of a business?\",\"explanation\":\"A stakeholder is any person or group with an interest in, or who is affected by, the activities of the organisation — e.g. shareholders, employees, customers, suppliers, government and the community.\",\"relatedConcepts\":[\"Stakeholders\",\"Stakeholder mapping\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-org-1-0-381\",\"questionId\":\"bf-org-1\",\"label\":\"Any party with an interest in, or affected by, the organisation's activities\",\"isCorrect\":true,\"feedback\":\"Correct — a broad group including shareholders, employees, customers and others.\",\"sortOrder\":0},{\"id\":\"a-bf-org-1-1-382\",\"questionId\":\"bf-org-1\",\"label\":\"Only the people who own shares in the company\",\"isCorrect\":false,\"feedback\":\"Shareholders are one group of stakeholders, but not the only one.\",\"sortOrder\":1},{\"id\":\"a-bf-org-1-2-383\",\"questionId\":\"bf-org-1\",\"label\":\"Only the board of directors\",\"isCorrect\":false,\"feedback\":\"Directors are stakeholders, but the term is much broader.\",\"sortOrder\":2},{\"id\":\"a-bf-org-1-3-384\",\"questionId\":\"bf-org-1\",\"label\":\"Only the company's banks and lenders\",\"isCorrect\":false,\"feedback\":\"Lenders are stakeholders, but so are many other groups.\",\"sortOrder\":3}]},{\"id\":\"bf-org-2\",\"topicId\":\"t-btf-org\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"Mercury Ltd organises itself into Marketing, Production, Finance and HR departments, each headed by a specialist manager.\",\"stem\":\"Which organisational structure is Mercury Ltd using?\",\"explanation\":\"A functional structure groups employees by specialism (e.g. marketing, finance, production), allowing economies of scale and expertise within each function.\",\"relatedConcepts\":[\"Functional structure\",\"Organisational structure\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-org-2-0-385\",\"questionId\":\"bf-org-2\",\"label\":\"A functional structure\",\"isCorrect\":true,\"feedback\":\"Correct — departments organised by specialist function.\",\"sortOrder\":0},{\"id\":\"a-bf-org-2-1-386\",\"questionId\":\"bf-org-2\",\"label\":\"A divisional (product) structure\",\"isCorrect\":false,\"feedback\":\"A divisional structure groups by product, region or market, not function.\",\"sortOrder\":1},{\"id\":\"a-bf-org-2-2-387\",\"questionId\":\"bf-org-2\",\"label\":\"A matrix structure\",\"isCorrect\":false,\"feedback\":\"A matrix combines functional and project lines of authority.\",\"sortOrder\":2},{\"id\":\"a-bf-org-2-3-388\",\"questionId\":\"bf-org-2\",\"label\":\"A holding-company structure\",\"isCorrect\":false,\"feedback\":\"That describes a group of separate legal entities, not internal departments.\",\"sortOrder\":3}]},{\"id\":\"bf-org-3\",\"topicId\":\"t-btf-org\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"Nova plc has separate divisions for North America, Europe and Asia, each with its own functional teams and held accountable for its own profit.\",\"stem\":\"Which organisational structure does Nova plc use?\",\"explanation\":\"A divisional structure splits the business into semi-autonomous units (here by geography), each responsible for its own performance, often as profit or investment centres.\",\"relatedConcepts\":[\"Divisional structure\",\"Profit centres\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-org-3-0-389\",\"questionId\":\"bf-org-3\",\"label\":\"A divisional structure\",\"isCorrect\":true,\"feedback\":\"Correct — semi-autonomous divisions accountable for their own profit.\",\"sortOrder\":0},{\"id\":\"a-bf-org-3-1-390\",\"questionId\":\"bf-org-3\",\"label\":\"A functional structure\",\"isCorrect\":false,\"feedback\":\"A functional structure groups by specialism across the whole company.\",\"sortOrder\":1},{\"id\":\"a-bf-org-3-2-391\",\"questionId\":\"bf-org-3\",\"label\":\"An entrepreneurial structure\",\"isCorrect\":false,\"feedback\":\"An entrepreneurial structure centres on a single owner-manager.\",\"sortOrder\":2},{\"id\":\"a-bf-org-3-3-392\",\"questionId\":\"bf-org-3\",\"label\":\"A boundaryless structure\",\"isCorrect\":false,\"feedback\":\"That describes networked organisations without rigid internal divisions.\",\"sortOrder\":3}]},{\"id\":\"bf-org-4\",\"topicId\":\"t-btf-org\",\"type\":\"multi\",\"difficulty\":\"medium\",\"stem\":\"According to Mendelow's matrix, stakeholders are mapped against which two dimensions? (Select both.)\",\"explanation\":\"Mendelow's matrix plots stakeholders by their level of power (ability to influence) and level of interest (degree of concern) to determine how they should be managed.\",\"relatedConcepts\":[\"Mendelow's matrix\",\"Stakeholder management\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-org-4-0-393\",\"questionId\":\"bf-org-4\",\"label\":\"Power\",\"isCorrect\":true,\"feedback\":\"Correct — the stakeholder's ability to influence the organisation.\",\"sortOrder\":0},{\"id\":\"a-bf-org-4-1-394\",\"questionId\":\"bf-org-4\",\"label\":\"Interest\",\"isCorrect\":true,\"feedback\":\"Correct — the stakeholder's level of interest in the organisation's actions.\",\"sortOrder\":1},{\"id\":\"a-bf-org-4-2-395\",\"questionId\":\"bf-org-4\",\"label\":\"Profitability\",\"isCorrect\":false,\"feedback\":\"Profitability is not an axis of Mendelow's matrix.\",\"sortOrder\":2},{\"id\":\"a-bf-org-4-3-396\",\"questionId\":\"bf-org-4\",\"label\":\"Liquidity\",\"isCorrect\":false,\"feedback\":\"Liquidity is a financial measure, not a stakeholder dimension.\",\"sortOrder\":3}]},{\"id\":\"bf-org-5\",\"topicId\":\"t-btf-org\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"Which of the following is the most appropriate primary financial objective for a listed company?\",\"explanation\":\"The conventional primary financial objective of a listed company is the maximisation of shareholder wealth, normally expressed through share price and dividends over the long term.\",\"relatedConcepts\":[\"Shareholder wealth maximisation\",\"Financial objectives\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-org-5-0-397\",\"questionId\":\"bf-org-5\",\"label\":\"Maximisation of shareholder wealth\",\"isCorrect\":true,\"feedback\":\"Correct — the conventional primary financial objective of a listed company.\",\"sortOrder\":0},{\"id\":\"a-bf-org-5-1-398\",\"questionId\":\"bf-org-5\",\"label\":\"Maximisation of the number of employees\",\"isCorrect\":false,\"feedback\":\"Headcount is not a financial objective in itself.\",\"sortOrder\":1},{\"id\":\"a-bf-org-5-2-399\",\"questionId\":\"bf-org-5\",\"label\":\"Minimisation of the corporation tax paid each year\",\"isCorrect\":false,\"feedback\":\"Tax efficiency supports, but is not, the primary objective.\",\"sortOrder\":2},{\"id\":\"a-bf-org-5-3-400\",\"questionId\":\"bf-org-5\",\"label\":\"Maximisation of sales revenue regardless of profit\",\"isCorrect\":false,\"feedback\":\"Revenue without regard to profit can destroy shareholder value.\",\"sortOrder\":3}]}],\"t-btf-risk\":[{\"id\":\"bf-risk-1\",\"topicId\":\"t-btf-risk\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"What is the main purpose of a system of internal control within an organisation?\",\"explanation\":\"Internal control helps the organisation achieve its objectives by managing risks — safeguarding assets, ensuring reliable reporting, promoting operational efficiency and ensuring compliance with laws.\",\"relatedConcepts\":[\"Internal control\",\"Risk management\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-risk-1-0-401\",\"questionId\":\"bf-risk-1\",\"label\":\"To help the organisation manage risk and achieve its objectives\",\"isCorrect\":true,\"feedback\":\"Correct — controls safeguard assets, ensure reliable reporting and compliance.\",\"sortOrder\":0},{\"id\":\"a-bf-risk-1-1-402\",\"questionId\":\"bf-risk-1\",\"label\":\"To guarantee that fraud can never occur\",\"isCorrect\":false,\"feedback\":\"Controls reduce, but cannot eliminate, the risk of fraud.\",\"sortOrder\":1},{\"id\":\"a-bf-risk-1-2-403\",\"questionId\":\"bf-risk-1\",\"label\":\"To replace the need for external audit\",\"isCorrect\":false,\"feedback\":\"Internal control complements, but does not replace, external audit.\",\"sortOrder\":2},{\"id\":\"a-bf-risk-1-3-404\",\"questionId\":\"bf-risk-1\",\"label\":\"To maximise the share price directly\",\"isCorrect\":false,\"feedback\":\"Controls support good management but do not directly set the share price.\",\"sortOrder\":3}]},{\"id\":\"bf-risk-2\",\"topicId\":\"t-btf-risk\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"At Orion Ltd, the same employee receives goods, records the purchase, approves the supplier invoice and authorises the payment.\",\"stem\":\"Which key internal control is missing here?\",\"explanation\":\"Segregation of duties means no single individual should control all stages of a transaction. Combining these incompatible duties greatly increases the risk of error and fraud.\",\"relatedConcepts\":[\"Segregation of duties\",\"Control activities\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-risk-2-0-405\",\"questionId\":\"bf-risk-2\",\"label\":\"Segregation of duties\",\"isCorrect\":true,\"feedback\":\"Correct — incompatible duties should be split between different people.\",\"sortOrder\":0},{\"id\":\"a-bf-risk-2-1-406\",\"questionId\":\"bf-risk-2\",\"label\":\"A going concern review\",\"isCorrect\":false,\"feedback\":\"Going concern relates to financial viability, not transaction processing.\",\"sortOrder\":1},{\"id\":\"a-bf-risk-2-2-407\",\"questionId\":\"bf-risk-2\",\"label\":\"A dividend policy\",\"isCorrect\":false,\"feedback\":\"Dividend policy is unrelated to processing purchases.\",\"sortOrder\":2},{\"id\":\"a-bf-risk-2-3-408\",\"questionId\":\"bf-risk-2\",\"label\":\"A rights issue\",\"isCorrect\":false,\"feedback\":\"A rights issue is a source of finance, not a control.\",\"sortOrder\":3}]},{\"id\":\"bf-risk-3\",\"topicId\":\"t-btf-risk\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"Sirius Ltd identifies a risk that is both low likelihood and low impact, and the cost of mitigating it would far exceed any benefit.\",\"stem\":\"Which risk response (TARA framework) is most appropriate?\",\"explanation\":\"For low-likelihood, low-impact risks where mitigation is not cost-effective, the organisation typically accepts (retains) the risk.\",\"relatedConcepts\":[\"TARA framework\",\"Risk response\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-risk-3-0-409\",\"questionId\":\"bf-risk-3\",\"label\":\"Accept (retain) the risk\",\"isCorrect\":true,\"feedback\":\"Correct — low/low risks are usually accepted where mitigation is not cost-effective.\",\"sortOrder\":0},{\"id\":\"a-bf-risk-3-1-410\",\"questionId\":\"bf-risk-3\",\"label\":\"Avoid the activity entirely\",\"isCorrect\":false,\"feedback\":\"Avoidance is for high-impact risks, not minor ones.\",\"sortOrder\":1},{\"id\":\"a-bf-risk-3-2-411\",\"questionId\":\"bf-risk-3\",\"label\":\"Transfer the risk via insurance\",\"isCorrect\":false,\"feedback\":\"Insurance is normally used for higher-impact risks.\",\"sortOrder\":2},{\"id\":\"a-bf-risk-3-3-412\",\"questionId\":\"bf-risk-3\",\"label\":\"Reduce the risk with expensive new controls\",\"isCorrect\":false,\"feedback\":\"Spending more than the benefit is not justified for a low/low risk.\",\"sortOrder\":3}]},{\"id\":\"bf-risk-4\",\"topicId\":\"t-btf-risk\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Why can an internal control system only provide 'reasonable' rather than 'absolute' assurance?\",\"explanation\":\"Inherent limitations — such as human error, management override, collusion and cost-benefit constraints — mean no control system can provide absolute assurance.\",\"relatedConcepts\":[\"Inherent limitations\",\"Reasonable assurance\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-risk-4-0-413\",\"questionId\":\"bf-risk-4\",\"label\":\"Because of inherent limitations such as human error, collusion and management override\",\"isCorrect\":true,\"feedback\":\"Correct — these limitations prevent absolute assurance.\",\"sortOrder\":0},{\"id\":\"a-bf-risk-4-1-414\",\"questionId\":\"bf-risk-4\",\"label\":\"Because controls are illegal beyond a certain level\",\"isCorrect\":false,\"feedback\":\"There is no legal cap on controls; the issue is inherent limitations.\",\"sortOrder\":1},{\"id\":\"a-bf-risk-4-2-415\",\"questionId\":\"bf-risk-4\",\"label\":\"Because auditors forbid strong controls\",\"isCorrect\":false,\"feedback\":\"Auditors encourage effective controls.\",\"sortOrder\":2},{\"id\":\"a-bf-risk-4-3-416\",\"questionId\":\"bf-risk-4\",\"label\":\"Because absolute assurance would breach data protection law\",\"isCorrect\":false,\"feedback\":\"Data protection is unrelated to this limitation.\",\"sortOrder\":3}]},{\"id\":\"bf-risk-5\",\"topicId\":\"t-btf-risk\",\"type\":\"scenario\",\"difficulty\":\"hard\",\"scenario\":\"Vega Ltd has very strong controls over recording transactions, but its single product is becoming obsolete as new technology emerges in the market.\",\"stem\":\"What type of risk does the obsolescence threat primarily represent?\",\"explanation\":\"Strategic (business) risk concerns the organisation's long-term direction and ability to compete — here, the threat of its product becoming obsolete. It is distinct from operational or financial reporting risk.\",\"relatedConcepts\":[\"Strategic risk\",\"Business risk\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-risk-5-0-417\",\"questionId\":\"bf-risk-5\",\"label\":\"Strategic (business) risk\",\"isCorrect\":true,\"feedback\":\"Correct — it threatens the organisation's long-term competitive position.\",\"sortOrder\":0},{\"id\":\"a-bf-risk-5-1-418\",\"questionId\":\"bf-risk-5\",\"label\":\"Financial reporting risk\",\"isCorrect\":false,\"feedback\":\"Reporting risk concerns errors in the accounts, which their controls address well.\",\"sortOrder\":1},{\"id\":\"a-bf-risk-5-2-419\",\"questionId\":\"bf-risk-5\",\"label\":\"Operational processing risk\",\"isCorrect\":false,\"feedback\":\"Their transaction controls are strong; this is about market position.\",\"sortOrder\":2},{\"id\":\"a-bf-risk-5-3-420\",\"questionId\":\"bf-risk-5\",\"label\":\"Compliance risk\",\"isCorrect\":false,\"feedback\":\"Compliance risk relates to breaching laws or regulations, not obsolescence.\",\"sortOrder\":3}]}],\"t-btf-tech\":[{\"id\":\"bf-tech-1\",\"topicId\":\"t-btf-tech\",\"type\":\"multi\",\"difficulty\":\"medium\",\"stem\":\"Information security is often described using the 'CIA' triad. Which three objectives does it cover? (Select all three.)\",\"explanation\":\"The CIA triad stands for Confidentiality, Integrity and Availability — the three core objectives of information security.\",\"relatedConcepts\":[\"CIA triad\",\"Information security\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-tech-1-0-421\",\"questionId\":\"bf-tech-1\",\"label\":\"Confidentiality\",\"isCorrect\":true,\"feedback\":\"Correct — information is accessible only to those authorised.\",\"sortOrder\":0},{\"id\":\"a-bf-tech-1-1-422\",\"questionId\":\"bf-tech-1\",\"label\":\"Integrity\",\"isCorrect\":true,\"feedback\":\"Correct — information is accurate, complete and not improperly altered.\",\"sortOrder\":1},{\"id\":\"a-bf-tech-1-2-423\",\"questionId\":\"bf-tech-1\",\"label\":\"Availability\",\"isCorrect\":true,\"feedback\":\"Correct — information is accessible when needed by authorised users.\",\"sortOrder\":2},{\"id\":\"a-bf-tech-1-3-424\",\"questionId\":\"bf-tech-1\",\"label\":\"Accountability\",\"isCorrect\":false,\"feedback\":\"Useful in security, but not one of the three CIA elements.\",\"sortOrder\":3}]},{\"id\":\"bf-tech-2\",\"topicId\":\"t-btf-tech\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"An employee at Helix Ltd receives an email appearing to be from the bank, asking them to click a link and confirm login credentials. The email is fraudulent.\",\"stem\":\"What type of cyber threat is this?\",\"explanation\":\"Phishing is a social-engineering attack that uses fraudulent communications (often email) to trick recipients into revealing sensitive information such as credentials.\",\"relatedConcepts\":[\"Phishing\",\"Social engineering\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-tech-2-0-425\",\"questionId\":\"bf-tech-2\",\"label\":\"Phishing\",\"isCorrect\":true,\"feedback\":\"Correct — a fraudulent message designed to extract sensitive information.\",\"sortOrder\":0},{\"id\":\"a-bf-tech-2-1-426\",\"questionId\":\"bf-tech-2\",\"label\":\"A denial-of-service attack\",\"isCorrect\":false,\"feedback\":\"A DoS attack overwhelms a system; it does not solicit credentials.\",\"sortOrder\":1},{\"id\":\"a-bf-tech-2-2-427\",\"questionId\":\"bf-tech-2\",\"label\":\"A SQL injection\",\"isCorrect\":false,\"feedback\":\"SQL injection attacks a database via input fields, not via deceptive emails.\",\"sortOrder\":2},{\"id\":\"a-bf-tech-2-3-428\",\"questionId\":\"bf-tech-2\",\"label\":\"A hardware failure\",\"isCorrect\":false,\"feedback\":\"This is a deliberate attack, not an equipment fault.\",\"sortOrder\":3}]},{\"id\":\"bf-tech-3\",\"topicId\":\"t-btf-tech\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Which of the following best describes 'cloud computing'?\",\"explanation\":\"Cloud computing is the delivery of computing services (e.g. storage, servers, software) over the internet, typically on a scalable, pay-as-you-go basis, rather than from local on-premise hardware.\",\"relatedConcepts\":[\"Cloud computing\",\"Scalability\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-tech-3-0-429\",\"questionId\":\"bf-tech-3\",\"label\":\"Delivery of computing services over the internet on a scalable, on-demand basis\",\"isCorrect\":true,\"feedback\":\"Correct — services are accessed remotely, often pay-as-you-go.\",\"sortOrder\":0},{\"id\":\"a-bf-tech-3-1-430\",\"questionId\":\"bf-tech-3\",\"label\":\"Storing all data only on a single local hard drive\",\"isCorrect\":false,\"feedback\":\"That is local on-premise storage, the opposite of the cloud.\",\"sortOrder\":1},{\"id\":\"a-bf-tech-3-2-431\",\"questionId\":\"bf-tech-3\",\"label\":\"A type of weather-forecasting software\",\"isCorrect\":false,\"feedback\":\"The term is unrelated to meteorology.\",\"sortOrder\":2},{\"id\":\"a-bf-tech-3-3-432\",\"questionId\":\"bf-tech-3\",\"label\":\"A method of paying dividends to shareholders\",\"isCorrect\":false,\"feedback\":\"Cloud computing is a technology, not a finance method.\",\"sortOrder\":3}]},{\"id\":\"bf-tech-4\",\"topicId\":\"t-btf-tech\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"What does 'big data' analysis typically allow a business to do?\",\"explanation\":\"Big data analytics extracts insights and patterns from very large, varied and fast-moving data sets, supporting better decision-making, e.g. understanding customer behaviour.\",\"relatedConcepts\":[\"Big data\",\"Data analytics\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-tech-4-0-433\",\"questionId\":\"bf-tech-4\",\"label\":\"Identify patterns and insights from very large, varied data sets to support decisions\",\"isCorrect\":true,\"feedback\":\"Correct — the value of big data lies in the insights derived from it.\",\"sortOrder\":0},{\"id\":\"a-bf-tech-4-1-434\",\"questionId\":\"bf-tech-4\",\"label\":\"Guarantee that all business decisions will be correct\",\"isCorrect\":false,\"feedback\":\"Analytics informs decisions but offers no guarantee of correctness.\",\"sortOrder\":1},{\"id\":\"a-bf-tech-4-2-435\",\"questionId\":\"bf-tech-4\",\"label\":\"Eliminate the need for any data security\",\"isCorrect\":false,\"feedback\":\"Larger data sets increase, not remove, security needs.\",\"sortOrder\":2},{\"id\":\"a-bf-tech-4-3-436\",\"questionId\":\"bf-tech-4\",\"label\":\"Replace the requirement to prepare financial statements\",\"isCorrect\":false,\"feedback\":\"Statutory reporting obligations remain regardless of analytics.\",\"sortOrder\":3}]},{\"id\":\"bf-tech-5\",\"topicId\":\"t-btf-tech\",\"type\":\"scenario\",\"difficulty\":\"easy\",\"scenario\":\"Aurora Ltd holds personal data about its UK customers and must comply with data protection law.\",\"stem\":\"Which of the following is a core principle of data protection that Aurora must follow?\",\"explanation\":\"Data protection principles require personal data to be processed lawfully, fairly and transparently, collected for specified purposes, kept accurate, and held securely and no longer than necessary.\",\"relatedConcepts\":[\"Data protection\",\"Personal data\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-tech-5-0-437\",\"questionId\":\"bf-tech-5\",\"label\":\"Personal data must be processed lawfully, fairly and transparently\",\"isCorrect\":true,\"feedback\":\"Correct — a core data protection principle.\",\"sortOrder\":0},{\"id\":\"a-bf-tech-5-1-438\",\"questionId\":\"bf-tech-5\",\"label\":\"Personal data may be sold to any third party without restriction\",\"isCorrect\":false,\"feedback\":\"This breaches lawful and fair processing requirements.\",\"sortOrder\":1},{\"id\":\"a-bf-tech-5-2-439\",\"questionId\":\"bf-tech-5\",\"label\":\"Personal data must be kept forever once collected\",\"isCorrect\":false,\"feedback\":\"Data should be kept no longer than necessary.\",\"sortOrder\":2},{\"id\":\"a-bf-tech-5-3-440\",\"questionId\":\"bf-tech-5\",\"label\":\"Personal data need not be kept secure\",\"isCorrect\":false,\"feedback\":\"Security of personal data is a key principle.\",\"sortOrder\":3}]}],\"t-btf-prof\":[{\"id\":\"bf-prof-1\",\"topicId\":\"t-btf-prof\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"Which task is primarily the responsibility of the management accounting (rather than financial accounting) part of the finance function?\",\"explanation\":\"Management accounting produces internal, forward-looking information such as budgets and forecasts to support planning and control, whereas financial accounting produces external statutory statements.\",\"relatedConcepts\":[\"Management accounting\",\"Finance function\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-prof-1-0-441\",\"questionId\":\"bf-prof-1\",\"label\":\"Preparing budgets and forecasts for internal decision-making\",\"isCorrect\":true,\"feedback\":\"Correct — management accounting is internal and forward-looking.\",\"sortOrder\":0},{\"id\":\"a-bf-prof-1-1-442\",\"questionId\":\"bf-prof-1\",\"label\":\"Filing statutory financial statements with Companies House\",\"isCorrect\":false,\"feedback\":\"That is a financial (statutory) reporting task.\",\"sortOrder\":1},{\"id\":\"a-bf-prof-1-2-443\",\"questionId\":\"bf-prof-1\",\"label\":\"Conducting the external audit\",\"isCorrect\":false,\"feedback\":\"The external audit is performed by an independent auditor.\",\"sortOrder\":2},{\"id\":\"a-bf-prof-1-3-444\",\"questionId\":\"bf-prof-1\",\"label\":\"Setting the corporation tax rates\",\"isCorrect\":false,\"feedback\":\"Tax rates are set by government, not the finance function.\",\"sortOrder\":3}]},{\"id\":\"bf-prof-2\",\"topicId\":\"t-btf-prof\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"What is the primary purpose of the external audit of a company's financial statements?\",\"explanation\":\"The external audit provides an independent opinion on whether the financial statements give a true and fair view and are prepared in accordance with the applicable framework — it adds credibility for users.\",\"relatedConcepts\":[\"External audit\",\"True and fair view\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-prof-2-0-445\",\"questionId\":\"bf-prof-2\",\"label\":\"To give an independent opinion on whether the statements give a true and fair view\",\"isCorrect\":true,\"feedback\":\"Correct — the audit adds credibility to the financial statements.\",\"sortOrder\":0},{\"id\":\"a-bf-prof-2-1-446\",\"questionId\":\"bf-prof-2\",\"label\":\"To guarantee the company will not fail\",\"isCorrect\":false,\"feedback\":\"An audit gives no guarantee of future survival.\",\"sortOrder\":1},{\"id\":\"a-bf-prof-2-2-447\",\"questionId\":\"bf-prof-2\",\"label\":\"To prepare the financial statements on behalf of the directors\",\"isCorrect\":false,\"feedback\":\"Preparation is the directors' responsibility, not the auditor's.\",\"sortOrder\":2},{\"id\":\"a-bf-prof-2-3-448\",\"questionId\":\"bf-prof-2\",\"label\":\"To detect every instance of fraud, however small\",\"isCorrect\":false,\"feedback\":\"An audit is not designed to find all fraud.\",\"sortOrder\":3}]},{\"id\":\"bf-prof-3\",\"topicId\":\"t-btf-prof\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"In the accountancy profession, what does acting 'in the public interest' mean?\",\"explanation\":\"A distinguishing mark of the accountancy profession is acceptance of a responsibility to act in the public interest — the collective wellbeing of those the profession serves — not merely to satisfy an individual client or employer.\",\"relatedConcepts\":[\"Public interest\",\"Professionalism\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-prof-3-0-449\",\"questionId\":\"bf-prof-3\",\"label\":\"Considering the wider community the profession serves, not just a single client or employer\",\"isCorrect\":true,\"feedback\":\"Correct — the profession's responsibility extends beyond the immediate client.\",\"sortOrder\":0},{\"id\":\"a-bf-prof-3-1-450\",\"questionId\":\"bf-prof-3\",\"label\":\"Always doing whatever the paying client demands\",\"isCorrect\":false,\"feedback\":\"Acting only in a client's interest can conflict with the public interest.\",\"sortOrder\":1},{\"id\":\"a-bf-prof-3-2-451\",\"questionId\":\"bf-prof-3\",\"label\":\"Maximising the accountant's own fee income\",\"isCorrect\":false,\"feedback\":\"Self-interest is the opposite of the public interest.\",\"sortOrder\":2},{\"id\":\"a-bf-prof-3-3-452\",\"questionId\":\"bf-prof-3\",\"label\":\"Publishing all client information freely\",\"isCorrect\":false,\"feedback\":\"This would breach confidentiality.\",\"sortOrder\":3}]},{\"id\":\"bf-prof-4\",\"topicId\":\"t-btf-prof\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"A client offers an ICAEW Chartered Accountant a fee that depends entirely on achieving a specified (favourable) audit outcome.\",\"stem\":\"Which fundamental ethical principle is most directly threatened, and why?\",\"explanation\":\"A contingent fee linked to the audit outcome creates a self-interest threat that undermines objectivity, as the accountant has a financial incentive to reach a particular conclusion.\",\"relatedConcepts\":[\"Objectivity\",\"Self-interest threat\",\"Contingent fees\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-prof-4-0-453\",\"questionId\":\"bf-prof-4\",\"label\":\"Objectivity — the contingent fee creates a self-interest threat to impartial judgement\",\"isCorrect\":true,\"feedback\":\"Correct — a financial stake in the outcome compromises objectivity.\",\"sortOrder\":0},{\"id\":\"a-bf-prof-4-1-454\",\"questionId\":\"bf-prof-4\",\"label\":\"Confidentiality — because the fee reveals client information\",\"isCorrect\":false,\"feedback\":\"The issue is bias from the fee, not disclosure of information.\",\"sortOrder\":1},{\"id\":\"a-bf-prof-4-2-455\",\"questionId\":\"bf-prof-4\",\"label\":\"Professional competence — because the fee affects the accountant's skills\",\"isCorrect\":false,\"feedback\":\"A fee arrangement does not change the accountant's competence.\",\"sortOrder\":2},{\"id\":\"a-bf-prof-4-3-456\",\"questionId\":\"bf-prof-4\",\"label\":\"Integrity — because contingent fees are always dishonest\",\"isCorrect\":false,\"feedback\":\"The principal threat here is to objectivity, not honesty.\",\"sortOrder\":3}]},{\"id\":\"bf-prof-5\",\"topicId\":\"t-btf-prof\",\"type\":\"multi\",\"difficulty\":\"medium\",\"stem\":\"Which of the following are typically functions or sub-functions of a company's finance function? (Select all that apply.)\",\"explanation\":\"The finance function commonly includes financial accounting/reporting, management accounting, treasury (cash and funding) and the internal audit/assurance activity. Marketing a product is not a finance-function role.\",\"relatedConcepts\":[\"Finance function\",\"Treasury\",\"Internal audit\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-bf-prof-5-0-457\",\"questionId\":\"bf-prof-5\",\"label\":\"Treasury management (cash, funding and risk)\",\"isCorrect\":true,\"feedback\":\"Correct — treasury manages cash, financing and financial risk.\",\"sortOrder\":0},{\"id\":\"a-bf-prof-5-1-458\",\"questionId\":\"bf-prof-5\",\"label\":\"Management accounting (planning and control information)\",\"isCorrect\":true,\"feedback\":\"Correct — provides internal information for decision-making.\",\"sortOrder\":1},{\"id\":\"a-bf-prof-5-2-459\",\"questionId\":\"bf-prof-5\",\"label\":\"Designing and running the company's advertising campaigns\",\"isCorrect\":false,\"feedback\":\"Advertising is a marketing function, not finance.\",\"sortOrder\":2},{\"id\":\"a-bf-prof-5-3-460\",\"questionId\":\"bf-prof-5\",\"label\":\"Internal audit / assurance\",\"isCorrect\":true,\"feedback\":\"Correct — internal audit reviews controls and risk management.\",\"sortOrder\":3}]}],\"t-law-con\":[{\"id\":\"q-law-1\",\"topicId\":\"t-law-con\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"Which of these is NOT an essential element for a valid simple contract?\",\"explanation\":\"Offer, acceptance, consideration and intention to create legal relations are essential. Writing is generally not required for a simple contract.\",\"relatedConcepts\":[\"Contract formation\",\"Consideration\"],\"rating\":1050,\"estSeconds\":60,\"isPublished\":true,\"answers\":[{\"id\":\"a-q-law-1-0-24\",\"questionId\":\"q-law-1\",\"label\":\"The contract must be in writing\",\"isCorrect\":true,\"feedback\":\"Correct — most simple contracts need not be written.\",\"sortOrder\":0},{\"id\":\"a-q-law-1-1-25\",\"questionId\":\"q-law-1\",\"label\":\"Offer and acceptance\",\"isCorrect\":false,\"feedback\":\"This is essential.\",\"sortOrder\":1},{\"id\":\"a-q-law-1-2-26\",\"questionId\":\"q-law-1\",\"label\":\"Consideration\",\"isCorrect\":false,\"feedback\":\"This is essential.\",\"sortOrder\":2},{\"id\":\"a-q-law-1-3-27\",\"questionId\":\"q-law-1\",\"label\":\"Intention to create legal relations\",\"isCorrect\":false,\"feedback\":\"This is essential.\",\"sortOrder\":3}]},{\"id\":\"x-law-con-1\",\"topicId\":\"t-law-con\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Goods are displayed in a shop window with a price tag. In contract law this display is generally:\",\"explanation\":\"A display of goods is an invitation to treat, not an offer. The customer makes the offer at the till, which the retailer may accept or reject.\",\"relatedConcepts\":[\"Invitation to treat\",\"Offer and acceptance\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-x-law-con-1-0-40\",\"questionId\":\"x-law-con-1\",\"label\":\"An invitation to treat\",\"isCorrect\":true,\"feedback\":\"Correct — the customer makes the offer; the shop accepts it.\",\"sortOrder\":0},{\"id\":\"a-x-law-con-1-1-41\",\"questionId\":\"x-law-con-1\",\"label\":\"A firm offer the shop must honour\",\"isCorrect\":false,\"feedback\":\"A display is not an offer.\",\"sortOrder\":1},{\"id\":\"a-x-law-con-1-2-42\",\"questionId\":\"x-law-con-1\",\"label\":\"Acceptance of an offer\",\"isCorrect\":false,\"feedback\":\"No offer has yet been made.\",\"sortOrder\":2},{\"id\":\"a-x-law-con-1-3-43\",\"questionId\":\"x-law-con-1\",\"label\":\"A binding contract\",\"isCorrect\":false,\"feedback\":\"No contract exists until offer and acceptance.\",\"sortOrder\":3}]},{\"id\":\"x-law-con-2\",\"topicId\":\"t-law-con\",\"type\":\"mcq\",\"difficulty\":\"hard\",\"stem\":\"Which statement about consideration is correct?\",\"explanation\":\"Consideration must be sufficient (have some value in the eyes of the law) but need not be adequate (need not match the value of what is received). Past consideration is generally not valid.\",\"relatedConcepts\":[\"Consideration\",\"Contract formation\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-x-law-con-2-0-44\",\"questionId\":\"x-law-con-2\",\"label\":\"Consideration must be sufficient but need not be adequate\",\"isCorrect\":true,\"feedback\":\"Correct — courts do not assess whether the bargain is fair.\",\"sortOrder\":0},{\"id\":\"a-x-law-con-2-1-45\",\"questionId\":\"x-law-con-2\",\"label\":\"Consideration must always equal the market value exchanged\",\"isCorrect\":false,\"feedback\":\"Adequacy is not required.\",\"sortOrder\":1},{\"id\":\"a-x-law-con-2-2-46\",\"questionId\":\"x-law-con-2\",\"label\":\"Past consideration is always valid\",\"isCorrect\":false,\"feedback\":\"Past consideration is generally not good consideration.\",\"sortOrder\":2},{\"id\":\"a-x-law-con-2-3-47\",\"questionId\":\"x-law-con-2\",\"label\":\"Consideration is not required for a simple contract\",\"isCorrect\":false,\"feedback\":\"It is an essential element of a simple contract.\",\"sortOrder\":3}]},{\"id\":\"lw-con-1\",\"topicId\":\"t-law-con\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"scenario\":\"A shop displays a coat in its window marked '£40'. A customer takes it to the till and offers to buy it.\",\"stem\":\"In contract law, what is the legal status of the priced display in the window?\",\"explanation\":\"A display of goods with a price is an invitation to treat, not an offer (Fisher v Bell; Pharmaceutical Society v Boots). The customer makes the offer at the till, which the shop may accept or reject.\",\"relatedConcepts\":[\"Invitation to treat\",\"Offer and acceptance\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-con-1-0-461\",\"questionId\":\"lw-con-1\",\"label\":\"An invitation to treat\",\"isCorrect\":true,\"feedback\":\"Correct — the display merely invites customers to make offers (Fisher v Bell).\",\"sortOrder\":0},{\"id\":\"a-lw-con-1-1-462\",\"questionId\":\"lw-con-1\",\"label\":\"A binding offer the shop must honour\",\"isCorrect\":false,\"feedback\":\"A priced display is an invitation to treat, not an offer; the shop need not sell.\",\"sortOrder\":1},{\"id\":\"a-lw-con-1-2-463\",\"questionId\":\"lw-con-1\",\"label\":\"An acceptance of the customer's offer\",\"isCorrect\":false,\"feedback\":\"The customer has not yet made any offer when the goods are displayed.\",\"sortOrder\":2},{\"id\":\"a-lw-con-1-3-464\",\"questionId\":\"lw-con-1\",\"label\":\"A unilateral contract\",\"isCorrect\":false,\"feedback\":\"No promise in return for an act has been made; this is simply an invitation to treat.\",\"sortOrder\":3}]},{\"id\":\"lw-con-2\",\"topicId\":\"t-law-con\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"A company advertised that it would pay £100 to anyone who used its smoke ball as directed and still caught influenza, stating it had deposited £1,000 with its bank to show sincerity. A customer used it correctly and fell ill.\",\"stem\":\"On these facts (mirroring Carlill v Carbolic Smoke Ball Co), can the customer recover the £100?\",\"explanation\":\"Carlill v Carbolic Smoke Ball Co established that an advertisement can be a unilateral offer to the world, accepted by performing the stipulated act; the deposit showed intention to be bound, and using the product as directed was good consideration.\",\"relatedConcepts\":[\"Unilateral offer\",\"Carlill v Carbolic Smoke Ball Co\",\"Intention to create legal relations\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-con-2-0-465\",\"questionId\":\"lw-con-2\",\"label\":\"Yes — the advertisement was a unilateral offer accepted by performance\",\"isCorrect\":true,\"feedback\":\"Correct — this is the rule in Carlill v Carbolic Smoke Ball Co.\",\"sortOrder\":0},{\"id\":\"a-lw-con-2-1-466\",\"questionId\":\"lw-con-2\",\"label\":\"No — an advertisement can never be an offer\",\"isCorrect\":false,\"feedback\":\"An advertisement can be a unilateral offer where it shows intention to be bound (Carlill).\",\"sortOrder\":1},{\"id\":\"a-lw-con-2-2-467\",\"questionId\":\"lw-con-2\",\"label\":\"No — the customer never communicated acceptance to the company\",\"isCorrect\":false,\"feedback\":\"In a unilateral offer, performing the act is acceptance; prior communication is not required.\",\"sortOrder\":2},{\"id\":\"a-lw-con-2-3-468\",\"questionId\":\"lw-con-2\",\"label\":\"No — there was no consideration from the customer\",\"isCorrect\":false,\"feedback\":\"Using the smoke ball as directed was good consideration.\",\"sortOrder\":3}]},{\"id\":\"lw-con-3\",\"topicId\":\"t-law-con\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Which statement best describes the rule that consideration must be sufficient but need not be adequate?\",\"explanation\":\"Consideration must have some recognisable value in the eyes of the law (sufficient), but the courts will not investigate whether the bargain was a fair or equal exchange (need not be adequate) — Chappell v Nestlé; Thomas v Thomas.\",\"relatedConcepts\":[\"Consideration\",\"Sufficiency vs adequacy\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-con-3-0-469\",\"questionId\":\"lw-con-3\",\"label\":\"Consideration must have some legal value, but the court will not assess whether it is a fair exchange\",\"isCorrect\":true,\"feedback\":\"Correct — sufficiency requires legal value; adequacy (fair value) is irrelevant.\",\"sortOrder\":0},{\"id\":\"a-lw-con-3-1-470\",\"questionId\":\"lw-con-3\",\"label\":\"Consideration must always be of equal market value to the promise it supports\",\"isCorrect\":false,\"feedback\":\"The court does not require adequacy; an unequal bargain is still binding.\",\"sortOrder\":1},{\"id\":\"a-lw-con-3-2-471\",\"questionId\":\"lw-con-3\",\"label\":\"Consideration is only valid if it is monetary\",\"isCorrect\":false,\"feedback\":\"Consideration may be an act, forbearance or promise — not only money.\",\"sortOrder\":2},{\"id\":\"a-lw-con-3-3-472\",\"questionId\":\"lw-con-3\",\"label\":\"Past consideration is always sufficient\",\"isCorrect\":false,\"feedback\":\"As a general rule, past consideration is no consideration (Re McArdle).\",\"sortOrder\":3}]},{\"id\":\"lw-con-4\",\"topicId\":\"t-law-con\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"A term that is so important that any breach goes to the root of the contract, entitling the innocent party to terminate and claim damages, is known as:\",\"explanation\":\"A condition is a major term going to the root of the contract; its breach allows termination and damages. A warranty is a minor term giving rise only to damages. An innominate term is judged by the seriousness of the actual consequences of breach.\",\"relatedConcepts\":[\"Conditions\",\"Warranties\",\"Innominate terms\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-con-4-0-473\",\"questionId\":\"lw-con-4\",\"label\":\"A condition\",\"isCorrect\":true,\"feedback\":\"Correct — breach of a condition allows the innocent party to terminate and claim damages.\",\"sortOrder\":0},{\"id\":\"a-lw-con-4-1-474\",\"questionId\":\"lw-con-4\",\"label\":\"A warranty\",\"isCorrect\":false,\"feedback\":\"Breach of a warranty gives a right to damages only, not termination.\",\"sortOrder\":1},{\"id\":\"a-lw-con-4-2-475\",\"questionId\":\"lw-con-4\",\"label\":\"A representation\",\"isCorrect\":false,\"feedback\":\"A representation is a pre-contractual statement, not a term.\",\"sortOrder\":2},{\"id\":\"a-lw-con-4-3-476\",\"questionId\":\"lw-con-4\",\"label\":\"An exclusion clause\",\"isCorrect\":false,\"feedback\":\"An exclusion clause limits or excludes liability; it is not a category of importance of a term.\",\"sortOrder\":3}]},{\"id\":\"lw-con-5\",\"topicId\":\"t-law-con\",\"type\":\"multi\",\"difficulty\":\"hard\",\"scenario\":\"A buyer is in breach of contract. The seller is considering what losses it may recover as damages.\",\"stem\":\"Which TWO statements correctly reflect the rules on damages for breach of contract?\",\"explanation\":\"Damages aim to put the claimant in the position as if the contract had been performed (expectation interest). Losses are recoverable only if not too remote — i.e. arising naturally or within the parties' reasonable contemplation (Hadley v Baxendale). The claimant must also mitigate its loss.\",\"relatedConcepts\":[\"Remoteness\",\"Hadley v Baxendale\",\"Mitigation\",\"Expectation interest\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-con-5-0-477\",\"questionId\":\"lw-con-5\",\"label\":\"Damages aim to put the innocent party in the position as if the contract had been performed\",\"isCorrect\":true,\"feedback\":\"Correct — this is the expectation (loss of bargain) measure.\",\"sortOrder\":0},{\"id\":\"a-lw-con-5-1-478\",\"questionId\":\"lw-con-5\",\"label\":\"Losses too remote (not in the parties' reasonable contemplation) are not recoverable\",\"isCorrect\":true,\"feedback\":\"Correct — the remoteness test from Hadley v Baxendale.\",\"sortOrder\":1},{\"id\":\"a-lw-con-5-2-479\",\"questionId\":\"lw-con-5\",\"label\":\"The innocent party may recover all losses regardless of remoteness\",\"isCorrect\":false,\"feedback\":\"Remote losses are not recoverable; the Hadley v Baxendale limbs apply.\",\"sortOrder\":2},{\"id\":\"a-lw-con-5-3-480\",\"questionId\":\"lw-con-5\",\"label\":\"The innocent party has no duty to take steps to reduce its loss\",\"isCorrect\":false,\"feedback\":\"There is a duty to mitigate; unmitigated losses are not recoverable.\",\"sortOrder\":3}]},{\"id\":\"lw-con-6\",\"topicId\":\"t-law-con\",\"type\":\"scenario\",\"difficulty\":\"easy\",\"scenario\":\"A offers to sell his car to B for £5,000. B replies, 'I'll give you £4,500.' A refuses. B then says, 'Fine, I accept your original £5,000.'\",\"stem\":\"Is there a binding contract at £5,000?\",\"explanation\":\"A counter-offer destroys the original offer (Hyde v Wrench). Once B made the counter-offer of £4,500, A's original offer was extinguished and could not later be accepted unless A renewed it.\",\"relatedConcepts\":[\"Counter-offer\",\"Hyde v Wrench\",\"Termination of offer\"],\"rating\":1050,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-con-6-0-481\",\"questionId\":\"lw-con-6\",\"label\":\"No — B's counter-offer of £4,500 destroyed the original offer, which could not then be accepted\",\"isCorrect\":true,\"feedback\":\"Correct — a counter-offer terminates the original offer (Hyde v Wrench).\",\"sortOrder\":0},{\"id\":\"a-lw-con-6-1-482\",\"questionId\":\"lw-con-6\",\"label\":\"Yes — the original offer remained open for B to accept at any time\",\"isCorrect\":false,\"feedback\":\"A counter-offer destroys the original offer; it was no longer available.\",\"sortOrder\":1},{\"id\":\"a-lw-con-6-2-483\",\"questionId\":\"lw-con-6\",\"label\":\"Yes — B's request for a lower price was merely a request for information\",\"isCorrect\":false,\"feedback\":\"Proposing a different price is a counter-offer, not a mere inquiry.\",\"sortOrder\":2},{\"id\":\"a-lw-con-6-3-484\",\"questionId\":\"lw-con-6\",\"label\":\"No — because there was no consideration\",\"isCorrect\":false,\"feedback\":\"The issue is the counter-offer destroying the offer, not absence of consideration.\",\"sortOrder\":3}]}],\"t-law-co\":[{\"id\":\"x-law-co-1\",\"topicId\":\"t-law-co\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"The principle that a company is a legal person separate from its members was established in which leading case?\",\"explanation\":\"Salomon v A Salomon \u0026 Co Ltd established separate legal personality — the 'corporate veil'.\",\"relatedConcepts\":[\"Separate legal personality\",\"Corporate veil\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-x-law-co-1-0-48\",\"questionId\":\"x-law-co-1\",\"label\":\"Salomon v A Salomon \u0026 Co Ltd\",\"isCorrect\":true,\"feedback\":\"Correct — the foundational case on separate legal personality.\",\"sortOrder\":0},{\"id\":\"a-x-law-co-1-1-49\",\"questionId\":\"x-law-co-1\",\"label\":\"Donoghue v Stevenson\",\"isCorrect\":false,\"feedback\":\"That concerns the tort of negligence.\",\"sortOrder\":1},{\"id\":\"a-x-law-co-1-2-50\",\"questionId\":\"x-law-co-1\",\"label\":\"Carlill v Carbolic Smoke Ball Co\",\"isCorrect\":false,\"feedback\":\"That concerns offer and acceptance (unilateral contracts).\",\"sortOrder\":2},{\"id\":\"a-x-law-co-1-3-51\",\"questionId\":\"x-law-co-1\",\"label\":\"Hadley v Baxendale\",\"isCorrect\":false,\"feedback\":\"That concerns remoteness of damage in contract.\",\"sortOrder\":3}]},{\"id\":\"x-law-co-2\",\"topicId\":\"t-law-co\",\"type\":\"multi\",\"difficulty\":\"hard\",\"stem\":\"Under the Companies Act 2006, which of the following are statutory duties of a director? Select all that apply.\",\"explanation\":\"CA 2006 codified directors' duties (ss171–177), including to act within powers, to promote the success of the company, and to exercise reasonable care, skill and diligence.\",\"relatedConcepts\":[\"Directors' duties\",\"Companies Act 2006\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-x-law-co-2-0-52\",\"questionId\":\"x-law-co-2\",\"label\":\"To promote the success of the company\",\"isCorrect\":true,\"feedback\":\"Correct — s172.\",\"sortOrder\":0},{\"id\":\"a-x-law-co-2-1-53\",\"questionId\":\"x-law-co-2\",\"label\":\"To exercise reasonable care, skill and diligence\",\"isCorrect\":true,\"feedback\":\"Correct — s174.\",\"sortOrder\":1},{\"id\":\"a-x-law-co-2-2-54\",\"questionId\":\"x-law-co-2\",\"label\":\"To avoid conflicts of interest\",\"isCorrect\":true,\"feedback\":\"Correct — s175.\",\"sortOrder\":2},{\"id\":\"a-x-law-co-2-3-55\",\"questionId\":\"x-law-co-2\",\"label\":\"To personally guarantee all company debts\",\"isCorrect\":false,\"feedback\":\"Separate legal personality means directors are not generally liable for company debts.\",\"sortOrder\":3}]},{\"id\":\"lw-co-1\",\"topicId\":\"t-law-co\",\"type\":\"scenario\",\"difficulty\":\"medium\",\"scenario\":\"Mr S transferred his sole-trader business to a company in which he held almost all the shares and was the principal creditor (secured by debentures). When the company failed, unsecured creditors argued the company was a sham and Mr S should be personally liable.\",\"stem\":\"On these facts (mirroring Salomon v Salomon \u0026 Co Ltd), what is the legal position?\",\"explanation\":\"Salomon v Salomon \u0026 Co Ltd established that a properly incorporated company is a separate legal person, distinct from its members. Mr S was not personally liable for the company's debts, and his secured debentures ranked ahead of unsecured creditors.\",\"relatedConcepts\":[\"Separate legal personality\",\"Salomon v Salomon\",\"Limited liability\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-lw-co-1-0-485\",\"questionId\":\"lw-co-1\",\"label\":\"The company is a separate legal person; Mr S is not personally liable for its debts\",\"isCorrect\":true,\"feedback\":\"Correct — the core principle of Salomon v Salomon \u0026 Co Ltd.\",\"sortOrder\":0},{\"id\":\"a-lw-co-1-1-486\",\"questionId\":\"lw-co-1\",\"label\":\"Mr S is personally liable because he owned almost all the shares\",\"isCorrect\":false,\"feedback\":\"Owning most shares does not displace separate l
