lative stand-alone selling prices: £900 to the licence (recognised at the point control transfers) and £300 to support (recognised over the 12 months).\",\"workedSolution\":\"Licence: 1,200 × 900/1,200 = £900 at a point in time.\\nSupport: 1,200 × 300/1,200 = £300 over 12 months (£25/month).\",\"relatedConcepts\":[\"Performance obligations\",\"Transaction price allocation\"],\"rating\":1400,\"estSeconds\":60,\"isPublished\":true,\"answers\":[{\"id\":\"a-q-far-1-0-8\",\"questionId\":\"q-far-1\",\"label\":\"There are two performance obligations\",\"isCorrect\":true,\"feedback\":\"Correct — the licence and support are distinct.\",\"sortOrder\":0},{\"id\":\"a-q-far-1-1-9\",\"questionId\":\"q-far-1\",\"label\":\"£900 is recognised when the licence is transferred\",\"isCorrect\":true,\"feedback\":\"Correct — licence revenue is point-in-time.\",\"sortOrder\":1},{\"id\":\"a-q-far-1-2-10\",\"questionId\":\"q-far-1\",\"label\":\"All £1,200 is recognised immediately\",\"isCorrect\":false,\"feedback\":\"No — support is recognised over time.\",\"sortOrder\":2},{\"id\":\"a-q-far-1-3-11\",\"questionId\":\"q-far-1\",\"label\":\"£300 is recognised evenly over 12 months\",\"isCorrect\":true,\"feedback\":\"Correct — £25 per month for the support obligation.\",\"sortOrder\":3}]},{\"id\":\"x-far-rev-1\",\"topicId\":\"t-far-rev\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"What is the correct order of the IFRS 15 five-step revenue model?\",\"explanation\":\"1) Identify the contract; 2) identify performance obligations; 3) determine the transaction price; 4) allocate it to the obligations; 5) recognise revenue as/when obligations are satisfied.\",\"relatedConcepts\":[\"IFRS 15\",\"Five-step model\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-x-far-rev-1-0-88\",\"questionId\":\"x-far-rev-1\",\"label\":\"Contract → obligations → price → allocate → recognise\",\"isCorrect\":true,\"feedback\":\"Correct — the IFRS 15 sequence.\",\"sortOrder\":0},{\"id\":\"a-x-far-rev-1-1-89\",\"questionId\":\"x-far-rev-1\",\"label\":\"Price → contract → recognise → obligations → allocate\",\"isCorrect\":false,\"feedback\":\"Incorrect order.\",\"sortOrder\":1},{\"id\":\"a-x-far-rev-1-2-90\",\"questionId\":\"x-far-rev-1\",\"label\":\"Recognise → allocate → price → obligations → contract\",\"isCorrect\":false,\"feedback\":\"This is reversed.\",\"sortOrder\":2},{\"id\":\"a-x-far-rev-1-3-91\",\"questionId\":\"x-far-rev-1\",\"label\":\"Obligations → recognise → contract → price → allocate\",\"isCorrect\":false,\"feedback\":\"Incorrect order.\",\"sortOrder\":3}]},{\"id\":\"q-far-2\",\"topicId\":\"t-far-tax\",\"type\":\"mcq\",\"difficulty\":\"hard\",\"stem\":\"An asset has a carrying amount of £100,000 and a tax base of £60,000. The tax rate is 25%. What deferred tax balance arises?\",\"explanation\":\"Carrying amount \u003e tax base gives a taxable temporary difference of £40,000, so a deferred tax liability of £40,000 × 25% = £10,000.\",\"workedSolution\":\"Temp diff = 100,000 − 60,000 = 40,000\\nDT liability = 40,000 × 25% = £10,000\",\"relatedConcepts\":[\"Temporary differences\",\"Tax base\"],\"rating\":1400,\"estSeconds\":60,\"isPublished\":true,\"answers\":[{\"id\":\"a-q-far-2-0-12\",\"questionId\":\"q-far-2\",\"label\":\"Deferred tax liability £10,000\",\"isCorrect\":true,\"feedback\":\"Correct — a taxable temporary difference creates a DT liability.\",\"sortOrder\":0},{\"id\":\"a-q-far-2-1-13\",\"questionId\":\"q-far-2\",\"label\":\"Deferred tax asset £10,000\",\"isCorrect\":false,\"feedback\":\"An asset arises from deductible differences (carrying \u003c tax base).\",\"sortOrder\":1},{\"id\":\"a-q-far-2-2-14\",\"questionId\":\"q-far-2\",\"label\":\"Deferred tax liability £25,000\",\"isCorrect\":false,\"feedback\":\"You have applied the rate to the carrying amount, not the difference.\",\"sortOrder\":2},{\"id\":\"a-q-far-2-3-15\",\"questionId\":\"q-far-2\",\"label\":\"No deferred tax arises\",\"isCorrect\":false,\"feedback\":\"A £40,000 temporary difference exists.\",\"sortOrder\":3}]},{\"id\":\"x-far-tax-1\",\"topicId\":\"t-far-tax\",\"difficulty\":\"hard\",\"stem\":\"A liability has a carrying amount of £50,000 and a tax base of £nil (the related expense is deductible only when paid). The tax rate is 25%. What deferred tax asset arises (£)?\",\"explanation\":\"Carrying amount of a liability \u003e tax base gives a deductible temporary difference, creating a deferred tax asset.\",\"workedSolution\":\"Temp diff = 50,000 − 0 = 50,000 (deductible)\\nDT asset = 50,000 × 25% = £12,500\",\"relatedConcepts\":[\"Deductible temporary difference\",\"Deferred tax asset\"],\"numericAnswer\":12500,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"q-aa-1\",\"topicId\":\"t-aa-plan\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Which best describes 'performance materiality'?\",\"explanation\":\"Performance materiality is set below overall materiality to reduce the probability that the aggregate of uncorrected and undetected misstatements exceeds overall materiality.\",\"relatedConcepts\":[\"Materiality\",\"Audit risk\"],\"rating\":1200,\"estSeconds\":60,\"isPublished\":true,\"answers\":[{\"id\":\"a-q-aa-1-0-16\",\"questionId\":\"q-aa-1\",\"label\":\"An amount set below overall materiality to allow for aggregation risk\",\"isCorrect\":true,\"feedback\":\"Correct.\",\"sortOrder\":0},{\"id\":\"a-q-aa-1-1-17\",\"questionId\":\"q-aa-1\",\"label\":\"The same as overall materiality\",\"isCorrect\":false,\"feedback\":\"It is deliberately set lower.\",\"sortOrder\":1},{\"id\":\"a-q-aa-1-2-18\",\"questionId\":\"q-aa-1\",\"label\":\"The level above which the auditor resigns\",\"isCorrect\":false,\"feedback\":\"That is not what materiality means.\",\"sortOrder\":2},{\"id\":\"a-q-aa-1-3-19\",\"questionId\":\"q-aa-1\",\"label\":\"A figure set by the client\",\"isCorrect\":false,\"feedback\":\"Materiality is the auditor's judgement.\",\"sortOrder\":3}]},{\"id\":\"x-aa-plan-1\",\"topicId\":\"t-aa-plan\",\"type\":\"scenario\",\"difficulty\":\"hard\",\"scenario\":\"You are planning the audit of Delta Ltd. The directors' bonuses are based on reported profit, and the company is close to breaching a bank loan covenant based on the year-end current ratio.\",\"stem\":\"Which audit risk is most directly raised by these two facts?\",\"explanation\":\"Both facts create incentives to manipulate the financial statements (overstate profit; improve the current ratio), increasing the risk of material misstatement due to fraud/management bias.\",\"relatedConcepts\":[\"Audit risk\",\"Management bias\",\"Fraud risk\"],\"rating\":1400,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-x-aa-plan-1-0-68\",\"questionId\":\"x-aa-plan-1\",\"label\":\"Increased risk of material misstatement from management bias/manipulation\",\"isCorrect\":true,\"feedback\":\"Correct — bonus and covenant pressures incentivise manipulation.\",\"sortOrder\":0},{\"id\":\"a-x-aa-plan-1-1-69\",\"questionId\":\"x-aa-plan-1\",\"label\":\"Increased detection risk only\",\"isCorrect\":false,\"feedback\":\"Detection risk relates to the auditor's procedures, not client incentives.\",\"sortOrder\":1},{\"id\":\"a-x-aa-plan-1-2-70\",\"questionId\":\"x-aa-plan-1\",\"label\":\"Reduced inherent risk\",\"isCorrect\":false,\"feedback\":\"These pressures increase, not reduce, inherent risk.\",\"sortOrder\":2},{\"id\":\"a-x-aa-plan-1-3-71\",\"questionId\":\"x-aa-plan-1\",\"label\":\"No effect on audit risk\",\"isCorrect\":false,\"feedback\":\"These are classic fraud risk factors.\",\"sortOrder\":3}]},{\"id\":\"q-fm-1\",\"topicId\":\"t-fm-inv\",\"type\":\"calc\",\"difficulty\":\"medium\",\"stem\":\"A project costs £100,000 now and returns £60,000 at the end of year 1 and £60,000 at the end of year 2. At a 10% discount rate (DF1=0.909, DF2=0.826), what is the NPV to the nearest £?\",\"explanation\":\"NPV = −100,000 + 60,000×0.909 + 60,000×0.826.\  = £180,000\",\"relatedConcepts\":[\"Goodwill\",\"Non-controlling interest\"],\"rating\":1400,\"estSeconds\":60,\"isPublished\":true,\"answers\":[{\"id\":\"a-q-cr-1-0-32\",\"questionId\":\"q-cr-1\",\"label\":\"£180,000\",\"isCorrect\":true,\"feedback\":\"Correct — 500,000 + 80,000 NCI − 400,000.\",\"sortOrder\":0},{\"id\":\"a-q-cr-1-1-33\",\"questionId\":\"q-cr-1\",\"label\":\"£100,000\",\"isCorrect\":false,\"feedback\":\"This ignores the NCI share under the proportionate method.\",\"sortOrder\":1},{\"id\":\"a-q-cr-1-2-34\",\"questionId\":\"q-cr-1\",\"label\":\"£260,000\",\"isCorrect\":false,\"feedback\":\"This uses full goodwill / fair-value NCI, not stated here.\",\"sortOrder\":2},{\"id\":\"a-q-cr-1-3-35\",\"questionId\":\"q-cr-1\",\"label\":\"£500,000\",\"isCorrect\":false,\"feedback\":\"This is the consideration, not goodwill.\",\"sortOrder\":3}]},{\"id\":\"x-far-cons-1\",\"topicId\":\"t-far-cons\",\"difficulty\":\"hard\",\"stem\":\"P acquired 75% of S for £600,000. At acquisition S's net assets were £640,000. NCI is measured at fair value of £190,000. What is goodwill under the full goodwill method (£)?\",\"explanation\":\"Full goodwill = consideration + fair value of NCI − fair value of net assets acquired.\",\"workedSolution\":\"Goodwill = 600,000 + 190,000 − 640,000 = £150,000\",\"relatedConcepts\":[\"Full goodwill\",\"NCI at fair value\"],\"numericAnswer\":150000,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true}]}]}]\n"])</script><script>self.__next_f.push([1,"d:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"15:I[27201,[\"/ACA/_next/static/chunks/2e0hb19g1zecl.js\",\"/ACA/_next/static/chunks/1ntn7efqc-iiw.js\"],\"IconMark\"]\na:null\nf:[[\"$\",\"title\",\"0\",{\"children\":\"Professional Level — Mixed Mock · ACA Academy\"}],[\"$\",\"meta\",\"1\",{\"name
