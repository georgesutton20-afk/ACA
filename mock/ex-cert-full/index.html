swers\":[{\"id\":\"a-x-ass-proc-1-0-16\",\"questionId\":\"x-ass-proc-1\",\"label\":\"A three-party relationship\",\"isCorrect\":true,\"feedback\":\"Correct — practitioner, responsible party and intended users.\",\"sortOrder\":0},{\"id\":\"a-x-ass-proc-1-1-17\",\"questionId\":\"x-ass-proc-1\",\"label\":\"Suitable criteria\",\"isCorrect\":true,\"feedback\":\"Correct — benchmarks against which the subject matter is evaluated.\",\"sortOrder\":1},{\"id\":\"a-x-ass-proc-1-2-18\",\"questionId\":\"x-ass-proc-1\",\"label\":\"Sufficient appropriate evidence\",\"isCorrect\":true,\"feedback\":\"Correct — to support the conclusion.\",\"sortOrder\":2},{\"id\":\"a-x-ass-proc-1-3-19\",\"questionId\":\"x-ass-proc-1\",\"label\":\"A guarantee that no errors exist\",\"isCorrect\":false,\"feedback\":\"No engagement provides absolute assurance.\",\"sortOrder\":3}]},{\"id\":\"q-law-1\",\"topicId\":\"t-law-con\",\"type\":\"mcq\",\"difficulty\":\"easy\",\"stem\":\"Which of these is NOT an essential element for a valid simple contract?\",\"explanation\":\"Offer, acceptance, consideration and intention to create legal relations are essential. Writing is generally not required for a simple contract.\",\"relatedConcepts\":[\"Contract formation\",\"Consideration\"],\"rating\":1050,\"estSeconds\":60,\"isPublished\":true,\"answers\":[{\"id\":\"a-q-law-1-0-24\",\"questionId\":\"q-law-1\",\"label\":\"The contract must be in writing\",\"isCorrect\":true,\"feedback\":\"Correct — most simple contracts need not be written.\",\"sortOrder\":0},{\"id\":\"a-q-law-1-1-25\",\"questionId\":\"q-law-1\",\"label\":\"Offer and acceptance\",\"isCorrect\":false,\"feedback\":\"This is essential.\",\"sortOrder\":1},{\"id\":\"a-q-law-1-2-26\",\"questionId\":\"q-law-1\",\"label\":\"Consideration\",\"isCorrect\":false,\"feedback\":\"This is essential.\",\"sortOrder\":2},{\"id\":\"a-q-law-1-3-27\",\"questionId\":\"q-law-1\",\"label\":\"Intention to create legal relations\",\"isCorrect\":false,\"feedback\":\"This is essential.\",\"sortOrder\":3}]},{\"id\":\"x-law-con-1\",\"topicId\":\"t-law-con\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Goods are displayed in a shop window with a price tag. In contract law this display is generally:\",\"explanation\":\"A display of goods is an invitation to treat, not an offer. The customer makes the offer at the till, which the retailer may accept or reject.\",\"relatedConcepts\":[\"Invitation to treat\",\"Offer and acceptance\"],\"rating\":1200,\"estSeconds\":75,\"isPublished\":true,\"answers\":[{\"id\":\"a-x-law-con-1-0-40\",\"questionId\":\"x-law-con-1\",\"label\":\"An invitation to treat\",\"isCorrect\":true,\"feedback\":\"Correct — the customer makes the offer; the shop accepts it.\",\"sortOrder\":0},{\"id\":\"a-x-law-con-1-1-41\",\"questionId\":\"x-law-con-1\",\"label\":\"A firm offer the shop must honour\",\"isCorrect\":false,\"feedback\":\"A display is not an offer.\",\"sortOrder\":1},{\"id\":\"a-x-law-con-1-2-42\",\"questionId\":\"x-law-con-1\",\"label\":\"Acceptance of an offer\",\"isCorrect\":false,\"feedback\":\"No offer has yet been made.\",\"sortOrder\":2},{\"id\":\"a-x-law-con-1-3-43\",\"questionId\":\"x-law-con-1\",\"label\":\"A binding contract\",\"isCorrect\":false,\"feedback\":\"No contract exists until offer and acceptance.\",\"sortOrder\":3}]},{\"id\":\"q-mi-1\",\"topicId\":\"t-mi-cvp\",\"type\":\"calc\",\"difficulty\":\"medium\",\"stem\":\"A product sells for £40 with variable costs of £25 per unit. Fixed costs are £60,000. How many units must be sold to break even?\",\"explanation\":\"Breakeven units = fixed costs ÷ contribution per unit. Contribution = £40 − £25 = £15.\",\"workedSolution\":\"Contribution = 40 − 25 = £15\\nBreakeven = 60,000 ÷ 15 = 4,000 units\",\"relatedConcepts\":[\"Contribution\",\"Margin of safety\"],\"numericAnswer\":4000,\"numericTolerance\":0,\"unit\":\"units\",\"rating\":1220,\"estSeconds\":90,\"isPublished\":true},{\"id\":\"q-mi-2\",\"topicId\":\"t-mi-cvp\",\"type\":\"calc\",\"difficulty\":\"hard\",\"stem\":\"Using the same product (price £40, variable cost £25, fixed costs £60,000), if budgeted sales are 5,000 units, what is the margin of safety as a %? Give your answer to the nearest whole percent.\",\"explanation\":\"Margin of safety % = (budgeted − breakeven) ÷ budgeted. Breakeven is 4,000 units.\",\"workedSolution\":\"MoS = (5,000 − 4,000) ÷ 5,000 = 20%\",\"relatedConcepts\":[\"Breakeven\",\"Margin of safety\"],\"numericAnswer\":20,\"numericTolerance\":0,\"unit\":\"%\",\"rating\":1380,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"q-tax-1\",\"topicId\":\"t-tax-it\",\"type\":\"calc\",\"difficulty\":\"medium\",\"stem\":\"An individual has employment income of £50,000 and the personal allowance is £12,570. Using a basic rate of 20% on the basic-rate band (next £37,700), what is the income tax on their non-savings income?\",\"explanation\":\"Taxable income = 50,000 − 12,570 = £37,430, all within the basic-rate band, taxed at 20%.\",\"workedSolution\":\"Taxable = 50,000 − 12,570 = 37,430\\nTax = 37,430 × 20% = £7,486\",\"relatedConcepts\":[\"Personal allowance\",\"Tax bands\"],\"numericAnswer\":7486,\"numericTolerance\":1,\"unit\":\"£\",\"rating\":1240,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"x-tax-it-1\",\"topicId\":\"t-tax-it\",\"difficulty\":\"hard\",\"stem\":\"For 2024/25, an individual has adjusted net income of £110,000. The personal allowance is £12,570 and is reduced by £1 for every £2 of income above £100,000. What is their reduced personal allowance (£)?\",\"explanation\":\"Income exceeds £100,000 by £10,000; the allowance is reduced by £10,000 ÷ 2 = £5,000.\",\"workedSolution\":\"Excess = 110,000 − 100,000 = 10,000\\nReduction = 10,000 ÷ 2 = 5,000\\nPA = 12,570 − 5,000 = £7,570\",\"relatedConcepts\":[\"Personal allowance taper\",\"Adjusted net income\"],\"numericAnswer\":7570,\"numericTolerance\":0,\"unit\":\"£\",\"type\":\"calc\",\"rating\":1400,\"estSeconds\":120,\"isPublished\":true},{\"id\":\"q-btf-1\",\"topicId\":\"t-btf-fin\",\"type\":\"mcq\",\"difficulty\":\"medium\",\"stem\":\"Which source of finance typically carries the lowest cost to a profitable company, ignoring issue costs?\",\"explanation\":\"Debt is usually cheaper than equity because interest is tax-deductible and lenders bear less risk than shareholders.\",\"relatedConcepts\":[\"Cost of capital\",\"Gearing\"],\"rating\":1200,\"estSeconds\":60,\"isPublished\":true,\"answers\":[{\"id\":\"a-q-btf-1-0-28\",\"questionId\":\"q-btf-1\",\"label\":\"Debt finance\",\"isCorrect\":true,\"feedback\":\"Correct — interest is tax-deductible and lower risk than equity.\",\"sortOrder\":0},{\"id\":\"a-q-btf-1-1-29\",\"questionId\":\"q-btf-1\",\"label\":\"Ordinary shares\",\"isCorrect\":false,\"feedback\":\"Equity is generally the most expensive source.\",\"sortOrder\":1},{\"id\":\"a-q-btf-1-2-30\",\"questionId\":\"q-btf-1\",\"label\":\"Retained earnings at the cost of equity\",\"isCorrect\":false,\"feedback\":\"This carries the cost of equity, higher than debt.\",\"sortOrder\":2},{\"id\":\"a-q-btf-1-3-31\",\"questionId\":\"q-btf-1\",\"label\":\"Preference shares\",\"isCorrect\":false,\"feedback\":\"Usually between debt and ordinary equity.\",\"sortOrder\":3}]},{\"id\":\"x-btf-fin-1\",\"topicId\":\"t-btf-fin\",\"difficulty\":\"medium\",\"stem\":\"A company has inventory days of 60, receivables days of 45 and payables days of 30. What is the length of its working-capital (cash operating) cycle in days?\",\"explanation\":\"Cycle = inventory days + receivables days − payables days.\",\"workedSolution\":\"60 + 45 − 30 = 75 days\",\"relatedConcepts\":[\"Working capital cycle\",\"Liquidity\"],\"numericAnswer\":75,\"numericTolerance\":0,\"unit\":\"days\",\"type\":\"calc\",\"rating\":1200,\"estSeconds\":120,\"isPublished\":true}]}]}]\n"])</script><script>self.__next_f.push([1,"d:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>
