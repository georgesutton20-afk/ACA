name: Deploy to GitHub Pages

# Builds the Next.js static export and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → "Build and deployment" → Source:
# "GitHub Actions". (Do this once; then every push here redeploys.)

on:
  push:
    branches:
      - main
      - claude/sleepy-planck-uvoqse
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel older in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        # basePath must match the repo name so assets resolve at
        # https://<owner>.github.io/<repo>/
        # The Supabase URL + publishable (anon) key are public by design —
        # security comes from row-level security, not from hiding the key.
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_USE_SUPABASE: "true"
          NEXT_PUBLIC_SUPABASE_URL: https://tudzfkgcydxgsqnarowp.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_m8_2QBpPLi2IKgYllhA6uw_0HUoTHvP
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
